profile:
  id: hong-yoonpyo
  name: 홍윤표
  nameEn: Hong Yoonpyo
  role: 소프트웨어 개발자
  tagline: C++로 로봇·드론 시뮬레이터와 실시간 시스템을 구현하고, 계측 조건과 검증 범위를 함께 설명합니다.
  summary:
  - DroneSim에서 고정 Tick 비행 시뮬레이션, AirSim 강체 물리 연결, UDP 지상통제와 다중 드론 JSON 시나리오를 구현했습니다. 공개 Release 측정에서 64대 분리 배치의 Tick p95는 493.9µs에서 137.7µs로, 밀집 32대 배치의 p95 중앙값은 1,344.3µs에서 665.1µs로 감소했습니다. 두 비교는 각각 전후 3회 측정이며 해당 조건 밖의 성능을 보장하지 않습니다.
  - 공개 프로젝트 기록에서 구현 내용과 측정 조건을 함께 설명합니다.
  email: cgantro@gmail.com
  github: https://github.com/cgantro
  location: 대한민국
  portrait:
    src: /assets/증사.jpg
