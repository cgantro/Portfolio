profile:
  id: hong-yoonpyo
  name: 홍윤표
  nameEn: Hong Yoonpyo
  role: 시뮬레이션·실시간 통신 소프트웨어 개발자
  tagline: 시뮬레이션과 실시간 통신 기능을 설계하고 구현합니다.
  summary:
  - 'DroneSim: 화면 조작과 JSON 시나리오가 같은 C++ 고정 주기 시뮬레이션을 사용하도록 구성하고, 다중 드론 충돌 계산을 개선했습니다.'
  - 'RobotPal: 카메라 영상 송신 중 화면 갱신이 느려지는 문제를 찾아 JPEG 압축을 별도 작업자로 옮겼습니다.'
  - '영묘: 단일 UE5 전용 서버에서 게임 방별 상태를 나누고, UDP 음성 서버에 세션 검사와 방별 작업 분배를 구현했습니다.'
  email: cgantro@gmail.com
  github: https://github.com/cgantro
  location: 대한민국
  portrait:
    src: /assets/증사.jpg
    alt: 홍윤표 프로필 사진
  links:
