id: mausoleum
title: 영묘 (Mausoleum)
subtitle: UE5 협동 멀티플레이 게임의 서버·실시간 음성 통신
category: 실시간 음성 통신과 온라인 게임 서버
summary:
  - 협동 게임 중 룸·거리 정책에 따라 음성을 전달하고 재생하는 기능을 클라이언트와 서버에 구현했습니다.
period: 2026.02 – 2026.03
startDate: '2026-02-24'
endDate: '2026-03-27'
status: complete
team: 6인
role:
- WebSocket 로비와 UE5 전용 서버의 방별 상태·페이즈 관리
- UDP 음성 패킷·세션 검사, 방 코드별 워커 분배와 음성 중계
- 마이크 캡처·Opus 처리·화자별 재생 및 상태별 청취 정책 구현
stack:
- C++
- Unreal Engine 5
- WebSocket
- UDP
- Opus
- HRTF
cover:
  src: /assets/영묘.png
  alt: 영묘 협동 게임 타이틀 화면
architecture:
  src: /assets/mausoleum-system-architecture.svg
  alt: 언리얼 엔진 5 게임 클라이언트가 방을 관리하는 로비, 게임 진행 서버, 음성 전달 서버에 각각 연결되는 구성도
  summary:
  - WebSocket 로비는 방·참가자를 관리하고, UE5 전용 서버는 방별 게임 상태와 페이즈를 처리합니다.
  - 음성은 마이크 캡처 → Opus 인코딩 → UDP 중계 → 화자별 디코딩 → HRTF 재생 순서로 처리합니다.
  - UDP 서버는 패킷·세션을 확인해 방별 참가자에게 중계하고, 클라이언트는 거리·플레이어 상태에 따라 청취 여부를 결정합니다.
detail:
  layout: mausoleum
  overview: 여러 플레이어가 아이템을 수집하고 석상을 함께 조작해 탈출하는 UE5 협동 게임입니다. 단일 전용 서버에서 여러 게임 방을 운영하며, 로비 전체 음성과 게임 내 거리·상태별 음성 대화를 지원합니다.
  features:
  - title: 게임 로비
    description: 방 생성·입장·퇴장, 참가자 관리와 채팅
    evidenceIds: [mausoleum-public]
  - title: 방별 멀티플레이
    description: 하나의 전용 서버에서 여러 방의 게임을 동시에 진행하고, 방마다 게임 단계와 이벤트를 따로 관리
    implementation: 로비가 방과 참가자를 관리하고 UE5 전용 서버는 RoomCode로 게임 공간·페이즈·이벤트를 구분합니다. 한 방이 끝날 때 해당 방의 상태만 정리합니다.
    evidenceIds: [mausoleum-public]
  - title: 로비 음성 채팅
    description: 로비 참가자끼리 음성으로 대화하고, 게임 안에서는 가까운 플레이어의 음성을 들음
    implementation: 마이크 PCM을 Opus로 압축해 UDP로 보내면 음성 서버가 세션과 방을 확인해 같은 방 참가자에게 전달합니다. 클라이언트는 화자별로 풀어 재생합니다.
    evidenceIds: [mausoleum-public]
  - title: 공간 음향
    description: 화자의 위치와 거리, 생존·사망·관전 상태에 따라 들을 수 있는 음성을 구분
    implementation: 수신 음성의 화자 위치와 플레이어 상태를 확인해 청취 대상을 정하고, 방향·거리에 맞춰 HRTF로 재생합니다.
    evidenceIds: [mausoleum-public]
  roleAreas:
  - title: 로비·게임 서버
    items:
    - text: WebSocket 로비에서 방·참가자를 관리하고 UE5 전용 서버와 연결
      evidenceIds: [mausoleum-public]
    - text: 방마다 게임 공간·진행 단계·이벤트·아이템 생성 관리
      evidenceIds: [mausoleum-public, mausoleum-room-tests]
  - title: UDP 음성 서버
    items:
    - text: 음성 패킷과 참가자 정보를 확인한 뒤 해당 방에 전달
      evidenceIds: [mausoleum-voice-tests]
    - text: 방별로 음성 처리 작업을 나누고 밀린 작업을 관리
      evidenceIds: [mausoleum-voice-tests]
    - text: 같은 방 참가자에게 음성 전달, 운영체제별 네트워크 처리를 분리
      evidenceIds: [mausoleum-public]
  - title: 음성 클라이언트
    items:
    - text: 마이크 음성을 압축해 UDP로 보내고, 화자별로 풀어 재생
      evidenceIds: [mausoleum-public]
    - text: 로비와 게임의 음성 규칙을 나누고 플레이어 상태·거리·방향에 맞춰 재생
      evidenceIds: [mausoleum-public]
  troubleshooting:
  - title: 단일 전용 서버의 방별 게임 상태 분리
    symptom: 하나의 UE 월드에서 여러 게임 방을 운영하므로, 한 방의 페이즈 진행·보상·종료 처리를 다른 방과 분리해야 했습니다.
    cause: 플레이 공간에 오프셋을 주는 것만으로는 상태 조회와 이벤트 대상이 나뉘지 않아, 게임 진행과 레벨 수명을 관리할 공통 방 식별자가 필요했습니다.
    solution: "`RoomCode`를 공통 기준으로 삼아 `RoomRuntimeSubsystem`에서 방별 레벨 수명을, 페이즈 서브시스템에서 진행 상태와 보상 수량을 관리했습니다. 방을 중단할 때 해당 방의 상태와 레벨만 정리하도록 처리했습니다."
    verification: 상태 객체 단위 자동화 테스트에 방 A·B의 보상 수량과 페이즈 진행 분리, 한 방 중단 후 다른 방 유지, 중복 중단·재생성 검사를 작성했습니다.
    evidenceIds: [mausoleum-public, mausoleum-room-tests]
    metricIds: []
  - title: 게임 창 복귀 뒤 오래된 마이크 입력이 섞임
    symptom: 게임 창을 백그라운드로 두었다가 돌아오면 마이크 입력 버퍼에 쌓인 PCM이 뒤늦게 인코딩·전송되어 과거 음성이 새 대화에 섞였습니다.
    cause: 포커스가 바뀌는 동안 VoiceCapture의 PCM 버퍼와 Opus 인코더 상태를 비우지 않아, 복귀 뒤 오래된 데이터까지 새 입력처럼 처리했습니다.
    solution: '`ProcessCapture()`에서 포커스가 없으면 캡처 버퍼를 비우고 인코더를 다시 초기화합니다. 포커스 복귀 뒤에도 8KB를 넘는 입력은 버리고, 한 번의 처리에서 읽는 양은 4KB로 제한합니다.'
    verification: 게임 창을 백그라운드에 둔 뒤 다시 열고, 이후 새로 말한 음성부터 전달되는지 수동으로 확인했습니다.
    evidenceIds: [mausoleum-public]
    metricIds: []
    code:
      path: A302/Source/A302Client/Voice/Capture/VoiceCaptureProcessor.cpp
      language: cpp
      title: 포커스가 없는 동안 PCM 버퍼와 Opus 상태 비우기
      url: https://github.com/cgantro/Mausoleum/blob/main/A302/Source/A302Client/Voice/Capture/VoiceCaptureProcessor.cpp
      source: |
        if (!FApp::HasFocus())
        {
            DrainAllCaptureData();
            ResetCodecForRealtime();
            return;
        }
