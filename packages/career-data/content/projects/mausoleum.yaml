limitations:
- 16kHz, 20ms, 24kbps는 설정값입니다. 실측 음성 지연이나 패킷 손실 개선 수치로 제시하지 않습니다.
- 방별 작업 분배와 공유 페이로드의 효과에 대한 재현 가능한 벤치마크는 포함되지 않습니다.
- 공개 요약과 상세 문서에서 Protocol Buffers 사용 범위가 다릅니다. UDP 음성 패킷이 모두 Protobuf라고 단정하지 않습니다.
- 상세 문서는 Dockerfile과 Jenkinsfile이 미완료라고 기록합니다. CI/CD 완성을 기여나 성과에 포함하지 않습니다.
