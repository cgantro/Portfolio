outcomes:
- id: mausoleum-outcome-1
  text: 마이크 입력부터 Opus 압축과 복원, UDP 전송, 스피커 재생까지 한 흐름으로 연결했습니다. Opus는 실시간 음성의 데이터 크기를 줄이는 압축 방식입니다. 화자마다 압축 상태를 따로
    두고, 한 채널 음성을 초당 16,000번 읽어 0.02초 조각으로 나눈 뒤 초당 24킬로비트로 압축했습니다. FEC는 음성 데이터가 빠졌을 때 복구 정보를 보내는 기능이고, DTX는 말하지 않을
    때 전송량을 줄이는 기능입니다.
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-outcome-2
  text: 각 방을 식별하는 코드로 작업 담당자를 정해 같은 방의 음성 데이터는 늘 같은 작업 흐름으로 보냈습니다. 같은 방에서는 먼저 들어온 데이터부터 처리하고, 다른 방은 여러 작업 흐름에 나눠
    맡깁니다. 한 번 받은 음성 데이터를 여러 참가자에게 보낼 때는 같은 데이터를 공유해 불필요한 복사를 줄였습니다.
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-outcome-3
  text: Protocol Buffers는 데이터를 정해진 항목과 형식으로 묶어 서로 다른 프로그램이 함께 읽게 하는 메시지 형식입니다. 받은 데이터의 길이와 방, 보낸 사람을 나타내는 표식을 확인하고
    해당 방의 대기열로 전달합니다. 담당 작업 흐름은 방의 음성 참가자에게 데이터를 중계하고, 여러 명에게 보낼 때 같은 데이터를 공유합니다.
  evidenceIds:
  - mausoleum-public
  status: reported
