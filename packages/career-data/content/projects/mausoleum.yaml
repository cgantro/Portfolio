id: mausoleum
title: 영묘 (Mausoleum)
subtitle: UE5 협동 게임을 위한 UDP 음성 서버
category: 실시간 음성 통신과 온라인 게임 서버
summary:
  - 협동 게임 중 룸·거리 정책에 따라 음성을 전달하고 재생하는 기능을 클라이언트와 서버에 구현했습니다.
period: 2026.02 – 2026.03
startDate: '2026-02-24'
endDate: '2026-03-27'
status: complete
team: 6인
role:
- UPrivateVoiceChatComponent를 중심으로 UE5 클라이언트의 마이크 캡처, 화자별 Opus 처리, UDP 송수신과 음성 재생 구현
- C++ 음성 서버의 패킷·세션 확인, 룸별 워커 분배와 음성 중계 구현
- 로비의 룸 전체 음성과 게임 내 거리 기반 음성 전달 전략 분리
- Windows·Linux 네트워크 이벤트 루프 분리와 포커스 복귀 뒤 캡처 버퍼·인코더 초기화
- 전용 게임 서버 리팩터링과 페이즈 연동 아이템 생성 구현
stack:
- C++
- Unreal Engine 5
- UDP
- Opus
- 워커 스레드
cover:
  src: /assets/영묘.png
  alt: 영묘 (Mausoleum) 프로젝트 화면
architecture:
  src: /assets/mausoleum-system-architecture.svg
  alt: 언리얼 엔진 5 게임 클라이언트가 방을 관리하는 로비, 게임 진행 서버, 음성 전달 서버에 각각 연결되는 구성도
  summary:
  - UE5 클라이언트는 마이크 입력을 화자별로 인코딩해 서버에 보내고, 수신 음성을 화자별로 복원합니다.
  - C++ UDP 서버는 패킷과 세션을 확인하고 룸 코드에 따라 작업 큐를 선택합니다.
  - 게임 모드에 따라 로비 룸 전체 또는 게임 내 거리 필터를 적용해 음성을 전달합니다.
links:
  github: https://github.com/cgantro/Mausoleum
  demo: null
contributions:
- id: mausoleum-contribution-1
  text: 언리얼 엔진 5 음성 기능에서 마이크 입력, 화자별 압축, 음성 전송과 재생 구현
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-contribution-2
  text: C++ 음성 서버의 데이터 검사, 방 식별 코드별 작업 분배와 음성 중계 구현
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-contribution-3
  text: 웹소켓 로비와 화면을 그리지 않고 게임을 진행하는 전용 서버를 연결하고 단계별 아이템 생성을 연동
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-contribution-4
  text: Linux와 Windows의 네트워크 처리를 구성하고 백그라운드에서 돌아온 뒤 오래된 음성 대기열을 비우도록 처리
  evidenceIds:
  - mausoleum-public
  status: reported
outcomes:
- id: mausoleum-outcome-1
  text: 마이크 입력은 Opus로 인코딩해 UDP로 보내고, 수신 음성은 화자별 디코더 상태로 복원해 재생했습니다. 송신 인코더에는 16 kHz 단일 채널, 20 ms 프레임, 24 kbps와 FEC·DTX 설정을 적용했습니다. 이 설정만으로 패킷 손실 복구가 확인된 것은 아닙니다.
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-outcome-2
  text: 룸 코드 해시로 음성 패킷을 워커별 작업 큐에 배정했습니다. 같은 룸의 패킷은 같은 큐로 들어가며, 서로 다른 룸은 여러 워커가 처리합니다. 다수 참가자에게 전달할 때는 페이로드를 공유해 복사를 줄였습니다.
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-outcome-3
  text: 서버는 음성 패킷의 길이와 룸·세션 정보를 확인한 뒤 룸 코드에 따라 작업 큐로 보냅니다. 워커는 해당 룸의 참가자에게 패킷을 중계하며, 여러 수신자에게 보낼 때 페이로드를 공유합니다.
  evidenceIds:
  - mausoleum-public
  status: reported
