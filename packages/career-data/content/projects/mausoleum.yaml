id: mausoleum
title: 영묘 (Mausoleum)
subtitle: UE5 협동 게임을 위한 UDP 음성 서버
category: 실시간 음성 통신과 온라인 게임 서버
summary:
  - 협동 게임 중 룸·거리 정책에 따라 음성을 전달하고 재생하는 기능을 클라이언트와 서버에 구현했습니다.
period: 2026.02 – 2026.03
startDate: '2026-02-24'
endDate: '2026-03-27'
status: complete
team: 6인
role:
- UPrivateVoiceChatComponent를 중심으로 UE5 클라이언트의 마이크 캡처, 화자별 Opus 처리, UDP 송수신과 음성 재생 구현
- C++ 음성 서버의 패킷·세션 확인, 룸별 워커 분배와 음성 중계 구현
- 로비의 룸 전체 음성과 게임 내 거리 기반 음성 전달 전략 분리
- Windows·Linux 네트워크 이벤트 루프 분리와 포커스 복귀 뒤 캡처 버퍼·인코더 초기화
- 전용 게임 서버 리팩터링과 페이즈 연동 아이템 생성 구현
stack:
- C++
- Unreal Engine 5
- UDP
- Opus
- 워커 스레드
cover:
  src: /assets/영묘.png
  alt: 영묘 (Mausoleum) 프로젝트 화면
architecture:
  src: /assets/mausoleum-system-architecture.svg
  alt: 언리얼 엔진 5 게임 클라이언트가 방을 관리하는 로비, 게임 진행 서버, 음성 전달 서버에 각각 연결되는 구성도
  summary:
  - UE5 클라이언트는 마이크 입력을 화자별로 인코딩해 서버에 보내고, 수신 음성을 화자별로 복원합니다.
  - C++ UDP 서버는 패킷과 세션을 확인하고 룸 코드에 따라 작업 큐를 선택합니다.
  - 게임 모드에 따라 로비 룸 전체 또는 게임 내 거리 필터를 적용해 음성을 전달합니다.
detail:
  layout: mausoleum
  overview: Unreal Engine 5로 만든 6인 팀 협동 탈출 게임입니다. 플레이어가 던전의 단계별 퍼즐과 사건을 함께 해결하며, 로비와 게임 안에서 음성으로 대화합니다.
  features:
  - title: 방 생성과 입장
    description: 로비에서 방을 만들거나 기존 방에 들어가 팀원과 게임을 시작합니다.
    evidenceIds: [mausoleum-public]
  - title: 협동 게임 진행
    description: 여러 게임 방을 분리해 플레이어와 진행 상태를 관리하고 페이즈에 맞춰 아이템을 생성합니다.
    evidenceIds: [mausoleum-public]
  - title: 로비 음성 대화
    description: 로비에서는 같은 방 참가자에게 음성을 전달하고, 게임에서는 플레이어 사이의 거리를 반영해 들리는 음성을 고릅니다.
    evidenceIds: [mausoleum-public]
  - title: 화자별 음성 재생
    description: Opus로 화자별 음성을 복원하고 HRTF 공간 음향을 적용해 게임 위치에 맞춰 재생합니다.
    evidenceIds: [mausoleum-public]
  roleAreas:
  - title: UE5 음성 클라이언트
    items:
    - text: "`UPrivateVoiceChatComponent`에서 마이크 캡처, 화자별 Opus 인코딩·디코딩, UDP 송수신과 HRTF 재생을 연결했습니다."
      evidenceIds: [mausoleum-public]
    - text: 로비 전체 전달과 게임 내 거리 기반 전달을 나눠 게임 상황에 맞는 음성 대화 정책을 구현했습니다.
      evidenceIds: [mausoleum-public]
  - title: C++ 음성 서버
    items:
    - text: UDP 패킷과 세션을 확인하고 룸 코드 해시로 작업을 분배해 같은 방은 한 큐에서 처리하고 다른 방은 여러 워커가 나눠 처리하도록 했습니다.
      evidenceIds: [mausoleum-public]
    - text: Windows와 Linux의 네트워크 이벤트 처리를 각각 구성했습니다.
      evidenceIds: [mausoleum-public]
    - text: 여러 참가자에게 보낼 때 같은 음성 페이로드를 공유해 복사를 줄였습니다.
      evidenceIds: [mausoleum-public]
  - title: 게임 서버 연동
    items:
    - text: WebSocket 로비에서 방과 세션을 관리하고 전용 게임 서버와 연결했습니다. 서버가 방별 게임 페이즈를 판단하고 단계에 맞는 아이템 생성을 처리하도록 연동했습니다.
      evidenceIds: [mausoleum-public]
  troubleshooting:
  - title: 게임 창으로 돌아온 뒤 오래된 음성이 재생됨
    symptom: 창이 비활성화된 동안 쌓인 마이크 입력이 포커스 복귀 뒤 전송돼, 현재 대화보다 늦은 음성이 재생됐습니다.
    cause: 백그라운드에서 캡처 버퍼와 Opus 인코더의 이전 상태가 남았습니다.
    solution: 창에 포커스가 없을 때 캡처 버퍼를 비우고 인코더 상태를 초기화했습니다. 오래된 입력을 복구하지 않고 새 입력부터 처리합니다.
    verification: 창을 백그라운드로 보냈다가 복귀하는 과정을 확인해, 이전 입력이 밀려 나오지 않고 새 음성부터 재생되는 것을 확인했습니다.
    evidenceIds: [mausoleum-public]
    metricIds: []
