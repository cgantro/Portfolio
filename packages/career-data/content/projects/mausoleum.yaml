id: mausoleum
title: 영묘 (Mausoleum)
subtitle: 언리얼 엔진 5와 C++ 서버를 잇는 실시간 음성 통신
category: C++ 실시간 음성 통신과 온라인 게임 서버
summary:
- 영묘(Mausoleum)는 언리얼 엔진 5 협동 게임에 음성 채팅을 연결한 팀 프로젝트입니다. 게임 클라이언트는 방 상태를 받고, 별도 C++ 서버는 같은 방 참가자끼리 UDP로 음성을 주고받게 합니다.
- 방 식별 코드로 로비·게임 세션·음성 서버를 연결하고, 마이크 입력부터 음성 전송과 재생까지 구현했습니다.
period: 2026.02 – 2026.03
startDate: '2026-02-24'
endDate: '2026-03-27'
status: complete
team: 6인
role:
- 언리얼 엔진 5 음성 기능에서 마이크 입력, 화자별 압축, 음성 전송과 재생 구현
- C++ 음성 서버에서 데이터와 권한을 확인하고, 방 식별 코드에 따라 작업을 나눠 음성을 전달
- 웹소켓 로비와 화면을 그리지 않고 게임을 진행하는 전용 서버를 연결하고 단계별 아이템 생성 연동
- Linux와 Windows의 네트워크 처리를 구성하고, 백그라운드에서 돌아온 뒤 오래된 음성 대기열을 비우도록 처리
stack:
- C++
- 언리얼 엔진 5 게임 개발 도구
- UDP 음성 데이터 전송
- WebSocket 지속 연결
- uWebSockets 통신 라이브러리
- Opus 음성 압축
- Protocol Buffers 메시지 형식
- CMake 빌드 설정
- 여러 작업 스레드 동시 실행
