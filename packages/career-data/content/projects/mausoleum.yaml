outcomes:
- id: mausoleum-outcome-1
  text: 마이크 입력을 Opus로 압축하고 복원해 UDP로 보낸 뒤 스피커에서 재생하도록 연결했습니다. Opus는 실시간 음성의 데이터 크기를 줄이는 압축 방식입니다. 화자마다 압축 상태를 따로
    두고, 한 채널 음성을 초당 16,000번 읽어 0.02초 단위로 나눈 뒤 초당 24킬로비트로 압축했습니다. FEC는 일부 음성 데이터가 빠졌을 때 복구 정보를 보내고, DTX는 말하지 않을
    때 전송량을 줄입니다.
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-outcome-2
  text: 방 식별 코드로 담당 작업 대기열을 정해 같은 방의 음성 데이터는 늘 같은 대기열에 넣었습니다. 같은 방에서는 먼저 들어온 데이터부터 처리하고, 여러 방의 음성은 여러 작업 스레드가 나눠
    맡습니다. 음성을 여러 참가자에게 보낼 때는 같은 데이터를 함께 써 불필요한 복사를 줄였습니다.
  evidenceIds:
  - mausoleum-public
  status: reported
- id: mausoleum-outcome-3
  text: Protocol Buffers는 데이터를 정해진 항목과 형식에 맞춰 묶어 여러 프로그램이 함께 읽을 수 있게 하는 메시지 형식입니다. 서버는 데이터 길이와 방, 보낸 사람을 나타내는 값을 확인한 뒤
    해당 방의 대기열로 보냅니다. 담당 작업 스레드는 방 참가자에게 음성을 전달하고, 여러 명에게 보낼 때는 같은 데이터를 함께 씁니다.
  evidenceIds:
  - mausoleum-public
  status: reported
