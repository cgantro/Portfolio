  summary:
  - 웹소켓 로비 서버는 방 생성과 참가자 정보 동기화를 처리합니다.
  - 언리얼 전용 서버는 화면을 그리지 않은 채 게임 공간과 진행 단계를 관리합니다.
  - C++ 음성 서버는 게임 진행과 별도로 방마다 음성 데이터를 전달합니다.
  - 게임 화면에서는 마이크 입력부터 음성 압축과 송수신, 재생까지 이어지도록 구현했습니다.
