id: mausoleum
title: 영묘 (Mausoleum)
subtitle: 협동 게임의 방별 진행 관리와 실시간 음성 통신
category: 실시간 음성 통신과 온라인 게임 서버
summary:
  - 협동 게임 중 룸·거리 정책에 따라 음성을 전달하고 재생하는 기능을 클라이언트와 서버에 구현했습니다.
period: 2026.02 – 2026.03
startDate: '2026-02-24'
endDate: '2026-03-27'
status: complete
team: 6인
role:
- WebSocket 로비와 UE5 전용 서버의 방별 상태·페이즈 관리
- UDP 음성 패킷·세션 검사, 방 코드별 워커 분배와 음성 중계
- 마이크 캡처·Opus 처리·화자별 재생 및 상태별 청취 정책 구현
stack:
- C++
- Unreal Engine 5
- WebSocket
- UDP
- Opus
- HRTF
cover:
  src: /assets/영묘.png
  alt: 어두운 석상과 불빛 아래 영문 Mausoleum 제목이 표시된 프로젝트 타이틀 아트
architecture:
  src: /assets/mausoleum-system-architecture.svg
  alt: 언리얼 엔진 5 게임 클라이언트가 방을 관리하는 로비, 게임 진행 서버, 음성 전달 서버에 각각 연결되는 구성도
  summary:
  - WebSocket 로비는 방·참가자를 관리하고, UE5 전용 서버는 방별 게임 상태와 페이즈를 처리합니다.
  - 음성은 마이크 캡처 → Opus 인코딩 → UDP 중계 → 화자별 디코딩 → HRTF 재생 순서로 처리합니다.
  - UDP 서버는 패킷·세션을 확인해 방별 참가자에게 중계하고, 클라이언트는 거리·플레이어 상태에 따라 청취 여부를 결정합니다.
detail:
  layout: mausoleum
  overview: 여섯 명이 함께 개발한 UE5 협동 게임입니다. 전용 서버 한 대에서 여러 방의 진행 상태를 나누고, 별도 UDP 음성 서버와 게임 클라이언트를 연결해 방별 음성 대화를 구현했습니다.
  verificationScope:
  - 음성 작업 분배 효과를 비교한 재현 가능한 성능 측정은 없습니다.
  features:
  - title: 게임 로비
    description: 방 생성·입장·퇴장, 참가자 관리와 채팅
    implementation: WebSocket 로비가 방과 참가자 정보를 관리합니다. 방장이 게임을 시작하면 로비 서버가 전용 서버에 시작 요청을 전달하고, 준비 완료 응답을 받은 뒤 방의 게임 시작을 알립니다.
    processSteps:
    - WebSocket으로 방 생성·입장 요청
    - 로비 서버에서 방·참가자 정보 갱신
    - 게임 시작 요청을 전용 서버에 전달
    - 준비 완료 응답 뒤 참가자에게 시작 알림
    evidenceIds: [mausoleum-public]
  - title: 방별 멀티플레이
    description: 하나의 전용 서버에서 여러 방의 게임을 동시에 진행하고, 방마다 게임 단계와 이벤트를 따로 관리
    implementation: 게임 서버는 방 식별자를 기준으로 플레이어·진행 단계·이벤트 대상을 구분합니다. 방의 플레이어가 모두 나가면 해당 방의 진행 타이머와 자원만 정리합니다.
    evidenceIds: [mausoleum-public]
  - title: 로비 음성 채팅
    description: 로비 참가자끼리 음성으로 대화하고, 게임 안에서는 가까운 플레이어의 음성을 들음
    implementation: 클라이언트가 마이크 음성을 Opus로 압축해 UDP로 보내면 음성 서버가 패킷 형식과 방 코드를 확인합니다. 방 코드를 기준으로 작업자를 나눠 처리하고, 같은 방의 다른 참가자에게 패킷을 중계합니다.
    processSteps:
    - 마이크 음성을 압축해 UDP 패킷 전송
    - 서버가 패킷 종류·크기·방 코드 확인
    - 방 코드에 따라 음성 처리 작업자에 전달
    - 같은 방의 다른 참가자에게 중계해 재생
    diagram:
      src: /assets/mausoleum-voice-flow.svg
      alt: 마이크 음성의 Opus 인코딩, UDP 서버의 패킷 확인과 방별 작업 분배, 같은 방 참가자에게 중계하는 흐름
      caption: 음성 서버는 방 코드로 작업을 나누고, 발신자를 제외한 같은 방 참가자에게 패킷을 전달합니다.
      width: 1120
      height: 300
    evidenceIds: [mausoleum-public]
  - title: 공간 음향
    description: 화자의 위치와 거리, 생존·사망·관전 상태에 따라 들을 수 있는 음성을 구분
    implementation: 게임 클라이언트가 화자 위치·거리와 플레이어 생존·사망·관전 상태에 따라 재생 대상을 정하고, 방향과 거리를 반영해 음성을 재생합니다.
    evidenceIds: [mausoleum-public]
  roleAreas:
  - title: 로비·게임 서버
    items:
    - text: WebSocket 로비에서 방·참가자를 관리하고 UE5 전용 서버와 연결
      evidenceIds: [mausoleum-public]
    - text: 방마다 게임 공간·진행 단계·이벤트·아이템 생성 관리
      evidenceIds: [mausoleum-public, mausoleum-room-tests]
  - title: UDP 음성 서버
    items:
    - text: 음성 패킷과 참가자 정보를 확인한 뒤 해당 방에 전달
      evidenceIds: [mausoleum-voice-tests]
    - text: 방별로 음성 처리 작업을 나누고 밀린 작업을 관리
      evidenceIds: [mausoleum-voice-tests]
    - text: 같은 방 참가자에게 음성 전달, 운영체제별 네트워크 처리를 분리
      evidenceIds: [mausoleum-public]
  - title: 음성 클라이언트
    items:
    - text: 마이크 음성을 압축해 UDP로 보내고, 화자별로 풀어 재생
      evidenceIds: [mausoleum-public]
    - text: 로비와 게임의 음성 규칙을 나누고 플레이어 상태·거리·방향에 맞춰 재생
      evidenceIds: [mausoleum-public]
  troubleshooting:
  - title: 단일 전용 서버의 방별 게임 상태 분리
    symptom: 한 서버에서 여러 방을 운영할 때, 한 방의 진행 상황과 보상이 다른 방에 섞이지 않게 해야 했습니다.
    cause: 게임 진행 단계와 이벤트 처리 대상이 방 식별자 없이 공유되면, 한 방의 상태 변경이 다른 방에도 적용될 수 있었습니다.
    solution: 방 식별자를 기준으로 진행 단계와 이벤트 대상을 관리하고, 마지막 참가자가 나간 방의 관련 상태만 정리했습니다.
    verification: 방별 진행·보상 분리와 한 방 종료 후 다른 방의 진행이 유지되는지 확인하는 자동화 테스트를 구성했습니다.
    evidenceIds: [mausoleum-public, mausoleum-room-tests]
    metricIds: []
  - title: 게임 창 복귀 뒤 오래된 마이크 입력이 섞임
    symptom: 게임 창으로 돌아온 뒤, 창을 비운 동안 마이크에 들어온 오래된 음성이 새 대화에 섞였습니다.
    cause: 창이 비활성화된 동안 쌓인 음성 자료를 버리지 않고 다시 처리했습니다.
    solution: 창이 비활성화되면 쌓인 음성 자료를 비우고 음성 압축 상태를 초기화하도록 바꿨습니다.
    verification: 게임 창을 백그라운드에 둔 뒤 다시 열고, 이후 새로 말한 음성부터 전달되는지 수동으로 확인했습니다.
    evidenceIds: [mausoleum-public]
    metricIds: []
    code:
      path: A302/Source/A302Client/Voice/Capture/VoiceCaptureProcessor.cpp
      language: cpp
      title: 창을 비운 동안 들어온 음성 자료 정리
      url: https://github.com/cgantro/Mausoleum/blob/main/A302/Source/A302Client/Voice/Capture/VoiceCaptureProcessor.cpp
      source: |
        if (!FApp::HasFocus())
        {
            DrainAllCaptureData();
            ResetCodecForRealtime();
            return;
        }
