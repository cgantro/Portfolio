id: mausoleum
title: 영묘 (Mausoleum)
subtitle: UE5 클라이언트와 C++ 서버의 실시간 음성 처리
category: C++ 실시간 음성과 온라인 게임 서버
summary:
- 웹소켓은 로비와 연결을 유지해 방 정보를 주고받는 방식입니다. UDP는 전송 순서를 기다리지 않아 지연을 줄일 수 있어 음성 전달에 사용했습니다. 언리얼 전용 서버가 게임을 진행하는 동안 C++ 음성
  서버는 방별 음성을 중계합니다.
- 방 식별 코드를 기준으로 로비, 게임 세션, 음성 서버를 연결하고 마이크 입력부터 음성 전달과 재생까지 구현했습니다.
period: 2026.02 – 2026.03
startDate: '2026-02-24'
endDate: '2026-03-27'
status: complete
team: 6인
role:
- 언리얼 엔진 5 음성 기능에서 마이크 입력, 화자별 압축, 음성 전송과 재생 구현
- C++ 음성 서버의 데이터 검사, 방 식별 코드별 작업 분배와 음성 중계 구현
- 웹소켓 로비와 화면 출력 없이 게임을 진행하는 전용 서버를 연결하고 단계별 아이템 생성 연동
- Linux와 Windows 네트워크 처리를 구성하고 백그라운드 복귀 뒤 음성 지연 처리
stack:
- C++
- 언리얼 엔진 5 게임 개발 도구
- UDP 음성 데이터 전송
- WebSocket 지속 연결
- uWebSockets 통신 라이브러리
- Opus 음성 압축
- Protocol Buffers 메시지 형식
- CMake 빌드 설정
- 여러 작업 흐름 동시 실행
