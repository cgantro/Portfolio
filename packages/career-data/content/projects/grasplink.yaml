id: grasplink
title: GraspLink
subtitle: 관절 계산과 충돌 검사를 연결한 개인 로봇 시뮬레이터
category: C++ 로봇 시뮬레이션
summary:
- 한화 HCR-12A 로봇 팔과 Robotiq 2F-85 집게 장치가 물체를 집어 옮기는 동작을 재현한 C++17 시뮬레이터입니다.
- 순기구학(FK)은 관절 각도에서 각 링크와 TCP(tool center point, 로봇 도구 중심점)의 자세를 계산하고, 역기구학(IK)은 목표 TCP 자세를 만드는 관절 각도를 찾습니다. Flecs
  ECS(Entity-Component-System)는 장면의 로봇과 물체, Transform과 충돌 형상을 나눠 관리하며, Jolt Physics는 강체 운동과 충돌을 계산합니다. OpenGL 렌더러는
  이 장면을 화면에 그립니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- 로봇 3D 모델의 관절 회전축을 실제 관절에 맞추고, 계산한 팔 자세를 화면과 충돌 검사에 함께 반영
- 도구 끝의 목표 위치에서 관절 각도를 찾는 역기구학과 직접 이동, 직선 이동, 장애물 우회 계획 구현
- 정해진 간격으로 물리와 충돌을 계산하고, 충돌 시 직전 안전 자세로 복원하며 6번 관절 복귀와 양쪽 손끝을 이용한 물체 집기 구현
- C++ 시뮬레이터를 브라우저 실행 형식으로 바꾸고 브라우저에서 직접 조작하도록 배포
stack:
- C++17
- OpenGL, GLFW 렌더링
- Flecs ECS
- Jolt Physics
- 순기구학(FK), 역기구학(IK)
- Jacobian, Damped Least Squares(DLS)
- Joint Path Planner, RRT-Connect
- Quaternion SLERP 보간
- Dear ImGui, TinyGLTF, GLB
- CMake, Emscripten, WebAssembly
