  alt: ViewerApp이 GUI, PickPlaceMission, Robotics, Simulation, Scene, Physics, Rendering 모듈을 조립하고 Simulation 어댑터가
    Flecs 장면과 Jolt Physics를 연결하는 GraspLink 전체 시스템 아키텍처
  summary:
  - ViewerApp은 실행 객체의 생성과 수명, 고정 시간 간격의 제어와 물리 루프를 맡는 구성 루트입니다.
  - Robotics는 FK/IK와 관절 경로 계획을 제공하며 Viewer, Flecs, OpenGL에 직접 의존하지 않습니다. Simulation 모듈의 어댑터가 Controller 결과를 Flecs
    Scene과 Jolt PhysicsWorld에 연결하고, Rendering은 Scene과 GLB 자산을 읽어 화면에 표시합니다.
