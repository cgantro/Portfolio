outcomes:
- id: grasplink-outcome-1
  text: GLB는 3D 모델을 저장하는 파일 형식입니다. 모델 안의 관절 회전축과 회전 기준점을 실제 로봇 관절 위치에 맞춘 뒤 관절 각도를 차례로 적용해 팔 각 부분의 위치와 방향을 계산합니다.
    계산한 자세를 OpenGL 화면 모델과 Jolt 물리 엔진의 충돌 검사 형상에 똑같이 적용했습니다. 로봇 팔은 물리 엔진이 임의로 움직이지 않고, 관절 제어 계산이 정한 자세를 따라가도록 구성했습니다.
  evidenceIds:
  - grasplink-public
  status: reported
- id: grasplink-outcome-2
  text: TCP(tool center point)는 로봇 도구 중심점으로, 집게가 물체에 접근하거나 작업 목표를 지정하는 기준입니다. 역기구학(IK)은 목표 TCP 자세에 맞는 관절 각도를 구합니다.
    Jacobian으로 각 관절의 작은 변화가 TCP에 미치는 영향을 계산하고, Damped Least Squares(DLS)로 특이 자세 근처의 수치 불안정과 큰 관절 변화를 완화합니다. 허용 회전
    범위에 닿은 관절은 더 이상 목표에 가까워지는 방향으로 움직일 수 없으므로 계산에서 제외하고, 나머지 관절도 허용 범위 밖으로 나가지 않게 제한합니다. IK는 계산을 시작하는 관절 각도에 따라
    다른 해로 수렴할 수 있습니다. TCP 직선 이동에서는 바로 앞 경로 지점에서 찾은 관절 각도를 다음 IK 계산의 시작값으로 넘겨 팔 자세의 연속성을 유지합니다. 기본 계산으로 목표를 찾지 못하면
    1번, 3번, 5번 관절을 움직여 팔이 다른 방향으로 접히는 자세를 시험합니다. 그래도 실패하면 Halton 방식으로 관절이 움직일 수 있는 범위 전체에서 시험 각도를 고르게 뽑습니다. 이 각도
    조합은 정해진 횟수만 확인하고, 실패는 관절 한계를 넘어야 하는 경우와 허용 오차 안의 각도를 찾지 못한 경우로 나눠 제어기에 전달합니다.
  evidenceIds:
  - grasplink-public
  status: reported
- id: grasplink-outcome-3
  text: '`MovePose`는 도구 끝의 목표 위치와 방향을 관절 각도로 바꾼 뒤, 현재 관절 자세에서 목표까지 직접 움직이는 명령입니다. 현재 각도와 몇 가지 다른 팔 자세를 시도하지만, 이
    명령은 막힌 길을 돌아가는 경로를 찾지 않습니다. 화면의 임무 계획은 먼저 직접 이동할 수 있는지 확인하고, 길이 막힌 경우에만 RRT-Connect를 사용합니다. RRT-Connect는 출발점과
    목표점에서 충돌하지 않는 관절 경로를 각각 뻗어 서로 연결하는 탐색 방식입니다. 계산을 화면 갱신 주기에 나눠 수행하고, 중간 관절 자세까지 검사한 경로만 움직임에 사용합니다. `MovePose`는
    간단한 이동에 쓰고, 계산량이 큰 우회 탐색은 화면 임무 계획에 한정했습니다.'
  evidenceIds:
  - grasplink-public
  status: reported
