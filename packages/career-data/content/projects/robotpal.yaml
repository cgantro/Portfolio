id: robotpal
title: RobotPal
subtitle: JETANK 이동 로봇·로봇팔 제어 시뮬레이터
category: 로봇 시뮬레이션과 실시간 영상 전송
summary:
- 카메라 JPEG 압축이 시뮬레이션 갱신을 늦추는 문제를 측정하고, 압축 작업과 프레임 전송을 분리했습니다.
period: 2025.11 – 2025.12
startDate: 2025-11
endDate: 2025-12
status: complete
team: 4인
role:
- 메인 스레드를 점유하던 JPEG 압축을 별도 작업 스레드로 분리하고, 프레임 대기열과 전송 순서를 관리했습니다.
- 실물 JETANK의 주행값을 측정해 가상 이동 속도를 보정하고, 제어 화면에서 장비 상태 조회와 조작 입력 전달을 연결했습니다.
- 외부 JSON 패킷에서 이동체 모터와 로봇팔 서보 값을 읽어 가상 로봇을 조작했습니다.
stack:
- C++17
- OpenGL
- TCP/WebSocket
- Emscripten
- JPEG
cover:
  src: /assets/로봇팔 시연.webp
  alt: 가상 이동 로봇과 로봇팔이 주행로 위에 있고 왼쪽 위에 카메라 영상 창이 열린 RobotPal 화면
architecture:
  src: /assets/robotpal-system-architecture.svg
  alt: 가상 카메라 영상과 제어 명령이 시뮬레이터와 외부 인식 모듈 사이를 오가는 구조
  summary:
  - FBO 영상은 GPU에서 읽은 뒤 JPEG 작업 대기열과 TCP·WebSocket 전송 경로로 전달합니다.
  - 외부 JSON 명령에 담긴 모터·서보 값을 받아 가상 로봇의 이동과 로봇팔 조작에 반영합니다.
detail:
  layout: robotpal
  overview: JETANK 이동 로봇과 로봇팔을 가상 환경에서 조작하고, 가상 카메라 영상을 외부 인식 프로그램에 전달하는 시뮬레이터입니다. 실물 JETANK의 주행값을 측정해 가상 이동 속도를 보정했습니다. 외부 명령은 가상 로봇에 반영하고, 실물 장비는 제어 화면에서 상태 조회와 조작 입력을 연결합니다.
  verificationScope:
  - 측정은 1232×832 내장 GPU 환경의 보고값이며 영상 수신·디코딩은 포함하지 않았습니다.
  - 카메라 송신률 40.05 FPS는 목표 60 FPS에 미달했습니다.
  features:
  - title: 가상 로봇 조작
    description: 외부 제어 명령으로 이동 로봇의 주행, 로봇팔 관절 이동, 집게 조작을 실행합니다.
    implementation: 외부 제어 패킷에서 JSON을 읽어 모터와 서보 값을 해석하고, 주행 값은 가상 이동체에, 서보 값은 해당 관절에 반영합니다. 가상 이동체의 직진·회전 속도는 실물 JETANK를 반복 주행해 측정한 값을 기준으로 보정했습니다.
    processSteps:
    - 외부 프로그램이 제어 패킷 전송
    - 명령 유형에 따라 이동체·서보 값 해석
    - 가상 로봇의 주행·관절 상태 갱신
    evidenceIds: [robotpal-public]
  - title: 가상 카메라
    description: 시뮬레이터의 가상 카메라 영상을 외부 영상 인식 프로그램에 전송합니다.
    implementation: OpenGL 카메라 화면을 GPU에서 읽어온 뒤 JPEG로 압축합니다. 압축은 최대 6프레임 대기열을 거쳐 작업 스레드 4개가 처리하고, 실행 환경에 따라 TCP 또는 WebSocket으로 전송합니다. 대기열이 가득 차면 오래된 프레임을 버리며, 프레임 번호를 검사해 늦게 끝난 과거 영상이 뒤늦게 전송되지 않도록 합니다.
    processSteps:
    - 가상 카메라 화면 생성
    - 프레임 읽기와 JPEG 압축
    - TCP 또는 WebSocket 연결로 프레임 전송
    diagram:
      src: /assets/robotpal-streaming-flow.svg
      alt: 카메라 프레임을 읽어 JPEG 작업 대기열과 압축 작업자를 거쳐 외부 프로그램에 보내는 흐름
      caption: 캡처한 프레임은 JPEG 압축과 프레임 순서 검사를 거쳐 외부 프로그램으로 전송됩니다.
      width: 1200
      height: 470
    evidenceIds: [robotpal-public]
  - title: 실물 JETANK 연동
    description: 제어 화면에서 실물 JETANK의 상태를 조회하고 조작 명령을 전달합니다.
    implementation: 제어 화면에 실물 장비의 상태 조회와 조작 입력 전달을 연결했습니다. 이 경로는 JSON 명령으로 가상 로봇 상태를 바꾸는 기능과 분리되어 있습니다.
    evidenceIds: [robotpal-public]
  - title: 데스크톱·웹 실행
    description: 데스크톱과 웹 실행 환경에서 제어·영상 통신을 지원합니다.
    implementation: 데스크톱에서는 TCP, 웹 실행에서는 WebSocket 통신 경로를 사용합니다.
    evidenceIds: [robotpal-public]
  roleAreas:
  - title: 실측 기반 주행 보정
    items:
    - text: 실물 JETANK의 주행값을 기준으로 가상 이동체의 직진·회전 속도 보정
      evidenceIds: [robotpal-public]
  - title: 제어 통신
    items:
    - text: 외부 JSON 명령에서 이동체 모터·로봇팔 서보 값을 받아 가상 로봇 상태에 반영
      evidenceIds: [robotpal-public]
    - text: 제어 화면에서 실물 JETANK 상태 조회와 조작 입력 전달 연결
      evidenceIds: [robotpal-public]
  - title: 카메라 스트리밍
    items:
    - text: 가상 화면을 캡처해 JPEG로 압축하고 외부 프로그램에 영상 전송
      evidenceIds: [robotpal-public]
    - text: 데스크톱과 웹 실행 환경에 맞춰 영상 전송 연결
      evidenceIds: [robotpal-public]
  troubleshooting:
  - title: 카메라 스트리밍 중 시뮬레이션 성능 저하
    symptom: 카메라 영상을 보내면 시뮬레이션 갱신률이 102.38 FPS에서 66.70 FPS로 떨어졌습니다. 처음에는 GPU에서 화면을 읽어오는 과정이 원인이라고 봤습니다.
    cause: PBO와 Fence로 GPU 픽셀 읽기를 비동기화했지만 갱신률은 65.60 FPS였습니다. 측정한 JPEG 압축 p50은 16.406ms, 화면 읽기는 1.144ms였고 메인 스레드는 압축을 더 오래 기다렸습니다.
    solution: JPEG 압축을 작업 스레드 4개로 옮겼습니다. 대기열은 인코딩 6프레임, TCP 송신 2프레임으로 제한하고 밀리면 오래된 영상을 버렸습니다. 압축이 늦게 끝난 과거 영상은 프레임 번호를 확인해 보내지 않았습니다.
    verification: 다섯 번 측정한 결과 스트리밍 중 시뮬레이션 갱신률과 카메라 송신률이 모두 개선됐습니다. 측정 조건과 전후 수치는 표에 표시했습니다.
    evidenceIds: [robotpal-benchmark, robotpal-public]
    metricIds: [simulation-streaming-fps, camera-send-fps, streaming-penalty]
    comparison:
      caption: 1232×832, 스트리밍 OFF·ON 구성별 5회 중앙값, 수신·디코딩 제외.
      columns: [시뮬레이션 갱신률, 카메라 송신률, 갱신률 저하]
      rows:
      - label: 화면 읽기·압축 동기 처리
        values: [66.70 FPS, 26.95 FPS, 34.84%]
      - label: 픽셀 읽기 비동기화·JPEG 압축
        values: [65.60 FPS, 25.49 FPS, 36.02%]
      - label: 픽셀 읽기 비동기화·압축 작업자 4개
        values: [96.01 FPS, 40.05 FPS, 6.74%]
      evidenceIds: [robotpal-benchmark]
    code:
      path: RobotPal/src/Util/StreamingWorker.cpp
      language: cpp
      title: JPEG 인코딩 대기열에 프레임 추가
      source: |-
