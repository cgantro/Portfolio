limitations:
- 후속 작업 기간이 자료마다 다르게 기록되어 있어, 표기한 기간은 프로젝트 요약의 2025.11–12를 따릅니다.
- 측정값은 공개 문서의 보고값입니다. 원본 로그, 정확한 CPU/GPU 사양, 빌드 설정이 없어 이 저장소만으로 재현하거나 독립 검증할 수 없습니다.
- 1232×832의 iGPU 환경에서 보고된 결과를 다른 GPU나 해상도로 일반화하지 않습니다.
- 수신 및 디코딩은 측정 범위에서 제외되었습니다. Camera Send 40.05 FPS는 목표 60 FPS에 미달했습니다.
- RobotPal의 집기 로직은 ECS 부모 관계를 바꾸는 방식이며 강체 물리 기반 파지로 설명하지 않습니다.
