id: robotpal
title: RobotPal
subtitle: JETANK 이동 로봇·로봇팔 제어 시뮬레이터
category: 로봇 시뮬레이션과 실시간 영상 전송
summary:
- 실물 JETANK 없이 주행과 카메라 인식 기능을 시험할 수 있도록 가상 카메라와 Python 영상 인식 모듈을 연결했습니다.
period: 2025.11 – 2025.12
startDate: 2025-11
endDate: 2025-12
status: complete
team: 4인
role:
- 카메라 JPEG 압축을 별도 작업자로 옮겨 시뮬레이션 갱신과 영상 전송을 분리했습니다.
- 실물 JETANK의 주행값을 측정해 가상 이동 속도를 보정하고, 제어 화면에서 장비 상태 조회와 조작 입력 전달을 연결했습니다.
- 외부 JSON 명령에서 이동체 모터·로봇팔 서보 값을 읽어 가상 이동체·로봇팔·집게 조작에 반영했습니다.
stack:
- C++17
- OpenGL
- TCP/WebSocket
- Emscripten
- JPEG
cover:
  src: /assets/로봇팔 시연.webp
  alt: RobotPal 프로젝트 화면
architecture:
  src: /assets/robotpal-system-architecture.svg
  alt: 가상 카메라 영상과 제어 명령이 시뮬레이터와 외부 인식 모듈 사이를 오가는 구조
  summary:
  - FBO 영상은 GPU에서 읽은 뒤 JPEG 작업 대기열과 TCP·WebSocket 전송 경로로 전달합니다.
  - 외부 JSON 명령에 담긴 모터·서보 값을 받아 가상 로봇의 이동과 로봇팔 조작에 반영합니다.
detail:
  layout: robotpal
  overview: JETANK 이동체와 로봇팔을 가상 환경에서 조작하고, 외부 영상 인식 모듈과 영상·명령을 주고받는 시뮬레이터입니다. 외부 JSON 명령의 모터·서보 값을 가상 로봇에 반영하며, 실물 JETANK은 제어 화면에서 상태를 확인하고 조작 입력을 전달하도록 연결했습니다.
  features:
  - title: 가상 로봇 조작
    description: JETANK 주행, 로봇팔 관절 이동, 집게 제어
    implementation: 외부 JSON 패킷에서 이동체 모터와 로봇팔 서보 값을 읽어 가상 이동체·팔·집게 상태에 반영합니다.
    evidenceIds: [robotpal-public]
  - title: 가상 카메라
    description: 가상 카메라 영상을 외부 인식 모듈에 전달하고, 외부 명령으로 이동체·로봇팔·집게를 조작
    implementation: 시뮬레이터 화면에서 가상 카메라 영상을 캡처해 JPEG로 압축하고 TCP 또는 WebSocket으로 보냅니다. 외부 인식 모듈의 JSON 명령은 별도 입력 경로로 가상 로봇에 적용합니다.
    evidenceIds: [robotpal-public]
  - title: 실물 JETANK 연동
    description: 제어 화면에 실물 장비 상태를 표시하고 조작 입력을 전달
    implementation: 실물 장비의 상태를 제어 화면에 표시하고 화면의 입력을 장비 쪽으로 전달합니다. 이 화면 연동을 가상 로봇의 JSON 명령 처리와 구분했습니다.
    evidenceIds: [robotpal-public]
  - title: 데스크톱·웹 실행
    description: 네이티브 TCP 및 WebAssembly WebSocket 통신 지원
    evidenceIds: [robotpal-public]
  roleAreas:
  - title: 실측 기반 주행 보정
    items:
    - text: 실물 JETANK의 주행값을 기준으로 가상 이동체의 직진·회전 속도 보정
      evidenceIds: [robotpal-public]
  - title: 제어 통신
    items:
    - text: 외부 JSON 명령에서 이동체 모터·로봇팔 서보 값을 받아 가상 로봇 상태에 반영
      evidenceIds: [robotpal-public]
    - text: 제어 화면에서 실물 JETANK 상태 조회와 조작 입력 전달 연결
      evidenceIds: [robotpal-public]
  - title: 카메라 스트리밍
    items:
    - text: 가상 화면을 캡처해 JPEG로 압축하고 외부 프로그램에 영상 전송
      evidenceIds: [robotpal-public]
    - text: 데스크톱과 웹 실행 환경에 맞춰 영상 전송 연결
      evidenceIds: [robotpal-public]
  troubleshooting:
  - title: 카메라 스트리밍 중 시뮬레이션 성능 저하
    symptom: 스트리밍을 켜면 시뮬레이션 갱신률이 102.38→66.70 FPS로 떨어져 GPU Readback 대기를 주요 병목으로 예상했습니다.
    cause: PBO·Fence 적용 후에도 갱신률은 65.60 FPS였습니다. Tracy 측정에서 Readback p50은 1.144ms, JPEG 인코딩 p50은 16.406ms로 JPEG 압축의 메인 스레드 점유가 더 컸습니다.
    solution: JPEG 인코딩을 워커 4개로 옮기고 메인 스레드는 작업을 대기열에 넣은 뒤 다음 프레임을 진행하도록 바꿨습니다. 인코딩 대기열은 6프레임, TCP 송신 대기열은 2프레임으로 제한하고 가득 차면 오래된 프레임을 버립니다. 병렬 압축이 끝난 순서가 바뀌어도 프레임 번호를 비교해 과거 프레임을 거부합니다.
    verification: 메인 스레드 작업 삽입 p50은 0.017ms로, JPEG 인코딩 완료를 기다리는 구간을 분리했습니다. 워커의 개별 JPEG 압축 p50은 27.075ms였지만 동기·PBO 단독·PBO+워커 비교에서 전체 갱신률과 송신률은 개선됐습니다.
    evidenceIds: [robotpal-benchmark, robotpal-public]
    metricIds: [simulation-streaming-fps, camera-send-fps, streaming-penalty]
    diagram:
      src: /assets/robotpal-streaming-flow.svg
      alt: 동기 방식과 워커 분리 방식의 GPU 픽셀 회수·JPEG 압축·TCP 송신 대기열 흐름 비교
      caption: 동기 방식에서는 메인 스레드가 JPEG 압축과 송신을 기다렸습니다. 변경 뒤에는 JPEG 압축을 워커 네 개로 옮기고 대기열 크기와 프레임 순서를 관리합니다.
      width: 1200
      height: 470
    comparison:
      caption: 1232×832, 스트리밍 OFF·ON 구성별 5회 중앙값, 수신·디코딩 제외.
      columns: [시뮬레이션 갱신률, 카메라 송신률, 갱신률 저하]
      rows:
      - label: 동기 Readback·JPEG
        values: [66.70 FPS, 26.95 FPS, 34.84%]
      - label: PBO·JPEG
        values: [65.60 FPS, 25.49 FPS, 36.02%]
      - label: PBO·JPEG 워커 4개
        values: [96.01 FPS, 40.05 FPS, 6.74%]
      evidenceIds: [robotpal-benchmark]
    code:
      path: RobotPal/src/Util/StreamingWorker.cpp
      language: cpp
      title: JPEG 인코딩 대기열에 프레임 추가
      source: |-
