id: robotpal
title: RobotPal
subtitle: JETANK 이동·로봇 팔 제어 시뮬레이터
category: 로봇 시뮬레이션과 실시간 영상 전송
summary:
- 실물 JETANK 없이 주행과 카메라 인식 기능을 시험할 수 있도록 가상 카메라와 Python 영상 인식 모듈을 연결했습니다.
period: 2025.11 – 2025.12
startDate: 2025-11
endDate: 2025-12
status: complete
team: 4인
role:
- Tracy로 JPEG 인코딩이 메인 스레드를 오래 점유하는 것을 확인해 인코딩과 송신을 워커 스레드 4개로 옮겼습니다.
- 실물 JETANK을 연결하고 실제 주행값에 맞춰 가상 이동 속도를 보정했습니다.
- Python 영상 인식 명령을 이동체·로봇 팔·집게 조작에 연결했습니다.
stack:
- C++17
- OpenGL
- JPEG 인코딩
- Tracy
- WebAssembly
cover:
  src: /assets/로봇팔 시연.webp
  alt: RobotPal 프로젝트 화면
architecture:
  src: /assets/robotpal-system-architecture.svg
  alt: 가상 카메라 영상을 압축해 인공지능 모듈로 보내고, 인공지능 명령으로 이동 로봇과 로봇 팔을 제어하는 구조
  summary:
  - 카메라 프레임은 GPU에서 읽어 JPEG로 인코딩한 뒤 Python 영상 인식 모듈로 전송합니다.
  - 인식 명령은 공통 제어 인터페이스를 거쳐 가상 또는 실물 로봇에 전달합니다.
links:
  github: https://github.com/cgantro/RobotPal
  demo: null
contributions:
- id: robotpal-contribution-1
  text: Tracy로 메인 스레드를 막는 JPEG 압축 병목을 확인하고 압축·송신을 워커 스레드 4개로 분리
  evidenceIds:
  - robotpal-benchmark
  status: reported
- id: robotpal-contribution-3
  text: Qt 화면에서 실물 JETANK 이동 로봇의 상태를 확인하고 조작 입력을 보내는 기능 구현
  evidenceIds:
  - robotpal-public
  status: reported
- id: robotpal-contribution-4
  text: 좌우 모터 입력과 실측 주행값으로 가상 이동 로봇의 직진과 회전 속도 보정
  evidenceIds:
  - robotpal-public
  status: reported
- id: robotpal-contribution-5
  text: Python 인공지능 명령과 카메라 프레임 전송을 이동 로봇·로봇 팔 제어에 연결
  evidenceIds:
  - robotpal-public
  status: reported
outcomes:
- id: robotpal-bottleneck
  text: PBO만 적용해도 성능은 나아지지 않았습니다. Tracy로 JPEG 압축이 메인 스레드를 막는 병목임을 확인해 압축·송신을 워커 스레드 4개로 옮겼습니다.
  evidenceIds:
  - robotpal-benchmark
  status: reported
- id: robotpal-target
  text: 1232×832 내장 GPU 환경에서 송신을 끈 상태와 켠 상태를 각각 5회 측정한 중앙값입니다(수신·압축 해제 제외). 스트리밍 중 시뮬레이션은 66.70→96.01 FPS, 카메라 송신은 26.95→40.05 FPS로 높아졌습니다. 카메라 송신은 목표인 60 FPS에 못 미쳤습니다.
  evidenceIds:
  - robotpal-benchmark
  status: reported
