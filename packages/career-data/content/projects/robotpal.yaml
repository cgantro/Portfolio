id: robotpal
title: RobotPal
subtitle: 로봇을 제어하고 카메라 영상을 전송하는 C++ 시뮬레이터
category: C++ 로봇 시뮬레이터와 실시간 영상 전송
summary:
- JETANK의 주행을 가상 환경에서 재현한 C++ 시뮬레이터입니다. 가상 카메라 영상을 Python 모듈로 보내고 이동 로봇과 로봇 팔을 제어합니다.
period: 2025.11 – 2025.12
startDate: 2025-11
endDate: 2025-12
status: complete
team: 팀 프로젝트
role:
- Tracy로 JPEG 압축이 주 실행 흐름을 막는 병목임을 확인해 압축·송신을 작업자 4개로 분리
- Qt 화면에서 실물 JETANK 이동 로봇의 상태를 확인하고 조작 입력을 보내는 기능 구현
- 좌우 모터 입력과 실제 주행값을 대조해 가상 이동 로봇의 직진·회전 속도를 보정
- Python 인공지능 명령을 이동 로봇, 로봇 팔, 집게, 카메라 기울기 제어에 연결
- 가상 카메라 화면을 이미지로 압축해 Python 인공지능 모듈에 전달
stack:
- C++17
- OpenGL 3D 화면 그리기
- Flecs 개체 상태 관리
- libjpeg 이미지 압축
- Tracy 성능 측정 도구
- TCP 순서 보장 통신
- WebSocket 양방향 통신
- Emscripten C++ 변환 도구
- WebAssembly 브라우저 실행 형식
- Python
- CMake 빌드 설정 도구
