outcomes:
- id: robotpal-bottleneck
  text: PBO만 적용한 구성에서는 성능이 나아지지 않았습니다. Tracy 측정에서 JPEG 압축이 주 실행 흐름을 막는 병목임을 확인해 작업 스레드 4개로 분리했습니다.
  evidenceIds:
  - robotpal-benchmark
  status: reported
- id: robotpal-target
  text: 1232×832 내장 GPU 환경에서 송신을 끈 상태와 켠 상태를 각각 5회 측정한 중앙값입니다(수신·압축 해제 제외). 스트리밍 중 시뮬레이션은 66.70→96.01 FPS, 카메라 송신은 26.95→40.05 FPS로 높아졌습니다. 카메라 송신은 목표인 60 FPS에 못 미쳤습니다.
  evidenceIds:
  - robotpal-benchmark
  status: reported
