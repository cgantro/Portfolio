id: robotpal
title: RobotPal
subtitle: JETANK 이동·로봇 팔 제어 시뮬레이터
category: 로봇 시뮬레이션과 실시간 영상 전송
summary:
- 실물 JETANK 없이 주행과 카메라 인식 기능을 시험할 수 있도록 가상 카메라와 Python 영상 인식 모듈을 연결했습니다.
period: 2025.11 – 2025.12
startDate: 2025-11
endDate: 2025-12
status: complete
team: 4인
role:
- Tracy로 JPEG 인코딩이 메인 스레드를 오래 점유하는 것을 확인하고 JPEG 압축을 워커 스레드 4개로 분리했습니다.
- 실물 JETANK을 연결하고 실제 주행값에 맞춰 가상 이동 속도를 보정했습니다.
- Python 영상 인식 명령을 이동체·로봇 팔·집게 조작에 연결했습니다.
stack:
- C++17
- OpenGL
- JPEG 인코딩
- Tracy
- WebAssembly
cover:
  src: /assets/로봇팔 시연.webp
  alt: RobotPal 프로젝트 화면
architecture:
  src: /assets/robotpal-system-architecture.svg
  alt: 가상 카메라 영상을 압축해 인공지능 모듈로 보내고, 인공지능 명령으로 이동 로봇과 로봇 팔을 제어하는 구조
  summary:
  - FBO 영상은 GPU에서 읽은 뒤 JPEG 작업 대기열과 TCP·WebSocket 전송 경로로 전달합니다.
  - Python 인식 결과는 공통 제어 인터페이스를 거쳐 가상 또는 실물 로봇에 적용합니다.
detail:
  layout: robotpal
  overview: 가상 JETANK과 로봇 팔을 조작하고, 실물 JETANK과 영상 인식 모듈을 연결해 주행·인식·제어 흐름을 시험하는 시뮬레이터입니다. 4인 팀이 2025년 11월부터 12월까지 개발했습니다.
  features:
  - title: 가상 JETANK·로봇 팔 조작
    description: 가상 이동 로봇을 주행시키고 로봇 팔과 집게를 조작합니다.
    evidenceIds: [robotpal-public]
  - title: 영상 인식 기반 제어
    description: 가상 카메라 영상을 Python 인식 모듈로 보내고, 돌려받은 명령을 이동체·로봇 팔 제어에 연결합니다.
    evidenceIds: [robotpal-public]
  - title: 카메라 영상 전송
    description: OpenGL 카메라 프레임을 JPEG로 압축해 TCP 또는 WebAssembly의 WebSocket 경로로 전달합니다.
    evidenceIds: [robotpal-public]
  - title: 실물 JETANK 연동
    description: 실물 장비의 상태와 조작을 확인하고, 가상·실물 제어 대상을 전환해 시험합니다.
    evidenceIds: [robotpal-public]
  roleAreas:
  - title: 실물 제어와 가상 주행
    items:
    - text: Qt 제어 화면에서 실물 JETANK 상태를 확인하고 조작 입력을 보냈습니다.
      evidenceIds: [robotpal-public]
    - text: 입력값 0.3에서 측정한 실물 주행값(직진 약 2.4cm/s, 회전 약 24°/s)을 가상 이동 계수에 반영했습니다.
      evidenceIds: [robotpal-public]
  - title: Python 인식 모듈 연결
    items:
    - text: TCP JSON 제어 명령을 IRobotController 기반 가상·실물 제어 경로에 연결했습니다. 카메라 영상은 별도 TCP·WebSocket 스트리밍 경로로 전송했습니다.
      evidenceIds: [robotpal-public]
  - title: 영상 스트리밍 성능 분석
    items:
    - text: Tracy 계측과 PBO 비교로 JPEG 압축이 메인 스레드 처리 시간을 많이 차지하는 것을 확인했습니다.
      evidenceIds: [robotpal-benchmark]
    - text: JPEG 압축 워커 4개와 별도 TCP 송신 작업자를 구성했습니다.
      evidenceIds: [robotpal-benchmark]
  troubleshooting:
  - title: 카메라 스트리밍이 시뮬레이션 갱신을 늦춤
    symptom: 스트리밍을 켜자 시뮬레이션 갱신률이 102.38 FPS에서 66.70 FPS로 떨어졌습니다.
    cause: PBO를 적용해도 갱신률은 65.60 FPS였습니다. Tracy에서 동기 Readback p50은 1.144ms, 메인 스레드 JPEG 압축 p50은 16.406ms로 측정돼 JPEG 압축이 메인 스레드 처리 시간을 더 많이 차지하는 것을 확인했습니다.
    solution: 메인 스레드에서는 프레임을 인코딩 큐에 넣고 바로 돌아오도록 바꿨습니다. JPEG 압축 워커 4개가 최대 6프레임 큐를 처리하며, 가득 차면 오래된 프레임을 버립니다. 압축이 끝난 프레임은 별도 TCP 송신 큐(최대 2프레임)로 넘기고, 프레임 번호를 확인해 늦게 끝난 과거 프레임을 보내지 않습니다.
    verification: 큐 삽입 p50은 0.017ms, 워커의 JPEG 압축 p50은 27.075ms였습니다. 개별 압축 시간은 늘었지만 스트리밍 중 전체 갱신률과 카메라 송신률은 개선됐습니다.
    evidenceIds: [robotpal-benchmark, robotpal-public]
    metricIds: [simulation-streaming-fps, camera-send-fps, streaming-penalty]
    comparison:
      caption: 동기 Readback·JPEG, PBO·JPEG, PBO·JPEG 워커 4개 구성을 비교했습니다.
      columns: [시뮬레이션 갱신률, 카메라 송신률, 갱신률 저하]
      rows:
      - label: 동기 Readback·JPEG
        values: [66.70 FPS, 26.95 FPS, 34.84%]
      - label: PBO·JPEG
        values: [65.60 FPS, 25.49 FPS, 36.02%]
      - label: PBO·JPEG 워커 4개
        values: [96.01 FPS, 40.05 FPS, 6.74%]
      evidenceIds: [robotpal-benchmark]
    code:
      path: RobotPal/src/Util/StreamingWorker.cpp
      language: cpp
      title: JPEG 인코딩 대기열에 프레임 추가
      source: |-
        {
            std::lock_guard<std::mutex> lk(m_encodeQueueMutex);
            if (m_encodeQueue.size() >= EncodeQueueCapacity)
                m_encodeQueue.pop();
            m_encodeQueue.push(std::move(job));
        }
        m_encodeQueueCv.notify_one();
      url: https://github.com/cgantro/RobotPal/blob/main/RobotPal/src/Util/StreamingWorker.cpp
