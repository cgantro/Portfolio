  source: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/docs/DRIVING_LOG_WRITE_BEHIND.md
  kind: repository
  status: reported
  locator: DrivingLogWriteBehindService, DrivingLogBatchWriter, BufferedDrivingLog
  note: 원 프로젝트 기간과 구분하는 후속 코드 개선. 현재 TowingCarService는 DrivingLogWriteBehindService를 호출.
- id: autowingcar-streams-tests
  label: 운행 로그 저장 순서·재처리 단위 테스트
  source: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/src/test/java/com/project/domain/towingcar/service/DrivingLogWriteBehindServiceTest.java
  kind: repository
  status: reported
  locator: databaseCommitComesBeforeAcknowledgement, databaseFailureLeavesRecordPending, stableIdAndTimestampSurviveRedelivery
  note: 모의 객체로 저장 호출·ACK 순서와 오류 처리, 재전달 식별자를 검사. DB 중복 INSERT 방지는 SQL의 ON CONFLICT 구현으로 확인.
- id: autowingcar-streams-order
  label: 상태 수신 경로의 커밋 후 Stream 적재
  source: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/src/main/java/com/project/domain/towingcar/service/DrivingLogWriteBehindService.java
  kind: repository
  status: reported
  locator: enqueueAfterCommit, TxUtil.executeAfterCommit, TowingCarService.processCarMonitoring
  note: 활성 경로의 afterCommit 연결을 소스로 확인. 별도 DrivingLogStreamService 테스트를 활성 경로의 커밋·롤백 시험으로 간주하지 않음.
limitations:
- Redis Streams 후속 개선의 DB 처리량·지연 개선 수치는 통합 비교 시험 전까지 제시하지 않습니다.
