id: autowingcar
title: 오토잉카 (AutoWing Car)
subtitle: 공항 견인차 상태 관제와 운행 경로
category: Java 기반 공항 차량 관제 서버
summary:
  - 공항 견인차에 운행 명령을 보내고 상태를 관제하는 6인 팀 프로젝트에서 차량 메시지, 웹 갱신과 경로 탐색을 구현했습니다.
period: 2026.01 – 2026.02
startDate: '2026-01-16'
endDate: '2026-02-09'
status: complete
team: 6인
role:
- 6인 팀의 백엔드 담당으로 MQTT 차량 통신과 운행 상태 관리 구현
- WebSocket·STOMP 관제 갱신과 차량 상태·주행 이력 저장 구현
- 상태 역행 방지와 DB 커밋 뒤 MQTT 명령 발행 처리
- 이동 시간 비용을 적용한 A*·Yen 경로 탐색과 RDP 경로 단순화 구현
stack:
- Java 17
- Spring Boot
- MQTT
- WebSocket·STOMP
- PostgreSQL
cover:
  src: /assets/오토잉카_실물.png
  alt: 오토잉카 (AutoWing Car) 프로젝트 화면
architecture:
  src: /assets/autowing-system-architecture.svg
  alt: 차량과 인공지능 서비스가 장비 메시지와 웹 요청으로 Java 서버에 연결되고 관제 화면은 실시간 연결로 갱신되는 구성도
  summary:
  - 차량은 MQTT로 상태·명령 응답을 보내고, 서버는 상태 전이를 확인해 관제용 데이터를 갱신합니다.
  - 변경된 차량·항공편·비상 정보는 WebSocket·STOMP로 화면에 보내고 운행 기록은 DB에 저장합니다.
links:
  github: https://github.com/cgantro/Autowing_car
  demo: null
contributions:
- id: autowingcar-contribution-1
  text: 6인 팀 프로젝트에서 Spring Boot 서버를 맡아 MQTT 차량 메시지와 관제 서비스를 연결
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-contribution-2
  text: 차량 명령의 장비 응답을 확인하고, DB 커밋 이후 명령을 발행하도록 순서를 조정해 오래된 상태가 최신 값을 덮는 오류를 수정
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-contribution-3
  text: 이동 비용이 낮은 길을 찾는 A*와 다른 경로를 찾는 Yen 탐색, 경로 모양을 유지하며 점을 줄이는 RDP 구현
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-contribution-4
  text: 데이터베이스와 임시 상태 저장, 로그인 확인 토큰, 배포 환경과 k6 부하 검증 구성
  evidenceIds:
  - autowingcar-public
  status: reported
outcomes:
- id: autowingcar-outcome-1
  text: MQTT 차량 메시지에서 위치·속도·배터리·운행 상태를 읽어 주행 이력에 저장했습니다. 차량·항공편·비상 알림의 변경 내용은 WebSocket·STOMP로 관제 화면에 전달했습니다.
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-outcome-2
  text: 차량으로 명령을 보내고 장비가 명령을 받았다는 확인 응답을 받아 처리 상태에 반영했습니다. 서버가 보낸 명령과 장비가 보고한 실제 주행 상태를 분리해 관리했습니다.
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-outcome-3
  text: A*에서 간선별 예상 이동 시간을 경로 비용으로 사용하고 통제 구간과 다른 차량이 점유한 지점·간선은 제외했습니다. Yen 알고리즘으로 대체 경로를 최대 3개 탐색하고, RDP로 경로 형상을 유지하며 중간점을 줄였습니다.
  evidenceIds:
  - autowingcar-public
  status: reported
