id: autowingcar
title: 오토잉카 (AutoWing Car)
subtitle: 공항 견인차 상태 관제와 운행 경로
category: 공항 견인차 관제·실시간 통신·운행 상태 관리
summary:
  - MQTT 차량 상태와 명령 응답을 관제 화면에 연결하고, 늦게 도착한 상태가 서버의 최신 운행 상태를 덮지 않도록 처리했습니다.
period: 2026.01 – 2026.02
startDate: '2026-01-16'
endDate: '2026-02-09'
status: complete
team: 6인
role:
- 6인 팀의 서버 개발 담당으로 차량 메시지 수신과 운행 명령 전달 구현
- 관제 화면의 실시간 상태 갱신과 차량 상태·주행 이력 저장 구현
- 기본·대체 경로 탐색과 지도 표시용 경로 정리 구현
- 프로젝트 종료 후 운행 기록 묶음 저장과 재처리 기능 보완
stack:
- Java 17
- Spring Boot
- MQTT
- WebSocket·STOMP
- Redis
- PostgreSQL
cover:
  src: /assets/오토잉카_실물.png
  alt: 견인 장비와 공항 여객기 모형을 연결한 오토잉카 실물 차량 사진
architecture:
  src: /assets/autowing-system-architecture.svg
  alt: React, Nginx, Spring Boot, PostgreSQL, Redis, MQTT, WebSocket과 STOMP의 기술 구성
  summary:
  - MQTT 차량 상태와 명령 확인 응답을 처리하고, WebSocket·STOMP로 관제 화면을 갱신합니다.
  - 차량의 최신 상태와 주행 이력은 각각 Redis와 PostgreSQL에 저장합니다.
  - 프로젝트가 끝난 뒤 운행 기록 저장을 보완해, 별도 저장 프로그램이 기록을 묶어 저장하고 실패한 항목을 다시 처리하도록 했습니다.
detail:
  layout: autowingcar
  overview: 공항 견인차의 위치와 운행 상태를 관제하고 차량에 운행 명령을 전달하는 시스템입니다. MQTT로 받은 차량 정보를 WebSocket 관제 화면에 연결하고, 운행 경로 탐색과 상태 저장 기능을 구현했습니다.
  features:
  - title: 견인차 상태 관제
    description: 차량의 위치·속도·배터리·운행 상태를 관제 화면에서 확인합니다.
    implementation: MQTT로 차량 상태를 받은 뒤 최신 값은 Redis에 저장하고 WebSocket·STOMP로 관제 화면에 전달합니다. 주행 이력 저장은 현재 상태 조회와 분리해 처리합니다.
    processSteps:
    - MQTT에서 차량 위치·속도·배터리·상태 수신
    - 최신 상태를 Redis에 갱신
    - WebSocket·STOMP로 관제 화면 갱신
    evidenceIds: [autowingcar-public]
  - title: 운행 명령과 응답 확인
    description: 차량에 운행 명령을 보내고, 명령 확인 응답과 실제 차량 상태를 따로 확인합니다.
    implementation: 차량의 MQTT 확인 응답은 명령을 받았다는 뜻으로 처리하고, 운행 상태는 이후 차량이 보내는 상태 보고로 갱신합니다. 명령 정보는 데이터베이스에 저장한 뒤 차량에 전달합니다.
    processSteps:
    - 관제 요청을 검증하고 데이터베이스 변경
    - 트랜잭션 커밋 뒤 MQTT 운행 명령 발행
    - 차량의 확인 응답은 명령 수신 여부로 처리
    - 이후 차량 상태 보고를 운행 상태로 반영
    diagram:
      src: /assets/autowing-command-flow.svg
      alt: 관제 요청을 데이터베이스에 저장한 뒤 MQTT 명령을 보내고, 차량의 명령 확인과 실제 상태 보고를 따로 받는 흐름
      caption: 명령 확인 응답과 실제 운행 상태 보고를 구분합니다.
      width: 1120
      height: 340
    evidenceIds: [autowingcar-public]
  - title: 관제 알림·상태 저장
    description: 차량·항공편·비상 상태 변화를 관제 화면에 알리고, 차량별 최신 상태와 위치·속도·배터리 등의 주행 이력을 저장합니다.
    implementation: Redis에는 조회에 쓰는 최신 상태를 두고, PostgreSQL에는 위치·속도·배터리 등 주행 이력을 기록합니다.
    evidenceIds: [autowingcar-public]
  - title: 주행 경로 탐색
    description: 현재 위치에서 목적지까지 이동 시간이 짧은 기본 경로와 대체 경로를 최대 두 개 더 찾습니다.
    implementation: A*로 통제 중인 길을 건너뛰며 이동 시간 기준의 기본 경로를 찾습니다. Yen 탐색은 기본 경로의 일부 구간을 바꿔 대체 경로를 최대 두 개 더 계산합니다. 지도에 표시할 때는 경로 모양을 유지하며 불필요한 지점을 줄입니다.
    codeSnippets:
    - language: java
      title: 이동 시간이 짧아지는 경로로 갱신
      source: |-
        double newG = gScore.getOrDefault(currentNode.getId(), Double.MAX_VALUE)
            + edgeCost(edge);
        if (newG < gScore.getOrDefault(neighbor.getId(), Double.MAX_VALUE)) {
            cameFrom.put(neighbor.getId(), edge);
            gScore.put(neighbor.getId(), newG);
            openSet.add(new PathNode(neighbor, newG, newG + heuristic(neighbor, end)));
        }
    - language: java
      title: 다른 구간을 잇는 대체 경로 후보
      source: |-
        List<Edge> spurPath = findSinglePath(spurNode, end, excluded);
        if (!spurPath.isEmpty()) {
            List<Edge> totalPath = new ArrayList<>(rootPath);
            totalPath.addAll(spurPath);
            if (!containsPath(candidates, resultPaths, totalPath)) {
                candidates.add(totalPath);
            }
        }
    evidenceIds: [autowingcar-public]
  postProjectImprovement:
    title: Redis Streams 운행 기록 저장
    description: 프로젝트를 마친 뒤 기록 저장을 보완했습니다. 운행 중 쌓인 기록을 한꺼번에 저장하고, 저장에 실패한 기록은 다시 처리합니다.
    implementation: 차량 상태 저장이 끝나면 운행 기록을 Redis Streams에 넣습니다. 별도 저장 프로그램이 기록을 묶어 데이터베이스에 저장하고, 저장에 성공한 뒤 완료 표시를 합니다. 실패한 기록은 남겨 두었다가 다시 처리합니다.
    processSteps:
    - 차량 상태 저장을 마친 뒤 운행 기록을 보관
    - 별도 저장 프로그램이 기록을 묶어 데이터베이스에 저장
    - 저장 성공을 확인한 뒤 처리 완료 표시
    - 저장 실패 기록은 남겨 두고 다시 처리
    diagram:
      src: /assets/autowing-streams-flow.svg
      alt: 차량 상태를 저장하고 운행 기록을 모은 뒤 데이터베이스에 저장합니다. 저장에 실패하면 다시 시도합니다.
      caption: 운행 기록을 모아 저장하고, 실패한 기록은 다시 시도합니다.
      width: 1200
      height: 390
    verification: 단위 시험에서 저장 성공 뒤 완료 표시, 데이터베이스 오류 뒤 재시도, 같은 기록의 식별값 유지를 확인했습니다.
    evidenceIds: [autowingcar-streams, autowingcar-streams-tests]
  roleAreas:
  - title: 차량 통신·실시간 관제
    items:
    - text: 차량 상태와 명령 수신 응답을 받아 관제 시스템에 전달
      evidenceIds: [autowingcar-public]
    - text: 관제 화면에 차량 상태와 알림을 실시간 전달하고 최신 상태 관리
      evidenceIds: [autowingcar-public]
    - text: 명령 수신 응답과 실제 차량 운행 상태를 구분해 관리
      evidenceIds: [autowingcar-public]
  - title: 상태 정합성·명령 처리 순서
    items:
