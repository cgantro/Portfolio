  alt: 차량과 인공지능 서비스가 장비 메시지와 웹 요청으로 Java 서버에 연결되고 관제 화면은 실시간 연결로 갱신되는 구성도
  summary:
  - 차량 메시지 통신으로 장비 상태와 결과를 받고, 열린 웹 연결로 관제 화면을 갱신했습니다.
  - 인공지능과 차량 장치, 관제 화면을 연결하는 서버 전반을 맡았습니다.
