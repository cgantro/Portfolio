limitations:
- 원본 k6 부하 보고서가 없어 응답 시간 통계 기준, 반복 횟수, 부하 발생기와 서버 사양을 확인할 수 없습니다.
- 500대 × 10회/초의 입력 조건과 최대 8,935 메시지/초 처리값의 집계 범위가 공개 자료에 명시되지 않아 직접 비교하거나 용량 보장으로 사용하지 않습니다.
- 14–28ms는 보고된 범위이며 p50, p95, p99로 변환하지 않습니다.
- 공개 저장소 및 실행 데모 URL을 확인할 수 없어 구현 설명은 추적되는 공개 포트폴리오 자료를 근거로 합니다.
