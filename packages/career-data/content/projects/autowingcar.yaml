id: autowingcar
title: 오토잉카 (AutoWing Car)
subtitle: 장비 상태와 데이터베이스, 관제 화면을 연결하는 Java 서버
category: Java 기반 공항 차량 관제 서버
summary:
- 공항 토잉카 관제 서버입니다. Spring Boot는 Java로 서버 프로그램을 만드는 개발 도구입니다.
- MQTT는 차량 장치와 상태, 명령을 주고받는 메시지 방식입니다. WebSocket은 브라우저와 서버가 연결을 유지하며 양방향으로 정보를 주고받는 통신 방식입니다. 차량 상태가 순서에 맞게 바뀌도록
  처리하고 지도 경로 탐색도 구현했습니다.
period: 2026.01 – 2026.02
startDate: '2026-01-16'
endDate: '2026-02-09'
status: complete
team: 6인
role:
- 6인 팀에서 Java 서버 개발 도구인 Spring Boot로 서버 전반을 단독 구현하고 장비와 관제 서비스를 연결
- 차량에 보내는 명령과 수신 확인, 실시간 관제 화면 갱신, 차량 상태 변경 흐름 구현
- 이동 비용이 낮은 길을 찾는 A*와 다른 경로를 찾는 Yen 탐색, 경로 모양을 유지하며 점을 줄이는 RDP 구현
- 데이터베이스와 임시 상태 저장, 로그인 확인 토큰, 배포 환경과 k6 부하 검증 구성
stack:
- Java 17
- Spring Boot 서버 개발 도구
- MQTT 장비 메시지 통신
- WebSocket 실시간 연결과 STOMP 메시지 규칙
- PostgreSQL 관계형 데이터베이스
- Redis 빠른 임시 저장소
- Docker 실행 환경 포장
- GitLab CI 자동 빌드와 배포
- k6 부하 측정 도구
