outcomes:
- id: autowingcar-outcome-1
  text: 차량 메시지에서 위치와 속도, 배터리, 운행 상태를 읽어 주행 이력에 저장했습니다. 관제 화면의 차량, 항공편, 비상 알림은 실시간 연결을 통해 바뀐 내용만 전달했습니다. STOMP는 이
    연결 위에서 메시지 종류와 목적지를 정하는 규칙입니다.
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-outcome-2
  text: 차량으로 명령을 보내고 장비가 명령을 받았다는 확인 응답을 받아 처리 상태에 반영했습니다. 서버가 보낸 명령과 장비가 보고한 실제 주행 상태를 분리해 관리했습니다.
  evidenceIds:
  - autowingcar-public
  status: reported
- id: autowingcar-outcome-3
  text: A*는 지금까지 이동한 비용과 목적지까지의 예상 비용을 더해 유리한 경로부터 살펴보는 탐색 방법입니다. 시작 지점부터 목적지까지 그래프를 살피며 통제 구간과 다른 차량이 차지한 지점이나
    연결선은 후보에서 제외했습니다. 연결선 이동 시간을 비용으로 사용하고 값이 없을 때는 거리 나누기 10으로 보정했습니다. 목적지까지의 예상 비용은 직선 거리와 최고 속도를 이용해 계산했습니다.
  evidenceIds:
  - autowingcar-public
  status: reported
