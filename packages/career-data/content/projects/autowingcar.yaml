id: autowingcar
title: 오토잉카 (AutoWing Car)
subtitle: 공항 견인차 상태 관제와 운행 경로
category: Java 기반 공항 차량 관제 서버
summary:
  - 공항 견인차에 운행 명령을 보내고 상태를 관제하는 6인 팀 프로젝트에서 차량 메시지, 웹 갱신과 경로 탐색을 구현했습니다.
period: 2026.01 – 2026.02
startDate: '2026-01-16'
endDate: '2026-02-09'
status: complete
team: 6인
role:
- 6인 팀의 백엔드 담당으로 MQTT 차량 통신과 운행 상태 관리 구현
- WebSocket·STOMP 관제 갱신과 차량 상태·주행 이력 저장 구현
- Redis Streams 운행 로그 일괄 저장과 재처리 구조 후속 개선
- 이동 시간 비용을 적용한 A*·Yen 경로 탐색과 RDP 경로 단순화 구현
stack:
- Java 17
- Spring Boot
- MQTT
- WebSocket·STOMP
- Redis
- PostgreSQL
cover:
  src: /assets/오토잉카_실물.png
  alt: 오토잉카 (AutoWing Car) 프로젝트 화면
architecture:
  src: /assets/autowing-system-architecture.svg
  alt: 차량과 인공지능 서비스가 장비 메시지와 웹 요청으로 Java 서버에 연결되고 관제 화면은 실시간 연결로 갱신되는 구성도
  summary:
  - 차량의 MQTT 상태·명령 응답은 서버에서 분리해 처리하고, 관제 화면은 WebSocket·STOMP로 갱신합니다.
  - 차량의 최신 상태와 주행 이력은 각각 Redis와 PostgreSQL에 저장합니다.
  - 후속 개선에서는 운행 로그를 Redis Streams에 적재하고 별도 소비자가 DB에 일괄 저장합니다.
detail:
  layout: autowingcar
  overview: 공항 견인차의 위치·운행 상태를 관제하고 차량에 미션 명령을 전달하는 시스템입니다. 차량 상태 조회, 실시간 알림, 주행 경로와 대체 경로 탐색을 지원합니다.
  features:
  - title: 견인차 상태 관제
    description: 차량의 위치·속도·배터리·운행 상태를 관제 화면에서 확인합니다.
    evidenceIds: [autowingcar-public]
  - title: 운행 명령과 응답 확인
    description: 차량에 명령을 보내고 장비의 수신 응답과 실제 운행 상태를 각각 확인합니다.
    evidenceIds: [autowingcar-public]
  - title: 관제 알림·상태 저장
    description: 차량·항공편·비상 상태 변화를 관제 화면에 알리고, 차량별 최신 상태와 위치·속도·배터리 등의 주행 이력을 저장합니다.
    evidenceIds: [autowingcar-public]
  - title: 주행 경로 탐색
    description: 통제·점유 구간과 예상 이동 시간을 반영해 경로를 찾고, Yen 알고리즘으로 대체 경로를 최대 3개 제시한 뒤 RDP로 좌표를 줄입니다.
    evidenceIds: [autowingcar-public]
  roleAreas:
  - title: 차량 통신·실시간 관제
    items:
    - text: MQTT 상태 메시지에서 위치·속도·배터리·운행 상태를 읽고 장비 응답 처리
      evidenceIds: [autowingcar-public]
    - text: WebSocket·STOMP 상태·알림 전송 및 Redis 차량별 최신 상태 조회·갱신
      evidenceIds: [autowingcar-public]
    - text: 미션 명령의 장비 ACK와 실제 차량 운행 상태를 구분해 관리
      evidenceIds: [autowingcar-public]
  - title: 상태 정합성·명령 처리 순서
    items:
    - text: 자동 상태 전이 뒤 MQTT 보고에 포함된 오래된 상태가 최신 DB 상태를 덮지 않도록 현재 상태를 우선 반영
      evidenceIds: [autowingcar-public]
    - text: 차량 운행 명령은 데이터베이스 트랜잭션 커밋 뒤 MQTT로 발행
      evidenceIds: [autowingcar-public, autowingcar-command-order]
  - title: 경로 탐색
    items:
    - text: 노드·간선 지도 그래프에 이동 시간 비용을 적용한 A* 탐색 구현
      evidenceIds: [autowingcar-public]
    - text: Yen 알고리즘으로 대체 경로 최대 3개 탐색, RDP로 경로 좌표 단순화
      evidenceIds: [autowingcar-public]
  - title: 데이터 처리·시험 구성
    items:
    - text: PostgreSQL 운행 이력 저장과 Redis 최신 상태 관리를 분리
      evidenceIds: [autowingcar-public]
    - text: 지도·미션·항공편 조회 API의 부하·스트레스 시험을 k6 HTTP 시나리오로 구성
      evidenceIds: [autowingcar-k6]
    - text: 별도 Python 하네스에 모의 차량 500대 × 10Hz 입력을 구성해 RDP 좌표 단순화와 비동기 버퍼 처리 검사
      evidenceIds: [autowingcar-load]
  - title: Redis 운행 로그 처리 · 후속 개선
    items:
    - text: 프로젝트 종료 후 Redis Streams 적재와 별도 소비자의 JDBC 일괄 저장으로 운행 로그 저장 경로 변경
      evidenceIds: [autowingcar-streams]
    - text: pending 레코드 우선 재처리, DB 커밋 뒤 ACK, Stream ID와 DB 복합 키를 이용한 중복 INSERT 방지 구현
      evidenceIds: [autowingcar-streams]
    - text: 차량 상태 트랜잭션의 afterCommit 콜백에서 운행 로그를 Stream에 적재하도록 순서 조정
      evidenceIds: [autowingcar-streams]
    diagram:
      src: /assets/autowing-streams-flow.svg
      alt: 커밋 뒤 Redis Streams에 운행 기록을 넣고, 소비자가 데이터베이스에 저장한 다음 확인하는 흐름
      caption: Redis Streams를 이용한 운행 로그 후속 개선입니다. 데이터베이스 저장이 끝난 뒤 Stream 항목을 확인 처리합니다.
      width: 1200
      height: 360
  troubleshooting:
  - title: 자동 상태 변경 뒤 오래된 MQTT 상태가 최신 값을 덮음
    symptom: 차량이 게이트에 도착해 서버가 DOCKING으로 바꾼 뒤, MQTT로 늦게 도착한 MOVING_TO_GATE 상태가 저장될 수 있었습니다.
    cause: 같은 메시지 처리 안에서 자동 동작이 차량 상태를 바꾼 뒤, 원래 메시지의 상태값을 다시 저장했습니다.
    solution: 자동 동작 전 상태를 기록하고, 처리 중 상태가 달라졌다면 차량 객체의 현재 상태를 MQTT 메시지 값보다 우선해 저장합니다. 게이트 이동 중과 도킹 전환 구간의 오래된 상태도 별도로 걸러냅니다.
    verification: processCarMonitoring()에서 전환 전후 상태를 비교해 최신 객체 상태를 저장하는 분기를 확인했습니다. 저장소에는 관련 상태 전이와 DOCKING 유지 동작을 확인하는 테스트가 있습니다.
    evidenceIds: [autowingcar-public]
    metricIds: []
    code:
      path: Backend/autowing_car/src/main/java/com/project/domain/towingcar/service/TowingCarService.java
      language: java
      title: 자동 상태 전환 뒤 오래된 메시지 값을 덮어쓰지 않음
      source: |-
        CarStatus preAutoActionStatus = assignedCar.getCarStatus();
        checkAndTriggerAutoActions(assignedCar, x, y, status);
        if (assignedCar.getCarStatus() != preAutoActionStatus) {
            status = assignedCar.getCarStatus();
        }
        status = stateCoordinator.resolveCarStatus(assignedCar, status);
        assignedCar.updateStatus(x, y, heading, velocity, battery, status);
      url: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/src/main/java/com/project/domain/towingcar/service/TowingCarService.java
  - title: 데이터베이스 반영 전에 차량 명령이 발행될 수 있음
    symptom: 서버가 명령 처리를 마친 뒤 데이터베이스 트랜잭션이 롤백되면 차량만 명령을 받은 상태가 될 수 있었습니다.
    cause: 데이터베이스 상태 변경과 MQTT 발행은 별도 작업인데, 명령을 커밋 이후로 미루지 않았습니다.
    solution: 운행 명령 발행을 TxUtil.executeAfterCommit()에 등록해 데이터베이스 커밋이 끝난 뒤 MQTT로 보내도록 바꿨습니다.
    verification: 서비스 테스트에서 명령 처리 후 예상한 MQTT 주행 명령과 내용을 확인합니다. 커밋·롤백을 함께 검증하는 별도 통합 시험은 공개 자료에 없습니다.
    evidenceIds: [autowingcar-command-order]
    metricIds: []
    code:
      path: Backend/autowing_car/src/main/java/com/project/service/MissionService.java
      language: java
      title: 트랜잭션 커밋 뒤 주행 명령 발행
      source: |-
        TxUtil.executeAfterCommit(() ->
            towingCarMqttService.sendDriveCommand(car.getCode(), payload));
      url: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/src/main/java/com/project/service/MissionService.java
