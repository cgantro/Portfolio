detail:
  layout: autowingcar
  overview: 공항 견인차의 위치와 운행 상태를 확인하고, 이동 경로를 정해 차량에 명령하는 관제 시스템입니다.
  features:
  - title: 견인차 상태 관제
    description: 차량이 보낸 위치·속도·방향·배터리·운행 상태를 관제 화면에 표시합니다.
    implementation: 차량은 MQTT로 상태를 보내고, 서버는 최신 상태를 Redis에 갱신한 뒤 차량별 WebSocket·STOMP 채널로 관제 화면에 전달합니다.
    processSteps:
    - 차량이 autowing_car/v1/monitoring 토픽으로 상태 보고
    - 서버가 차량 코드를 확인하고 Redis의 최신 상태 갱신
    - /topic/towingcar/{차량 코드} 채널로 관제 화면에 전송
    codeSnippets:
    - language: json
      title: MQTT 수신 형식 · autowing_car/v1/monitoring
      source: |-
        {
          "carId": "TC01",
          "x": 1000.0,
          "y": 750.0,
          "yaw": 90.0,
          "v": 10,
          "mode": "MOVING_TO_GATE",
          "battery": 90
        }
    - language: json
      title: WebSocket·STOMP 전송 형식 · /topic/towingcar/TC01
      source: |-
        {
          "code": "TC01",
          "posX": 1000.0,
          "posY": 750.0,
          "heading": 90.0,
          "velocity": 10.0,
          "battery": 90,
          "status": "MOVING_TO_GATE"
        }
    evidenceIds: [autowingcar-public]
  - title: 주행 경로 계산
    description: 현재 위치에서 목적지까지 이동 시간이 짧은 경로와 대체 경로를 계산합니다.
    implementation: 지도에서 교차로는 노드, 도로 구간은 간선으로 다룹니다. A*는 지금까지 든 이동 시간 `g`와 남은 직선거리를 지도 최대 속도로 나눈 예상 시간 `h`를 더한 `f = g + h`가 낮은 교차로를 먼저 탐색합니다. 통제 중인 길은 건너뛰며, 간선별 이동 시간이 없으면 거리/10을 비용으로 씁니다. Yen 탐색은 최단 경로의 각 갈림점에서 이미 사용한 도로를 제외하고 우회 구간을 찾은 뒤, 원래 경로 앞부분에 붙여 비용이 짧은 대체 경로를 최대 두 개 더 고릅니다.
    codeSnippets:
    - language: java
      title: A* 기본 경로 탐색 · 누적 비용과 예상 비용으로 다음 교차로 선택
      source: |-
        // f가 가장 낮은 노드를 먼저 꺼내는 우선순위 큐가 A* 탐색 순서를 정합니다.
        PriorityQueue<PathNode> openSet = new PriorityQueue<>(
            Comparator.comparingDouble(PathNode::getF));
        Map<Long, Double> gScore = new HashMap<>(); // 출발점부터의 실제 비용
        Map<Long, Edge> cameFrom = new HashMap<>(); // 경로를 되짚을 때 쓸 이전 간선
        Set<Long> closedSet = new HashSet<>();

        gScore.put(start.getId(), 0.0);
        openSet.add(new PathNode(start, 0.0, heuristic(start, end)));

        while (!openSet.isEmpty()) {
            PathNode current = openSet.poll(); // f = g + h가 가장 낮은 노드
            Node currentNode = current.node;
            if (currentNode.getId().equals(end.getId())) {
                return reconstructEdgeList(cameFrom, currentNode);
            }
            if (closedSet.contains(currentNode.getId())) continue;
            closedSet.add(currentNode.getId());

            for (Edge edge : graphCache.getEdges(currentNode)) {
                if (excludedEdges.contains(edge.getId())) continue;
                Node neighbor = edge.getDstNode();
                if (closedSet.contains(neighbor.getId())) continue;
                if (edge.getStatus() == MapStatus.BLOCKED
                    || neighbor.getStatus() == MapStatus.BLOCKED) continue;

                double newG = gScore.getOrDefault(currentNode.getId(), Double.MAX_VALUE)
                    + edgeCost(edge);
                if (newG < gScore.getOrDefault(neighbor.getId(), Double.MAX_VALUE)) {
                    cameFrom.put(neighbor.getId(), edge);
                    gScore.put(neighbor.getId(), newG);
                    openSet.add(new PathNode(neighbor, newG,
                        newG + heuristic(neighbor, end))); // f = g + h
                }
            }
        }
        return Collections.emptyList();
    - language: java
      title: Yen 대체 경로 · 갈림점 이후 다른 길을 후보에 추가
      source: |-
        // 이미 찾은 경로와 같은 구간을 피한 뒤, 갈림점부터 목적지까지 다시 탐색합니다.
        List<Edge> spurPath = findSinglePath(spurNode, end, excluded);
        if (!spurPath.isEmpty()) {
            // 기본 경로에서 갈림점까지의 구간(rootPath)에 새 구간을 이어 붙입니다.
            List<Edge> totalPath = new ArrayList<>(rootPath);
            totalPath.addAll(spurPath);
            // 이미 결과나 후보에 있는 경로는 중복으로 추가하지 않습니다.
            if (!containsPath(candidates, resultPaths, totalPath)) {
                candidates.add(totalPath);
            }
        }
    evidenceIds: [autowingcar-public]
  - title: 운행 명령·응답 확인
    description: 관제 화면에서 경로를 골라 차량에 운행 명령을 보내고, 수신 응답과 실제 운행 상태를 확인합니다.
    implementation: MQTT ACK는 명령을 받았다는 응답으로, 차량 상태 보고는 현재 운행 상태로 따로 처리합니다.
    processSteps:
    - 관제에서 차량과 운행 경로를 선택
    - 서버가 차량에 MQTT 명령 전송
    - 차량 ACK로 명령 수신 확인
    - 다음 상태 보고로 실제 운행 확인
    evidenceIds: [autowingcar-public]
  - title: 운행 이력 저장
    description: 차량 위치와 운행 상태 변화를 이력으로 남깁니다.
    implementation: 운행 이력은 Redis Streams에 모아 PostgreSQL에 묶음 저장합니다. 데이터베이스 저장에 실패하면 완료 처리하지 않아 다음 처리 때 다시 저장합니다.
    evidenceIds: [autowingcar-streams]
