id: autowingcar
title: 오토잉카 (AutoWing Car)
subtitle: 공항 견인차의 상태와 명령을 관리하는 Spring Boot 관제 서버
category: Java 기반 공항 차량 관제 서버
summary:
  - 공항 토잉카의 상태와 운행 경로를 관리하는 6인 팀 프로젝트입니다. 백엔드 전반을 맡아 차량 통신, 관제 API와 데이터 저장을 구현했습니다.
period: 2026.01 – 2026.02
startDate: '2026-01-16'
endDate: '2026-02-09'
status: complete
team: 6인
role:
- 6인 팀에서 백엔드 전반을 맡아 Spring Boot 관제 서버 구현
- 차량에 보내는 명령과 수신 확인, 실시간 관제 화면 갱신, 차량 상태 변경 흐름 구현
- 이동 비용이 낮은 길을 찾는 A*와 다른 경로를 찾는 Yen 탐색, 경로 모양을 유지하며 점을 줄이는 RDP 구현
- 데이터베이스와 임시 상태 저장, 로그인 확인 토큰, 배포 환경과 k6 부하 시험 환경 구성
stack:
- Java 17
- Spring Boot
- MQTT
- WebSocket, STOMP
- PostgreSQL
- Redis
- Docker
- GitLab CI
- k6
cover:
  src: /assets/오토잉카_실물.png
  alt: 오토잉카 (AutoWing Car) 프로젝트 화면
architecture:
  src: /assets/autowing-system-architecture.svg
  alt: 차량과 인공지능 서비스가 장비 메시지와 웹 요청으로 Java 서버에 연결되고 관제 화면은 실시간 연결로 갱신되는 구성도
  summary:
  - MQTT로 차량 상태와 명령 응답을 받고, WebSocket·STOMP로 관제 화면에 변경 내용을 보냈습니다.
  - AI 모듈·차량 장치·관제 화면 사이의 백엔드 흐름을 맡았습니다.
