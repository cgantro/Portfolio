id: autowingcar
title: 오토잉카 (AutoWing Car)
subtitle: 공항 견인차 상태 관제와 운행 경로
category: 공항 견인차 관제·실시간 통신·운행 상태 관리
summary:
  - MQTT 차량 상태와 명령 응답을 관제 화면에 연결하고, 늦게 도착한 상태가 서버의 최신 운행 상태를 덮지 않도록 처리했습니다.
period: 2026.01 – 2026.02
startDate: '2026-01-16'
endDate: '2026-02-09'
status: complete
team: 6인
role:
- 6인 팀의 서버 개발 담당으로 차량 메시지 수신과 운행 명령 전달 구현
- 관제 화면의 실시간 상태 갱신과 차량 상태·주행 이력 저장 구현
- 기본·대체 경로 탐색과 지도 표시용 경로 정리 구현
- 운행 기록을 묶어 저장하고 실패한 기록을 다시 처리
stack:
- Java 17
- Spring Boot
- MQTT
- WebSocket·STOMP
- Redis
- PostgreSQL
