  - title: 운행 기록 저장
    items:
    - text: Redis Streams에 운행 기록을 모아 저장하고 실패한 기록을 재처리
      evidenceIds: [autowingcar-streams]
    - text: 데이터베이스 저장을 확인한 뒤 처리 완료 표시, 같은 기록의 중복 저장 방지
      evidenceIds: [autowingcar-streams]
    - text: 차량 상태 저장이 끝난 뒤 운행 기록을 전달하도록 순서 조정
      evidenceIds: [autowingcar-streams]
  troubleshooting:
  - title: 도킹한 차량이 다시 이동 중으로 표시됨
    symptom: 서버 상태가 `DOCKING`일 때 MQTT 보고의 `MOVING_TO_GATE`가 반영되면 운행 상태가 이동 중으로 되돌아갈 수 있었습니다.
    cause: MQTT 상태 보고에는 시각 정보가 없어 메시지 순서를 비교할 수 없습니다.
    solution: 서버 상태가 `DOCKING`이고 수신 상태가 `MOVING_TO_GATE`인 조합에서는 수신값을 반영하지 않고 `DOCKING`을 유지합니다.
    verification: 시각을 비교하지 않고, 현재 상태와 수신 상태의 조합만 확인합니다.
    evidenceIds: [autowingcar-public]
    metricIds: []
    diagram:
      src: /assets/autowing-state-order.svg
      alt: 서버의 DOCKING 상태와 MQTT의 MOVING_TO_GATE 보고를 비교해 DOCKING을 유지하는 좌우 흐름
      caption: DOCKING과 MOVING_TO_GATE 조합에서는 서버 상태를 유지합니다.
      width: 1180
      height: 460
    code:
      path: Backend/autowing_car/src/main/java/com/project/domain/towingcar/service/TowingCarService.java
      language: java
      title: DOCKING 상태에서 이전 단계 보고 제외
      source: |-
        if (assignedCar.getCarStatus() == CarStatus.DOCKING
            && status == CarStatus.MOVING_TO_GATE) {
            status = CarStatus.DOCKING;
        }
      url: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/src/main/java/com/project/domain/towingcar/service/TowingCarService.java
  - title: 데이터베이스 반영 전에 차량 명령이 발행될 수 있음
    symptom: 데이터베이스 저장이 취소돼도 차량은 운행 명령을 받을 수 있었습니다.
    cause: MQTT 발행이 데이터베이스 커밋을 기다리지 않았습니다.
    solution: 데이터베이스 커밋이 끝난 뒤 명령을 발행하도록 순서를 바꿨습니다.
    verification: 서비스 시험에서 데이터베이스 커밋 뒤 MQTT 명령과 전달 내용을 확인했습니다.
    evidenceIds: [autowingcar-command-order]
    metricIds: []
    diagram:
      src: /assets/autowing-after-commit.svg
      alt: 데이터베이스 커밋 전에 명령을 발행하면 저장 실패 뒤 차량만 명령을 받으며, 커밋 뒤 발행하면 저장 실패 시 명령을 보내지 않는 비교
      caption: 데이터베이스 커밋이 끝난 뒤 차량 명령을 발행합니다.
      width: 1120
      height: 470
    code:
      path: Backend/autowing_car/src/main/java/com/project/service/MissionService.java
      language: java
      title: 트랜잭션 커밋 뒤 주행 명령 발행
      source: |-
        TxUtil.executeAfterCommit(() ->
            towingCarMqttService.sendDriveCommand(car.getCode(), payload));
      url: https://github.com/cgantro/Autowing_car/blob/main/Backend/autowing_car/src/main/java/com/project/service/MissionService.java
