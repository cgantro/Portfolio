evidence:
- id: dronesim-source
  label: DroneSim 공개 저장소와 측정 기록
  source: https://github.com/cgantro/DroneSim
  kind: repository
  status: reported
  locator: README.md, modules/simulation_core/src/SimulationCore.cpp, modules/simulation_core/src/ScenarioRunner.cpp, benchmarks/results
  note: 공개 코드와 기록에서 구현 및 수치를 대조했습니다. 이 포트폴리오에서 별도 빌드나 실기체 검증을 수행했다는 뜻은 아닙니다.
- id: dronesim-sort-reuse
  label: 충돌 정렬 재사용 전후 코드와 반복 측정
  source: https://github.com/cgantro/DroneSim
  kind: repository
  status: reported
  locator: modules/simulation_core/src/PhysicsWorld.cpp, benchmarks/results/archive/aerosimlab-full-benchmark-release-2026-10-23-94c39b94-before-sort-reuse.json, benchmarks/results/archive/aerosimlab-full-benchmark-release-2026-10-23-69ecab93-after-sort-reuse.json
  note: 포트폴리오의 중앙값은 원자료의 세 반복 p95를 직접 정렬해 중앙값으로 다시 계산했습니다.
- id: dronesim-reallocation
  label: 상태 보고 단절과 임무 재할당 시나리오
  source: https://github.com/cgantro/DroneSim
  kind: repository
  status: reported
  locator: modules/simulation_core/src/ScenarioRunner.cpp, benchmarks/results/archive/aerosimlab-full-benchmark-release-2026-10-24-26c7fce1.json
  note: 운동학 헤드리스 시나리오의 합성 상태 보고 단절 결과입니다. 실제 UDP 링크 장애나 실기체 비행 결과는 아닙니다.
limitations:
- 드론과 장애물의 충돌 형상은 상자로 단순화하며, 강체마다 한 주기에 접촉 한 건만 처리합니다. 세밀한 메시 충돌이나 여러 접촉이 동시에 일어나는 상황은 다루지 않습니다.
- PX4 공개 기록 재생은 추정 위치와 개루프 입력을 비교합니다. 독립 측량 위치와 실측 추력 자료가 없어 실기체 비행 정확도를 판정하지 않습니다.
