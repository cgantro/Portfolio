id: dronesim
title: DroneSim
subtitle: 비행·카메라·지상통제와 다중 드론 시나리오를 시험하는 C++ 시뮬레이터
category: C++ 드론 시뮬레이션
summary:
- DroneSim은 가상 드론의 비행 상태와 탑재 카메라, 지상통제 명령을 한 시뮬레이션에서 시험하는 개인 프로젝트입니다. 실행 화면에는 AeroSimLab이라는 제품명이 표시됩니다.
- 화면이 있는 시뮬레이터와 화면 없는 JSON 시나리오 실행이 같은 SimulationCore를 사용합니다. Windows 네이티브 강체 모드에는 AirSim을 연결하고, WebAssembly에서는 운동학 기준 모델을 사용합니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- 고정 시간 간격의 비행 상태 갱신, 드론·카메라 ECS와 네이티브 강체 물리 연결 구현
- 화면·게임패드·UDP 지상통제·JSON 시나리오가 공통 시뮬레이션 명령을 사용하도록 구성
- 다중 드론 편대, 통신 장애, 카메라 고장 및 화면 없는 공동 임무 시험 구현
- Tick 처리와 충돌 계산을 계측하고, 재현 가능한 조건과 한계를 공개 문서에 기록
stack:
- C++20
- CMake, Flecs ECS
- AirSim 강체 물리
- OpenGL, GLFW, GLM
- OpenCV 영상 분석
- UDP, JSON, 게임패드 입력
- WebAssembly, Emscripten
- CTest, Google Benchmark
cover:
  src: /assets/DroneSim-preview.jpg
  alt: AeroSimLab 시뮬레이터의 산악 지형 장면, 비행 상태 패널과 드론 카메라 화면
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 게임패드, UDP 지상통제와 화면 없는 시나리오가 SimulationCore에 입력되고, 물리·상태가 렌더링과 카메라 분석으로 이어지는 구조
  summary:
  - 화면과 화면 없는 시나리오는 같은 SimulationCore를 사용해 동일한 비행 명령과 Tick 갱신 경로를 공유합니다.
  - Flecs가 드론·카메라 상태를 갱신합니다. Windows 네이티브 강체 모드에서만 AirSim 물리 단계를 호출하고, WebAssembly에서는 운동학 모델을 사용합니다.
  - 렌더링은 장면과 드론 탑재 EO 카메라를 별도 대상으로 그립니다. 지상통제는 UDP로 명령과 상태를 주고받습니다.
