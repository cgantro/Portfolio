  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-2
  text: UDP 지상통제, 게임패드, JSON 시나리오 입력을 공통 드론 명령으로 처리하고 통신 지연·손실과 편대 통신 단절을 재현했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-3
  text: 충돌 후보 목록의 X 좌표를 갱신한 뒤 순서가 바뀐 경우에만 다시 정렬하도록 바꾸고, 분리·밀집 배치에서 변경 전후 물리 단계 시간을 측정했습니다.
  evidenceIds:
  - dronesim-sort-reuse
  status: reported
- id: dronesim-contribution-4
  text: 헤드리스 JSON 시나리오에서 상태 보고 단절을 모의하고 미완료 과제를 재할당해, 4~256대 조건의 임무 완료와 실행 시간을 확인했습니다.
  evidenceIds:
  - dronesim-reallocation
  status: reported
outcomes:
- id: dronesim-outcome-1
  text: 충돌 후보 목록의 순서가 유지되면 재정렬을 건너뛰도록 바꿨고, 비교한 5개 배치·기체 수 조건에서 물리 단계 p95가 2.0~13.5% 줄었습니다.
  evidenceIds:
  - dronesim-sort-reuse
  status: reported
- id: dronesim-outcome-2
  text: Windows Release의 로컬 연결에서 네이티브 H.264/RTP 인코딩·전송·디코딩 왕복을 확인했습니다. 자동 시험에서는 녹화 자료 전달과 CRC-32 대조를, 웹에서는 Chromium으로 내려받은 자료의 크기와 SHA-256을 확인했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-outcome-3
  text: 지정한 헤드리스 다중 드론 시나리오에서 전체 기체의 25%에 상태 보고 단절을 넣고, 4~256대 조건별 3회 모두 임무 완료율 100%를 기록했습니다. 합성 입력에 대한 시나리오 결과입니다.
  evidenceIds:
  - dronesim-reallocation
  status: reported
