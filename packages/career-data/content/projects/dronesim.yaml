  locator: PX4 기록 재생의 float 접촉 비교와 수정 뒤 12회 상태 반복 비교
limitations:
- 드론과 장애물의 충돌 형상은 상자로 단순화하며, 강체마다 한 주기에 접촉 한 건만 처리합니다. 세밀한 메시 충돌이나 여러 접촉이 동시에 일어나는 상황은 다루지 않습니다.
- PX4 공개 기록 재생은 추정 위치와 개루프 입력을 비교합니다. 독립 측량 위치와 실측 추력 자료가 없어 실기체 비행 정확도를 판정하지 않습니다.
