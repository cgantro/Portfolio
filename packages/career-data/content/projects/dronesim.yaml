  source: https://github.com/cgantro/DroneSim
  kind: repository
  status: reported
  locator: README.md, modules/simulation_core/src/SimulationCore.cpp, modules/simulation_core/src/ScenarioRunner.cpp, benchmarks/results
  note: 공개 코드와 기록에서 구현 및 수치를 대조했습니다. 이 포트폴리오에서 별도 빌드나 실기체 검증을 수행했다는 뜻은 아닙니다.
limitations:
- 물리 계수는 공개 자료를 참고했으며 실제 비행 로그와 대조하지 않았습니다. 디지털 트윈 또는 비행 안전·성능 예측으로 볼 수 없습니다.
- AirSim 강체 물리는 Windows 네이티브 실행에 한정됩니다. WebAssembly 데모는 운동학 기준 모델을 사용합니다.
- 충돌 형상은 드론과 장애물을 상자로 근사하며, 한 강체당 Tick마다 접촉 한 건을 처리합니다. 정밀 메시 충돌이나 복수 접촉의 완전한 물리 반응은 지원하지 않습니다.
- 지형 높이는 약 30m 간격이며, 건물 자료가 없는 일부 위치의 3m 상자는 시연용입니다.
- 실제 게임패드 기기별 동작, 장시간 실행 안정성, 영상 분석을 포함한 전체 경로 성능은 공개 측정에서 확인되지 않았습니다.
