id: dronesim
title: DroneSim
subtitle: 시설물 외벽 영상 수집 임무를 모의하는 드론 시뮬레이터
category: 드론 시뮬레이션
summary:
- 탄천교 주변 지형에서 드론 비행과 지상통제, 외벽 EO 영상 수집·저장을 시험합니다. 영상과 위치·시각·자세 기록을 함께 남깁니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- Flecs ECS를 이용해 화면 갱신과 분리된 60Hz 고정 주기 시뮬레이션 코어를 구성하고, 네이티브 AirSim 강체 물리와 웹 운동학 모델을 구분했습니다.
- 게임패드·UDP 지상통제·JSON 시나리오 입력을 공통 비행 명령으로 연결하고, 헤드리스 임무·충돌 시험을 구성했습니다.
- EO 영상 촬영·기록과 네이티브 H.264/RTP 송수신, 녹화 파일 전달을 지상통제 프로그램에 연결했습니다.
stack:
- Flecs ECS
- AirSim 강체 물리
- UDP 지상통제
- GStreamer·H.264/RTP
cover:
  src: /assets/DroneSim-current-view.png
  alt: OSM 건물 외벽 시험 위치를 선택해 EO 영상 수집 임무를 진행하는 DroneSim 웹 지상통제 화면
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 게임패드·UDP·JSON 입력이 공통 비행 명령과 고정 주기 시뮬레이션을 거쳐 외벽 EO 촬영 임무로 이어지고, 네이티브와 웹 모델이 나뉘는 구조
  summary:
  - 게임패드·UDP·JSON 입력은 공통 비행 명령을 거쳐 고정 주기 시뮬레이션에 들어갑니다.
  - 시뮬레이션은 네이티브의 AirSim 강체 물리 또는 웹의 운동학 모델로 드론 상태를 계산합니다.
  - EO 프레임은 실시간 H.264/RTP 영상 경로와 녹화 파일·촬영 기록 경로로 나뉘어 지상통제 프로그램에 전달됩니다. 웹 저장 자료는 별도로 내려받습니다.
links:
  github: https://github.com/cgantro/DroneSim
  demo: https://cgantro.github.io/DroneSim/
contributions:
- id: dronesim-contribution-1
  text: 화면 그리기와 분리된 고정 시간 간격의 시뮬레이션 중심부를 만들고, 네이티브 실행에서만 AirSim 강체 물리를 연결했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-2
  text: UDP 지상통제, 게임패드, JSON 시나리오 입력을 공통 드론 명령으로 처리하고 통신 지연·손실과 편대 통신 단절을 재현했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-3
  text: 충돌 후보 목록의 X 좌표를 갱신한 뒤 순서가 바뀐 경우에만 다시 정렬하도록 바꾸고, 분리·밀집 배치에서 변경 전후 물리 단계 시간을 측정했습니다.
  evidenceIds:
  - dronesim-sort-reuse
  status: reported
- id: dronesim-contribution-4
  text: 헤드리스 JSON 시나리오에서 상태 보고 단절을 모의하고 미완료 과제를 재할당해, 4~256대 조건의 임무 완료와 실행 시간을 확인했습니다.
  evidenceIds:
  - dronesim-reallocation
  status: reported
outcomes:
- id: dronesim-outcome-1
  text: 화면 조작과 화면 없는 시나리오 시험이 같은 SimulationCore를 사용하므로, 입력 장치와 화면 없이도 비행 규칙과 최종 상태를 확인할 수 있습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-outcome-2
  text: 웹 빌드는 AirSim 물리 대신 운동학 기준 모델을 사용합니다. 네이티브 강체 동작이나 실기체의 비행 성능을 웹 데모가 검증한다고 해석하지 않습니다.
  evidenceIds:
  - dronesim-source
  status: reported
