  text: 화면 갱신과 별도로 정해진 간격으로 드론 상태를 계산하고, Windows 실행에 AirSim 물리 모델을 연결했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-2
  text: 게임패드와 지상통제 명령으로 드론을 조종하고, 저장한 입력을 다시 실행하는 기능을 만들었습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-3
  text: 충돌 후보 목록이 이미 순서대로라면 정렬을 건너뛰도록 바꾸고, 드론 수와 배치에 따라 물리 계산 시간을 비교했습니다.
  evidenceIds:
  - dronesim-sort-reuse
  status: reported
- id: dronesim-contribution-4
  text: 자동 시험에서 통신 보고가 끊긴 기체의 남은 임무를 다른 기체에 다시 맡겼습니다.
  evidenceIds:
  - dronesim-reallocation
  status: reported
outcomes:
- id: dronesim-outcome-1
  text: 충돌 후보 정렬 재사용 후 물리 단계 p95 2.0~13.5% 감소
  evidenceIds:
