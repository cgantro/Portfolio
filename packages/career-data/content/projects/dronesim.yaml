id: dronesim
title: DroneSim
subtitle: 드론 비행과 카메라, 지상통제 명령을 시험하는 C++ 시뮬레이터
category: C++ 드론 시뮬레이션
summary:
- DroneSim은 가상 드론의 비행과 탑재 카메라, 지상통제 명령을 한 시뮬레이터에서 시험하는 개인 프로젝트입니다. 실행 화면에는 AeroSimLab이라는 제품명이 표시됩니다.
- 화면을 띄워 조작하거나 화면 없이 JSON 시나리오를 실행할 때 모두 같은 SimulationCore를 사용합니다. Windows 네이티브 실행에서는 AirSim 강체 물리를 선택할 수 있고, WebAssembly에서는 운동학 모델을 씁니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- 고정 시간 간격의 비행 상태 갱신, 드론·카메라 ECS와 네이티브 강체 물리 연결 구현
- 화면 조작, 게임패드, UDP 지상통제, JSON 시나리오의 입력을 공통 시뮬레이션 명령으로 처리
- 여러 드론의 편대 비행과 통신·카메라 장애, 화면 없는 공동 임무 시험 구현
- 시뮬레이션 주기와 충돌 계산 시간을 측정하고, 조건과 한계를 공개 문서에 기록
stack:
- C++20
- CMake, Flecs ECS
- AirSim 강체 물리
- OpenGL, GLFW, GLM
- OpenCV 영상 분석
- UDP, JSON, 게임패드 입력
- WebAssembly, Emscripten
- CTest, Google Benchmark
cover:
  src: /assets/DroneSim-preview.jpg
  alt: AeroSimLab 시뮬레이터의 산악 지형 장면, 비행 상태 패널과 드론 카메라 화면
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 게임패드, UDP 지상통제와 화면 없는 시나리오가 SimulationCore에 입력되고, 물리·상태가 렌더링과 카메라 분석으로 이어지는 구조
  summary:
  - 화면 조작과 화면 없는 시나리오 실행은 같은 SimulationCore를 사용하므로 비행 명령과 주기 갱신 방식이 같습니다.
  - Flecs가 드론과 카메라 상태를 갱신합니다. Windows 네이티브 강체 모드에서만 AirSim 물리를 호출하고, WebAssembly에서는 운동학 모델을 씁니다.
  - 화면에는 장면과 드론 탑재 EO 카메라 영상을 각각 그립니다. 지상통제 장치와는 UDP로 명령과 상태를 주고받습니다.
