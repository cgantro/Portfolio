id: dronesim
title: DroneSim
subtitle: 드론 비행·EO 영상 수집·지상통제 시험 시뮬레이터
category: 드론 시뮬레이션·임무 시험
summary:
  - 지상통제 명령을 일정한 주기의 비행 계산에 연결하고, 촬영 영상과 비행 기록을 관제 프로그램에 전달하는 시뮬레이터입니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- Flecs ECS 기반 시뮬레이션 코어를 구성하고, 화면 갱신과 분리된 60Hz 고정 주기로 드론 상태를 갱신했습니다.
- 게임패드·UDP 지상통제·JSON 시나리오 입력을 공통 비행 명령으로 처리하고, 비행·충돌·임무 재할당 시험을 구현했습니다.
- 가상 EO 카메라의 촬영·기록 기능을 구현하고, 네이티브 실행의 실시간 영상과 녹화 자료를 지상통제 프로그램에 연결했습니다.
stack:
- C++20
- Flecs
- AirSim
- OpenGL
- OpenCV
- UDP
- GStreamer
- CMake
cover:
  src: /assets/DroneSim-native-scene.png
  alt: DroneSim 3D 장면에서 아파트형 건물 사이를 비행하는 작은 드론
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 게임패드와 지상통제 명령이 일정한 주기로 드론 비행 계산에 반영되고, 촬영 영상과 비행 기록이 관제 화면으로 전달되는 구조
  summary:
  - 게임패드와 지상통제 명령을 일정한 주기로 처리해 드론의 위치와 자세를 계산합니다.
  - Windows 실행은 AirSim 물리 모델을 쓰고, 웹 데모는 간략한 비행 모델을 씁니다.
  - Windows 실행은 H.264 영상으로 실시간 전송합니다. 촬영 영상은 파일로 저장하고 위치·시각·기체 자세를 비행 기록에 남깁니다.
detail:
  layout: dronesim
  overview: 탄천교 주변 가상 환경에서 드론 비행과 시설물 외벽 촬영 임무를 시험하는 시뮬레이터입니다. 지상통제 명령, 비행 상태 갱신, EO 영상 수집과 촬영 기록을 한 환경에서 다룹니다. Windows 실행과 웹 데모는 서로 다른 비행 모델을 사용합니다.
  verificationScope:
  - 충돌 형상은 상자로 단순화했습니다.
  - PX4 기록 재생은 실제 기체의 비행 정확도 검증이 아닙니다.
  features:
  - title: 드론 비행
    description: 게임패드와 지상통제 명령으로 이륙·호버링·이동·착륙을 조작하고 기체 상태를 확인합니다.
    implementation: 게임패드와 UDP 지상통제, JSON 시나리오의 입력을 공통 비행 명령으로 바꿉니다. 시뮬레이션 코어는 누적된 모의 시간을 1/60초 단위로 처리해 명령과 드론 상태를 갱신합니다. 물리 계산은 화면 갱신과 분리하며 Windows에서는 AirSim 강체 물리 모델을, 웹에서는 운동학 모델을 사용합니다.
    processSteps:
    - 게임패드·지상통제·기록 명령 입력
    - 고정 주기 Tick에서 비행 명령과 기체 상태 갱신
    - 실행 환경에 맞는 물리 모델로 위치·자세 계산
    - 갱신한 상태를 화면과 지상통제에 표시
    diagram:
      src: /assets/dronesim-flight-flow.svg
      alt: 게임패드와 지상통제 명령을 고정 주기 모의 Tick에 적용하고 계산한 기체 상태를 화면과 지상통제에 전달하는 흐름
      caption: 화면 갱신 시간과 모의 시간을 분리해 명령을 일정한 1/60초 간격으로 처리합니다.
      width: 1120
      height: 300
    evidenceIds: [dronesim-source]
  - title: 3D 환경
    description: 탄천교 주변 지형·건물·도로·교량을 배치한 가상 환경에서 드론 비행과 시설물 접근을 시험합니다.
    implementation: 90m DEM의 높이값을 수치지도 표고점·등고선 자료로 보정해 5m 간격 지형 격자를 구성했습니다. 주변 정사영상과 OSM 건물·도로·교량 자료를 배치했습니다. 5m는 보정 자료를 보간한 격자 간격입니다.
    evidenceIds: [dronesim-source]
  - title: 외벽 촬영 임무
    description: 지정한 외벽 촬영 지점으로 이동해 EO 영상을 수집하고 촬영 시각·기체 위치·자세를 기록합니다.
    implementation: 지상통제에서 촬영 지점을 고르면 임무 상태에 따라 이륙·접근·카메라 정렬·촬영·착륙을 진행합니다. 카메라는 드론 위치와 자세를 반영해 영상을 만들고 프레임에 모의 시각·기체 자세·촬영 판정을 연결해 기록합니다. 네이티브에서는 영상 전송과 녹화 파일·비행 기록 저장을 구분하며, 저장한 촬영 자료는 지상통제 프로그램에 전달합니다.
    processSteps:
    - 지상통제에서 외벽 촬영 위치 선택
    - 비행 경로를 따라 이동하고 카메라 화면 확인
    - 영상 프레임과 모의 시각·기체 자세 기록
    - 촬영 자료를 저장하고 지상통제 프로그램으로 전달
    diagram:
      src: /assets/dronesim-eo-flow.svg
      alt: 촬영 위치 선택부터 드론 접근, EO 영상과 기체 상태 기록, 자료 저장 및 전달까지의 흐름
      caption: 영상 프레임과 같은 시점의 기체 상태·촬영 판정을 함께 기록합니다.
      width: 1120
      height: 300
    evidenceIds: [dronesim-source]
  - title: 다중 드론 운용
    description: 여러 드론의 비행과 임무를 관리하고, 상태 보고가 끊긴 기체의 미완료 임무를 다른 기체에 재할당하는 상황을 시험합니다.
    implementation: 네이티브 지상통제에서는 최대 8대의 편대 비행을 조작합니다. 화면 없는 시나리오 시험에서는 4·16·64·256대 조건에 전체 기체의 25%가 상태 보고를 중단하도록 설정했습니다. 미완료 임무를 다른 기체에 재배정하는 동작을 조건별 3회 시험했으며, 실제 통신 장애를 일으킨 시험은 아닙니다.
    processSteps:
    - 시나리오에 기체·임무·통신 단절 조건 입력
    - 하트비트 제한 시간 뒤 기체 상태를 미확정으로 변경
    - 해당 기체의 미완료 임무를 대기 상태로 반환
    - 다른 기체에 임무를 배정하고 완료 여부 기록
    diagram:
      src: /assets/dronesim-reallocation-flow.svg
      alt: 상태 보고가 끊긴 기체를 미확정 상태로 바꾸고 미완료 임무를 대기열에 돌려 다른 기체에 배정하는 흐름
      caption: 시나리오 입력으로 통신 단절을 재현하고 임무 반환·재배정 결과를 기록합니다.
      width: 1120
      height: 340
    verification: 4·16·64·256대 조건별 3회 실행에서 지정 임무 완료율은 100%였습니다.
    evidenceIds: [dronesim-reallocation]
  - title: 시나리오 기록·재생
    description: 비행 명령과 장애 상황을 기록하거나 다시 실행해 같은 조건의 시험을 반복합니다.
    implementation: 시나리오 파일의 명령·장애 이벤트를 Tick에 맞춰 적용하고, 실행 결과에는 비행 상태와 임무 진행 기록을 남깁니다. 화면 없는 실행에서도 SimulationCore의 같은 고정 주기 코어를 호출합니다.
    evidenceIds: [dronesim-source]
  roleAreas:
  - title: 시뮬레이션 코어
    items:
    - text: Flecs ECS 기반 드론·물리 객체·카메라 상태 관리
      evidenceIds: [dronesim-source]
    - text: 화면 갱신과 별도로 초당 60회 상태를 계산하고, 화면 없이도 같은 비행 시험을 실행
      evidenceIds: [dronesim-source]
  - title: 비행 제어·물리
    items:
    - text: 목표 위치와 자세에 맞춰 비행 제어값을 계산
      evidenceIds: [dronesim-source]
    - text: 로터별 회전 속도를 계산해 네이티브 강체 물리 모델에 전달
      evidenceIds: [dronesim-source]
    - text: 네이티브 강체 물리와 웹 운동학 모델을 분리
      evidenceIds: [dronesim-source]
  - title: 충돌 처리
    items:
    - text: 드론 충돌 모양과 장애물 접촉 판정 구현
      evidenceIds: [dronesim-source]
    - text: 충돌 후보 계산을 줄이고 후보 목록 정렬을 재사용
      evidenceIds: [dronesim-sort-reuse]
  - title: 3D 그래픽스
    items:
    - text: 드론·지형·건물·시설물의 3D 장면 구현
      evidenceIds: [dronesim-source]
    - text: 탄천교 주변 지형 자료와 항공사진에 건물·도로·교량을 배치
      evidenceIds: [dronesim-source]
  - title: 촬영 영상
    items:
    - text: 드론 위치와 방향에 맞춰 영상을 찍는 가상 카메라 구현
      evidenceIds: [dronesim-source]
    - text: 촬영한 영상에 촬영 시각·위치·자세 기록 연결
      evidenceIds: [dronesim-source]
    - text: 실행 환경에 맞춰 촬영 영상과 기록 저장
      evidenceIds: [dronesim-source]
  - title: 통신·지상통제
    items:
    - text: 게임패드와 지상통제 명령을 비행 조작으로 연결하고 중복 명령을 검사
      evidenceIds: [dronesim-source]
    - text: 명령을 정해진 시뮬레이션 주기에 적용하고 결과와 현재 기체 상태 응답
      evidenceIds: [dronesim-source]
    - text: 실시간 영상과 녹화 자료를 지상통제 화면에 전달
      evidenceIds: [dronesim-source]
  - title: 임무·시험
    items:
    - text: 외벽 촬영 임무의 이동·촬영·일시정지·재개·중단 처리
      evidenceIds: [dronesim-source]
    - text: 드론 상태 보고가 끊겼을 때 미완료 임무를 다른 드론에 다시 배정하는 시험
      evidenceIds: [dronesim-reallocation]
    - text: 조종 명령 기록·재생과 시뮬레이션 처리시간 확인
      evidenceIds: [dronesim-source]
  troubleshooting:
  - title: 충돌 후보를 찾기 전마다 전체 목록을 다시 정렬함
    symptom: 물리 단계마다 충돌 후보를 찾기 위해 강체의 X 좌표 목록을 다시 정렬했습니다.
    cause: 강체 좌표를 갱신한 뒤에도 정렬 순서가 유지되는 경우가 있었지만, 기존에는 이를 확인하지 않고 매번 전체 정렬을 수행했습니다.
    solution: 갱신한 X 좌표 목록에 `std::is_sorted`를 적용해 순서가 유지됐는지 확인하고, 순서가 바뀐 경우에만 `std::sort`를 실행하도록 바꿨습니다.
    verification: Windows Release에서 준비 120 Tick 뒤 30,000 Tick을 조건별 3회 실행했습니다. 다섯 배치·기체 수 조건에서 물리 단계 p95의 반복별 중앙값이 2.0~13.5% 감소했습니다.
    evidenceIds: [dronesim-sort-reuse]
    metricIds: [separated-128-physics-p95, separated-256-physics-p95, separated-512-physics-p95, compact-128-physics-p95, compact-256-physics-p95]
    comparison:
      caption: Windows Release, 준비 120 Tick 후 30,000 Tick씩 3회 실행한 반복별 p95 중앙값. 물리 단계에 좌표 갱신과 후보 쌍 검사를 포함합니다.
      columns: [물리 단계 p95 전, 물리 단계 p95 후, 감소율]
      rows:
      - label: 분리·128대
        values: [188.0µs, 184.2µs, 2.0%]
      - label: 분리·256대
        values: [370.1µs, 345.4µs, 6.7%]
      - label: 분리·512대
        values: [741.8µs, 669.9µs, 9.7%]
      - label: 밀집·128대
        values: [472.3µs, 408.6µs, 13.5%]
      - label: 밀집·256대
        values: [827.6µs, 791.6µs, 4.4%]
      evidenceIds: [dronesim-sort-reuse]
    code:
      path: modules/simulation_core/src/PhysicsWorld.cpp
      language: cpp
      title: X 좌표 순서가 바뀔 때만 후보 목록 정렬
      source: |-
        for (auto& [positionX, bodyIndex] : bodyPositionsByX)
            positionX = bodies[bodyIndex]->collisionState.positionMeters.x;

        if (!std::is_sorted(bodyPositionsByX.begin(), bodyPositionsByX.end()))
            std::sort(bodyPositionsByX.begin(), bodyPositionsByX.end());
      url: https://github.com/cgantro/DroneSim/blob/main/modules/simulation_core/src/PhysicsWorld.cpp
  - title: PX4 기록을 다시 재생할 때 바닥 접촉 판정이 달라짐
    symptom: 같은 비행 기록을 재생해도 바닥에 닿는 위치가 실행마다 달랐습니다.
    cause: 좌표가 반올림 경계에 걸려 접촉 여부가 바뀌었습니다.
    solution: 좌표 크기에 맞는 오차 범위를 적용해 경계 근처의 접촉 판정을 고쳤습니다.
    verification: 새 실행 환경에서 같은 기록을 12회 재생해 접촉 판정이 반복되는 것을 확인했습니다.
    evidenceIds: [dronesim-px4]
    metricIds: []
