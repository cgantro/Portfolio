id: dronesim
title: DroneSim
subtitle: 여러 드론의 통신·임무 시험 시뮬레이터
category: 드론·실시간 통신 시뮬레이션
summary:
  - 네 대의 드론이 편대 이동과 정찰을 수행하고, 통신 경로와 장애 대응을 가상 환경에서 반복 시험합니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- 화면 갱신과 분리된 60Hz 시뮬레이션 주기와 드론별 상태 갱신을 구현했습니다.
- 기체 사이 통신 경로와 주요 명령의 도착 확인·재전송, 통신·기체 장애 시험을 구현했습니다.
- 편대 이동·정찰·임무 재배정과 네이티브 비행 물리, 드론별 카메라 화면을 연결했습니다.
stack:
- C++20
- Flecs
- AirSim
- OpenGL
- OpenCV
- UDP
- GStreamer
- CMake
cover:
  src: /assets/DroneSim-native-scene.png
  alt: 가상 훈련장에서 드론이 건물 사이를 비행하는 장면
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 임무와 비행 명령이 고정 주기 시뮬레이션을 거쳐 드론 상태와 화면을 갱신하는 흐름
  summary:
  - 명령과 임무 진행은 초당 60회 고정 주기로 계산합니다.
  - 가상 통신망에서 기체 사이 직접 연결·중계 경로와 장애 상황을 시험합니다.
  - Windows 실행은 AirSim 강체 물리를, 웹 데모는 간략한 비행 계산을 사용합니다.
detail:
  layout: dronesim
  overview: 한 프로그램에서 네 대의 드론이 편대 이동, 지점별 정찰, 재집결과 복귀를 수행하는 시뮬레이터입니다. 가상 통신 경로와 기체 장애를 설정해 임무가 어떻게 이어지거나 중단되는지 살펴봅니다. 화면에는 3D 장면과 드론별 카메라 영상을 표시합니다.
  verificationScope:
  - 기본 장면은 실제 지형이 아닌 절차 생성 훈련장입니다.
  - Windows와 웹은 서로 다른 비행 모델을 사용합니다.
  features:
  - title: 편대 비행과 정찰
    description: 네 대의 드론을 편대로 이동시키고 정찰 지점을 나눠 맡긴 뒤 함께 복귀시킵니다.
    implementation: M01에서 편대로 이동하고, M02에서 각 기체가 맡은 지점의 영상과 위치 정보를 모읍니다. M03에서는 편대를 다시 모아 출발 지점으로 돌아옵니다.
    processSteps:
    - 편대 경로와 정찰 지점 설정
    - 리더가 경로와 정찰 임무를 나눔
    - 각 기체가 목표를 수행하고 위치·영상을 기록
    - 편대 재집결과 복귀
    diagram:
      src: /assets/dronesim-flight-flow.svg
      alt: 임무 명령을 고정 주기로 처리해 기체 상태를 계산하고 화면에 표시하는 흐름
      caption: 편대 이동, 정찰, 복귀를 하나의 임무 흐름으로 실행합니다.
      width: 1120
      height: 300
    evidenceIds: [dronesim-source]
  - title: 가상 통신 경로
    description: 드론끼리 직접 연결하거나 리더·다른 드론을 거쳐 명령과 상태를 주고받습니다.
    implementation: 직접 연결, 리더 경유, 고정 중계, 장애 뒤 경로를 다시 찾는 방식을 선택할 수 있습니다. 건물 가림과 통신 거리를 가상 링크에 반영해 경로가 어떻게 달라지는지 살펴봅니다.
    processSteps:
    - 드론 사이 통신 가능한 링크 계산
    - 선택한 방식으로 경로 구성
    - 중요한 명령은 도착 확인을 기다리고 응답이 없으면 재전송
    - 통신 경로가 끊기면 새 경로 탐색
    evidenceIds: [dronesim-source]
  - title: 통신·기체 장애 대응
    description: 통신 단절이나 로터 고장이 임무에 미치는 영향을 넣고 재배정·복귀·착륙을 확인합니다.
    implementation: 추종 기체가 고장 나면 남은 정찰 지점을 다시 나눕니다. 리더가 고장 나면 새 리더가 미완료 임무를 이어받고, 연결할 기체가 없으면 임무를 멈추고 착륙을 요청합니다.
    processSteps:
    - 장애 종류와 발생 시각 설정
    - 기체·통신 상태 변화 확인
    - 남은 목표 재배정 또는 임무 중단
    - 복귀·착륙 요청 확인
    diagram:
      src: /assets/dronesim-reallocation-flow.svg
      alt: 상태 보고가 끊긴 기체의 미완료 임무를 다른 기체에 배정하는 흐름
      caption: 통신 단절 뒤 남은 임무를 다시 나누는 과정을 시험합니다.
      width: 1120
      height: 340
    evidenceIds: [dronesim-source, dronesim-reallocation]
  - title: 장애 시나리오 반복
    description: 통신·카메라·로터 장애를 정한 시점에 발생시켜 같은 임무에서 다시 시험합니다.
    implementation: 장애 종류와 시작·복구 시점을 저장해 실행하고, 임무 진행과 통신 경로가 어떻게 바뀌는지 확인합니다.
    evidenceIds: [dronesim-source]
  roleAreas:
  - title: 시뮬레이션 코어
    items:
    - text: Flecs ECS 기반 드론·물리 객체·카메라 상태 관리
      evidenceIds: [dronesim-source]
    - text: 화면 갱신과 별도로 초당 60회 상태를 계산하고, 자동 시험에서는 그래픽 처리를 건너뜀
      evidenceIds: [dronesim-source]
  - title: 비행 제어·물리
    items:
    - text: 목표 위치와 자세에 맞춰 비행 제어값을 계산
      evidenceIds: [dronesim-source]
    - text: 로터별 회전 속도를 계산해 네이티브 강체 물리 모델에 전달
      evidenceIds: [dronesim-source]
    - text: 네이티브 강체 물리와 웹 운동학 모델을 분리
      evidenceIds: [dronesim-source]
  - title: 충돌 처리
    items:
    - text: 드론 충돌 모양과 장애물 접촉 판정 구현
      evidenceIds: [dronesim-source]
    - text: 충돌 후보 계산을 줄이고 후보 목록 정렬을 재사용
      evidenceIds: [dronesim-sort-reuse]
  - title: 3D 장면·카메라
    items:
    - text: 절차 생성한 훈련장과 드론별 카메라 화면 구현
      evidenceIds: [dronesim-source]
    - text: 네이티브 카메라 영상 MP4 녹화와 화면 품질 값 계산
      evidenceIds: [dronesim-source]
  - title: 통신 경로·장애 대응
    items:
    - text: 직접 연결·리더 경유·고정 중계·장애 적응 중계 경로 구현
      evidenceIds: [dronesim-source]
    - text: 중요 명령 도착 확인과 응답이 없을 때 재전송
      evidenceIds: [dronesim-source]
    - text: 통신 단절 뒤 임무 재배정이나 안전 착륙을 요청하는 동작 구현
      evidenceIds: [dronesim-source]
  - title: 임무·시험
    items:
    - text: M01 편대 이동, M02 지점별 정찰, M03 재집결·복귀 처리
      evidenceIds: [dronesim-source]
    - text: 추종 드론·리더 고장 뒤 목표 재배정과 복귀·착륙 시험
      evidenceIds: [dronesim-reallocation]
    - text: 장애 설정을 저장해 같은 조건으로 반복 시험
      evidenceIds: [dronesim-source]
  troubleshooting:
  - title: 충돌 후보를 찾기 전마다 전체 목록을 다시 정렬함
    symptom: 물리 단계마다 충돌 후보를 찾기 위해 강체의 X 좌표 목록을 다시 정렬했습니다.
    cause: 강체 좌표를 갱신한 뒤에도 정렬 순서가 유지되는 경우가 있었지만, 기존에는 이를 확인하지 않고 매번 전체 정렬을 수행했습니다.
    solution: 갱신한 X 좌표 목록에 `std::is_sorted`를 적용해 순서가 유지됐는지 확인하고, 순서가 바뀐 경우에만 `std::sort`를 실행하도록 바꿨습니다.
    verification: Windows Release에서 준비 120 Tick 뒤 30,000 Tick을 조건별 3회 실행했습니다. 다섯 배치·기체 수 조건에서 물리 단계 p95의 반복별 중앙값이 2.0~13.5% 감소했습니다.
    evidenceIds: [dronesim-sort-reuse]
    metricIds: [separated-128-physics-p95, separated-256-physics-p95, separated-512-physics-p95, compact-128-physics-p95, compact-256-physics-p95]
    comparison:
      caption: Windows Release, 준비 120 Tick 후 30,000 Tick씩 3회 실행한 반복별 p95 중앙값. 물리 단계에 좌표 갱신과 후보 쌍 검사를 포함합니다.
      columns: [물리 단계 p95 전, 물리 단계 p95 후, 감소율]
      rows:
      - label: 분리·128대
        values: [188.0µs, 184.2µs, 2.0%]
      - label: 분리·256대
        values: [370.1µs, 345.4µs, 6.7%]
      - label: 분리·512대
        values: [741.8µs, 669.9µs, 9.7%]
      - label: 밀집·128대
        values: [472.3µs, 408.6µs, 13.5%]
      - label: 밀집·256대
        values: [827.6µs, 791.6µs, 4.4%]
      evidenceIds: [dronesim-sort-reuse]
    code:
      path: modules/simulation_core/src/PhysicsWorld.cpp
      language: cpp
      title: X 좌표 순서가 바뀔 때만 후보 목록 정렬
      source: |-
        for (auto& [positionX, bodyIndex] : bodyPositionsByX)
            positionX = bodies[bodyIndex]->collisionState.positionMeters.x;

        if (!std::is_sorted(bodyPositionsByX.begin(), bodyPositionsByX.end()))
            std::sort(bodyPositionsByX.begin(), bodyPositionsByX.end());
      url: https://github.com/cgantro/DroneSim/blob/main/modules/simulation_core/src/PhysicsWorld.cpp
  - title: PX4 기록을 다시 재생할 때 바닥 접촉 판정이 달라짐
    symptom: 같은 비행 기록을 재생해도 바닥에 닿는 위치가 실행마다 달랐습니다.
    cause: 좌표가 반올림 경계에 걸려 접촉 여부가 바뀌었습니다.
    solution: 좌표 크기에 맞는 오차 범위를 적용해 경계 근처의 접촉 판정을 고쳤습니다.
    verification: 새 실행 환경에서 같은 기록을 12회 재생해 접촉 판정이 반복되는 것을 확인했습니다.
    evidenceIds: [dronesim-px4]
    metricIds: []
