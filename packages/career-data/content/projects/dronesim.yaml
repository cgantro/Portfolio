id: dronesim
title: DroneSim
subtitle: 다중 드론 M&S 임무 시나리오
category: 드론 시뮬레이션
summary:
- 여러 드론의 비행 상태와 지상통제 명령을 반복 시험하고, 통신 단절 뒤 임무 재할당을 확인합니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- 고정 주기로 기체·카메라 상태를 갱신하고, 네이티브 빌드에 AirSim 강체 물리를 연결했습니다.
- 게임패드·UDP 지상통제·JSON 시나리오 입력을 공통 시뮬레이션 명령으로 처리했습니다.
- 여러 대가 참여하는 임무 시나리오를 만들고, 충돌 계산을 개선한 뒤 성능을 측정했습니다.
stack:
- Flecs ECS
- AirSim 강체 물리
- UDP 지상통제
- JSON 시나리오
cover:
  src: /assets/DroneSim-preview.jpg
  alt: DroneSim 실행 화면. 창 제목에는 AeroSimLab이 표시됩니다.
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 게임패드, UDP 지상통제와 JSON 시나리오가 고정 Tick 중심부에 입력되고, 네이티브 AirSim 강체 모델 또는 WebAssembly 운동학 모델을 거쳐 장면과 EO 카메라로 이어지는 구조
  summary:
  - 화면 조작·게임패드·UDP·JSON 입력은 공통 비행 명령을 거쳐 SimulationCore의 고정 Tick에 들어갑니다.
  - Flecs가 상태를 갱신하고, 선택한 물리 모델의 결과를 화면·EO 카메라 또는 시나리오 판정에 전달합니다.
  - UDP 수신부가 패킷 형식과 명령 종류를 확인해 비행·카메라·상태 조회로 나눕니다. 변경 명령은 다음 Tick에 반영하고, 그 Tick에는 게임패드·기록 재생 입력을 함께 처리하지 않습니다.
links:
  github: https://github.com/cgantro/DroneSim
  demo: https://cgantro.github.io/DroneSim/
contributions:
- id: dronesim-contribution-1
  text: 화면 그리기와 분리된 고정 시간 간격의 시뮬레이션 중심부를 만들고, 네이티브 실행에서만 AirSim 강체 물리를 연결했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-2
  text: UDP 지상통제, 게임패드, JSON 시나리오 입력을 공통 드론 명령으로 처리하고 통신 지연·손실과 편대 통신 단절을 재현했습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-contribution-3
  text: 충돌 후보 목록의 X 좌표를 갱신한 뒤 순서가 바뀐 경우에만 다시 정렬하도록 바꾸고, 분리·밀집 배치에서 변경 전후 물리 단계 시간을 측정했습니다.
  evidenceIds:
  - dronesim-sort-reuse
  status: reported
- id: dronesim-contribution-4
  text: 헤드리스 JSON 시나리오에서 상태 보고 단절을 모의하고 미완료 과제를 재할당해, 4~256대 조건의 임무 완료와 실행 시간을 확인했습니다.
  evidenceIds:
  - dronesim-reallocation
  status: reported
outcomes:
- id: dronesim-outcome-1
  text: 화면 조작과 화면 없는 시나리오 시험이 같은 SimulationCore를 사용하므로, 입력 장치와 화면 없이도 비행 규칙과 최종 상태를 확인할 수 있습니다.
  evidenceIds:
  - dronesim-source
  status: reported
- id: dronesim-outcome-2
  text: 웹 빌드는 AirSim 물리 대신 운동학 기준 모델을 사용합니다. 네이티브 강체 동작이나 실기체의 비행 성능을 웹 데모가 검증한다고 해석하지 않습니다.
  evidenceIds:
  - dronesim-source
  status: reported
