id: dronesim
title: DroneSim
subtitle: 시설물 외벽 영상 수집 임무를 모의하는 드론 시뮬레이터
category: 드론 시뮬레이션
summary:
- 탄천교 주변 지형에서 드론 비행과 지상통제, 외벽 EO 영상 수집·저장을 시험합니다. 영상과 위치·시각·자세 기록을 함께 남깁니다.
period: 2026.08 – 진행 중
startDate: 2026-08
endDate: null
status: ongoing
team: 개인 프로젝트
role:
- Flecs ECS를 이용해 화면 갱신과 분리된 60Hz 고정 주기 시뮬레이션 코어를 구성하고, 네이티브 AirSim 강체 물리와 웹 운동학 모델을 구분했습니다.
- 게임패드·UDP 지상통제·JSON 시나리오 입력을 공통 비행 명령으로 연결하고, 헤드리스 임무·충돌 시험을 구성했습니다.
- EO 영상 촬영·기록과 네이티브 H.264/RTP 송수신, 녹화 파일 전달을 지상통제 프로그램에 연결했습니다.
stack:
- Flecs ECS
- AirSim 강체 물리
- UDP 지상통제
- GStreamer·H.264/RTP
cover:
  src: /assets/DroneSim-current-view.png
  alt: OSM 건물 외벽 시험 위치를 선택해 EO 영상 수집 임무를 진행하는 DroneSim 웹 지상통제 화면
architecture:
  src: /assets/dronesim-system-architecture.svg
  alt: 게임패드·UDP·JSON 입력이 공통 비행 명령과 고정 주기 시뮬레이션을 거쳐 외벽 EO 촬영 임무로 이어지고, 네이티브와 웹 모델이 나뉘는 구조
  summary:
  - 게임패드·UDP·JSON 입력은 공통 비행 명령을 거쳐 고정 주기 시뮬레이션에 들어갑니다.
  - 시뮬레이션은 네이티브의 AirSim 강체 물리 또는 웹의 운동학 모델로 드론 상태를 계산합니다.
  - EO 프레임은 실시간 H.264/RTP 영상 경로와 녹화 파일·촬영 기록 경로로 나뉘어 지상통제 프로그램에 전달됩니다. 웹 저장 자료는 별도로 내려받습니다.
detail:
  layout: dronesim
  overview: 탄천교 주변 지형을 배경으로 드론 비행, 지상통제, 시설물 외벽 EO 영상 수집을 시험하는 M&S 시뮬레이터입니다. 촬영 영상과 위치·시각·자세 기록을 함께 저장하고, 네이티브 실행과 웹 실행을 나눠 개발하고 있습니다.
  features:
  - title: 비행 시뮬레이션
    description: 게임패드·UDP 지상통제·JSON 시나리오로 드론을 조종하고 상태를 확인합니다. 네이티브는 AirSim 강체 물리, 웹은 운동학 모델을 사용합니다.
    evidenceIds: [dronesim-source]
  - title: 탄천교 주변 3D 환경
    description: SRTM 30m 격자 지형과 OSM 건물 정보를 사용합니다. 항공 정사영상 텍스처와 탄천교 정밀 3D 모델은 아직 적용하지 않았습니다.
    evidenceIds: [dronesim-source]
  - title: EO 영상 수집과 기록
    description: 지정 위치에서 촬영한 영상에 위치·시각·자세를 붙여 저장합니다. 네이티브는 MP4·JSONL, 웹은 WebM·PNG·JSON 기록을 만듭니다.
    evidenceIds: [dronesim-source]
  - title: 실시간 영상·녹화 자료 전달
    description: 네이티브 시뮬레이터와 지상통제 프로그램 사이에 H.264/RTP 영상을 보내고 녹화 영상과 촬영 기록 파일을 전달합니다.
    evidenceIds: [dronesim-source]
  - title: 여러 드론의 임무 시험
    description: 여러 드론에 임무를 나누고 임무를 시작·일시정지·재개·중단합니다. 상태 보고가 끊긴 기체의 미완료 임무는 시나리오에서 다시 배정합니다.
    evidenceIds: [dronesim-reallocation]
  roleAreas:
  - title: 시뮬레이션 중심부와 비행 제어
    items:
    - text: 화면 갱신과 분리된 Flecs ECS 기반 60Hz 고정 주기 코어를 구성하고 위치·속도·자세를 갱신해 비행 상태를 계산했습니다.
      evidenceIds: [dronesim-source]
    - text: 게임패드·UDP·JSON 입력을 공통 비행 명령으로 연결하고, 네이티브 AirSim 강체 물리와 웹 운동학 모델을 분리했습니다.
      evidenceIds: [dronesim-source]
  - title: 지상통제와 시나리오 시험
    items:
    - text: UDP 명령의 순서·중복을 확인하고 응답을 돌려주며 JSON 임무 입력과 헤드리스 비행·충돌·상태 보고 단절 시나리오를 처리했습니다.
      evidenceIds: [dronesim-source, dronesim-reallocation]
  - title: 충돌 처리
    items:
    - text: AABB로 충돌 후보를 추리고 회전 상자끼리는 SAT로 겹침을 판정했습니다. X 좌표순 후보 목록은 순서가 달라졌을 때만 다시 정렬합니다.
      evidenceIds: [dronesim-sort-reuse]
  - title: 카메라·영상·파일 처리
    items:
    - text: EO 프레임에 위치·시각·자세 기록을 연결하고 네이티브 H.264/RTP 송수신과 녹화 파일 전달을 지상통제 프로그램에 연결했습니다.
      evidenceIds: [dronesim-source]
    - text: 웹 실행에서는 WebM·PNG·JSON 기록을 저장하고 내려받도록 구현했습니다.
      evidenceIds: [dronesim-source]
  troubleshooting:
  - title: 충돌 후보를 찾기 전마다 전체 목록을 다시 정렬함
    symptom: 물리 단계마다 강체 목록을 X 좌표순으로 정렬했습니다.
    cause: 강체 위치는 매 Tick 달라져도 X 순서가 그대로인 경우가 있었습니다. 기존 처리는 이 경우에도 정렬을 반복했습니다.
    solution: 좌표만 갱신한 뒤 목록이 이미 정렬됐는지 확인하고, 순서가 바뀐 경우에만 `std::sort`를 호출하도록 바꿨습니다.
    verification: 비교한 5개 배치·기체 수 조건에서 물리 단계 p95가 2.0~13.5% 줄었습니다.
    evidenceIds: [dronesim-sort-reuse]
    metricIds: [separated-128-physics-p95, separated-256-physics-p95, separated-512-physics-p95, compact-128-physics-p95, compact-256-physics-p95]
    comparison:
      caption: Windows Release, 준비 120 Tick 후 30,000 Tick씩 3회 실행한 반복별 p95 중앙값. 물리 단계에 좌표 갱신과 후보 쌍 검사를 포함합니다.
      columns: [물리 단계 p95 전, 물리 단계 p95 후, 감소율]
      rows:
      - label: 분리·128대
        values: [188.0µs, 184.2µs, 2.0%]
      - label: 분리·256대
        values: [370.1µs, 345.4µs, 6.7%]
      - label: 분리·512대
        values: [741.8µs, 669.9µs, 9.7%]
      - label: 밀집·128대
        values: [472.3µs, 408.6µs, 13.5%]
      - label: 밀집·256대
        values: [827.6µs, 791.6µs, 4.4%]
      evidenceIds: [dronesim-sort-reuse]
    code:
      path: modules/simulation_core/src/PhysicsWorld.cpp
      language: cpp
      title: X 좌표 순서가 바뀔 때만 후보 목록 정렬
      source: |-
        for (auto& [positionX, bodyIndex] : bodyPositionsByX)
            positionX = bodies[bodyIndex]->collisionState.positionMeters.x;

        if (!std::is_sorted(bodyPositionsByX.begin(), bodyPositionsByX.end()))
            std::sort(bodyPositionsByX.begin(), bodyPositionsByX.end());
      url: https://github.com/cgantro/DroneSim/blob/main/modules/simulation_core/src/PhysicsWorld.cpp
  - title: PX4 기록 재생에서 접촉 판정이 반복마다 달라짐
    symptom: PX4 비행 기록을 재생할 때 바닥 접촉 위치가 실행마다 달라졌습니다.
    cause: 좌표가 `float` 반올림 경계에 걸리면서 접촉 여부가 흔들렸습니다.
    solution: 좌표 크기에 맞춰 달라지는 허용 오차를 접촉 위치 비교에 적용해 경계값을 처리했습니다.
    verification: 새 프로세스에서 12회 재생해 상태 항목을 비교했으며 각 항목의 원래 단위 기준 차이는 2.6×10⁻⁶ 이내였습니다. 접촉 처리의 반복 안정성을 확인한 값이며 비행 모델 정확도를 검증한 결과는 아닙니다.
    evidenceIds: [dronesim-px4]
    metricIds: []
