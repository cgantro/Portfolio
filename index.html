<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>홍윤표 | C++ 응용 소프트웨어 개발자</title>
    <meta name="description" content="로봇 시뮬레이터와 실시간 C++ 시스템을 구현하고, 측정 결과로 병목을 개선해 온 홍윤표의 포트폴리오입니다." />
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration("/Portfolio/").then((registration) => {
          const worker = navigator.serviceWorker.controller || registration?.active;
          const migrationKey = "portfolio-coi-worker-removed";
          if (
            worker &&
            new URL(worker.scriptURL).pathname === "/Portfolio/coi-serviceworker.min.js" &&
            sessionStorage.getItem(migrationKey) !== "done"
          ) {
            sessionStorage.setItem(migrationKey, "done");
            worker.postMessage({ type: "deregister" });
          }
        }).catch(() => {});
      }
    </script>
    <!-- Pretendard (Korean-friendly sans-serif) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <!-- Devicon -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
