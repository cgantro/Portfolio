name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify DroneSim portfolio preview
        run: test -s asset/DroneSim-preview.jpg

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content and build website
        run: |
          pnpm run validate:content
          pnpm run audit:content
          pnpm run validate:resume
          pnpm run build:web

      - name: Prepare GitHub Pages files
        run: |
          grep -q '페이지 없음' apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/web/dist

  pages-bootstrap:
    runs-on: ubuntu-latest
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    steps:
      - name: Enable GitHub Pages when an admin token is configured
        if: ${{ env.PAGES_ADMIN_TOKEN != '' }}
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

  deploy:
    needs: [build, pages-bootstrap]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
