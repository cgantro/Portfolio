<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">커밋 이후 MQTT 명령 발행</title>
  <desc id="desc">데이터베이스 트랜잭션에서 저장을 완료하고 커밋한 뒤, 등록한 후속 작업에서 MQTT 차량 명령을 발행합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><style>
    .bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.focus{fill:#EFF6FF;stroke:#2563EB;stroke-width:2}.line{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.t{font:600 17px Pretendard,'Noto Sans KR',sans-serif;fill:#111827}.s{font:14px Pretendard,'Noto Sans KR',sans-serif;fill:#64748B}
  </style></defs>
  <rect class="bg" width="1120" height="240" rx="12"/>
  <rect class="box" x="70" y="78" width="250" height="84" rx="8"/><text class="t" x="195" y="114" text-anchor="middle">상태·명령 저장</text><text class="s" x="195" y="139" text-anchor="middle">데이터베이스 트랜잭션</text>
  <rect class="focus" x="435" y="78" width="250" height="84" rx="8"/><text class="t" x="560" y="114" text-anchor="middle">커밋 완료</text><text class="s" x="560" y="139" text-anchor="middle">후속 작업 실행</text>
  <rect class="box" x="800" y="78" width="250" height="84" rx="8"/><text class="t" x="925" y="114" text-anchor="middle">MQTT 명령 발행</text><text class="s" x="925" y="139" text-anchor="middle">견인차에 전달</text>
  <path class="line" d="M320 120H435M685 120H800"/>
</svg>
