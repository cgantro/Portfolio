<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">차량 명령을 데이터베이스 저장 뒤 발행하는 이유</title>
  <desc id="desc">잘못된 순서에서는 데이터베이스 커밋 전에 차량에 명령이 도착해, 저장 실패 뒤에도 서버 기록 없이 차량만 명령을 받습니다. 수정한 순서에서는 커밋이 성공한 뒤 명령을 발행하며, 커밋에 실패하면 발행하지 않습니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <style>
      .bg{fill:#F8FAFC}
      .box{fill:#fff;stroke:#CBD5E1;stroke-width:2}
      .bad{fill:#FEF2F2;stroke:#FCA5A5;stroke-width:2}
      .good{fill:#EFF6FF;stroke:#60A5FA;stroke-width:2}
      .title{font:700 18px Pretendard,'Noto Sans KR',sans-serif;fill:#111827}
      .sectionBad{font:700 19px Pretendard,'Noto Sans KR',sans-serif;fill:#B91C1C}
      .sectionGood{font:700 19px Pretendard,'Noto Sans KR',sans-serif;fill:#1D4ED8}
      .noteBad{font:600 15px Pretendard,'Noto Sans KR',sans-serif;fill:#991B1B}
      .noteGood{font:600 15px Pretendard,'Noto Sans KR',sans-serif;fill:#1E40AF}
      .arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="470" rx="14"/>

  <text class="sectionBad" x="32" y="40">잘못된 순서</text>
  <rect class="box" x="25" y="60" width="190" height="72" rx="10"/>
  <text class="title" x="120" y="103" text-anchor="middle">관제 요청</text>
  <path class="arrow" d="M218 96H245"/>
  <rect class="bad" x="255" y="60" width="190" height="72" rx="10"/>
  <text class="title" x="350" y="103" text-anchor="middle">DB 저장 중</text>
  <path class="arrow" d="M448 96H475"/>
  <rect class="bad" x="485" y="60" width="190" height="72" rx="10"/>
  <text class="title" x="580" y="103" text-anchor="middle">MQTT 먼저 발행</text>
  <path class="arrow" d="M678 96H705"/>
  <rect class="bad" x="715" y="60" width="190" height="72" rx="10"/>
  <text class="title" x="810" y="103" text-anchor="middle">차량 명령 수신</text>
  <path d="M350 137V166" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5"/>
  <rect class="bad" x="255" y="171" width="650" height="54" rx="10"/>
  <text class="noteBad" x="580" y="205" text-anchor="middle">DB 저장 실패 → 서버 기록은 없지만 차량에는 명령 도착</text>

  <text class="sectionGood" x="32" y="273">수정한 순서</text>
  <rect class="box" x="25" y="291" width="190" height="72" rx="10"/>
  <text class="title" x="120" y="334" text-anchor="middle">관제 요청</text>
  <path class="arrow" d="M218 327H245"/>
  <rect class="box" x="255" y="291" width="190" height="72" rx="10"/>
  <text class="title" x="350" y="334" text-anchor="middle">DB 저장</text>
  <path class="arrow" d="M448 327H475"/>
  <rect class="good" x="485" y="291" width="190" height="72" rx="10"/>
  <text class="title" x="580" y="334" text-anchor="middle">커밋 성공</text>
  <path class="arrow" d="M678 327H705"/>
  <rect class="box" x="715" y="291" width="190" height="72" rx="10"/>
  <text class="title" x="810" y="334" text-anchor="middle">MQTT 발행</text>
  <path class="arrow" d="M908 327H935"/>
  <rect class="box" x="945" y="291" width="150" height="72" rx="10"/>
  <text class="title" x="1020" y="334" text-anchor="middle">차량 수신</text>
  <text class="noteGood" x="350" y="411" text-anchor="middle">커밋 실패 시 명령을 발행하지 않음</text>
  <path d="M350 366V390" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6 5"/>
</svg>
