<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GraspLink Simulator</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
      canvas { display: block; width: 100%; height: 100%; min-height: 320px; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; border-top: 1px solid #374151; font-size: 13px; }
      #status { margin: 0; }
      a { color: #67e8f9; }
      @media (max-width: 560px) { footer { align-items: flex-start; flex-direction: column; gap: 6px; } }
    </style>
  </head>
  <body>
    <canvas id="grasplink-canvas" aria-label="GraspLink robot simulator"></canvas>
    <footer>
      <p id="status" role="status">시뮬레이터를 불러오는 중입니다.</p>
      <a href="https://cgantro.github.io/GraspLink/" target="_blank" rel="noreferrer">독립 실행 페이지 열기 ↗</a>
    </footer>
    <script>
      const status = document.getElementById("status");
      const canvas = document.getElementById("grasplink-canvas");

      async function startGraspLink() {
        if (!window.crossOriginIsolated || typeof SharedArrayBuffer !== "function") {
          throw new Error("이 페이지가 스레드 실행을 위한 브라우저 격리 상태가 아닙니다. 페이지를 새로고침하거나 독립 실행 페이지를 이용해 주세요.");
        }

        const response = await fetch("/GraspLink/embed/manifest.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`시뮬레이터 manifest 요청 실패 (${response.status})`);

        const manifest = await response.json();
        if (typeof manifest.revision !== "string" || typeof manifest.bundle !== "string") {
          throw new Error("시뮬레이터 manifest 형식이 올바르지 않습니다.");
        }

        const bundleUrl = new URL(manifest.bundle, window.location.origin);
        bundleUrl.searchParams.set("rev", manifest.revision);

        const bundleResponse = await fetch(bundleUrl.href);
        if (!bundleResponse.ok) throw new Error(`시뮬레이터 bundle 요청 실패 (${bundleResponse.status})`);
        const bundleBlobUrl = URL.createObjectURL(await bundleResponse.blob());
        await new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = bundleBlobUrl;
          script.onload = resolve;
          script.onerror = () => {
            URL.revokeObjectURL(bundleBlobUrl);
            reject(new Error("시뮬레이터 JavaScript bundle을 불러오지 못했습니다."));
          };
          document.head.append(script);
        });

        if (typeof window.createGraspLink !== "function") {
          throw new Error("시뮬레이터 시작 함수를 찾을 수 없습니다.");
        }

        await window.createGraspLink({ canvas });
      }

      startGraspLink().catch((error) => {
        status.textContent = `시뮬레이터를 시작하지 못했습니다: ${error.message}`;
        console.error(error);
      });
    </script>
  </body>
</html>
