<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-labelledby="title desc">
  <title id="title">RobotPal 제어 명령과 영상의 송수신 흐름</title>
  <desc id="desc">외부 제어 프로그램의 패킷은 데스크톱 TCP 또는 웹 WebSocket 구현을 거쳐 공통 수신 큐와 네트워크 엔진으로 전달됩니다. JSON 명령은 가상 이동체와 로봇팔 상태를 갱신합니다. 카메라 영상은 JPEG 작업자와 공통 전송 인터페이스를 거쳐 외부 영상 프로그램으로 전달됩니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#15803d"/></marker>
    <style>
      .bg{fill:#f8fafc}.zone{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.amber{fill:#fffbeb;stroke:#fbbf24;stroke-width:2}.neutral{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}
      .title{font:700 30px Pretendard,Arial,sans-serif;fill:#111827}.zoneTitle{font:700 20px Pretendard,Arial,sans-serif;fill:#334155}.label{font:700 18px Pretendard,Arial,sans-serif;fill:#111827;text-anchor:middle}.small{font:500 15px Pretendard,Arial,sans-serif;fill:#475569;text-anchor:middle}.note{font:500 14px Pretendard,Arial,sans-serif;fill:#64748b;text-anchor:middle}
      .arrow{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}.arrowBlue{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.arrowGreen{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect class="bg" width="1480" height="760"/>
  <text class="title" x="44" y="52">제어 명령 수신과 카메라 영상 송신</text>

  <rect class="zone" x="36" y="100" width="270" height="570" rx="18"/>
  <text class="zoneTitle" x="62" y="138">외부 프로그램</text>
  <rect class="amber" x="66" y="180" width="210" height="104" rx="14"/>
  <text class="label" x="171" y="222">제어 명령</text>
  <text class="small" x="171" y="251">주행·서보 JSON</text>
  <rect class="green" x="66" y="494" width="210" height="104" rx="14"/>
  <text class="label" x="171" y="536">영상 처리 프로그램</text>
  <text class="small" x="171" y="565">JPEG 프레임 수신</text>

  <rect class="zone" x="336" y="100" width="774" height="570" rx="18"/>
  <text class="zoneTitle" x="364" y="138">공통 전송 인터페이스</text>
  <text class="small" x="723" y="168">같은 송수신 인터페이스에 환경별 전송 구현 연결</text>
  <rect class="blue" x="378" y="193" width="300" height="82" rx="12"/>
  <text class="label" x="528" y="226">TCP 전송 구현</text>
  <text class="small" x="528" y="251">데스크톱 빌드</text>
  <rect class="blue" x="768" y="193" width="300" height="82" rx="12"/>
  <text class="label" x="918" y="226">WebSocket 전송 구현</text>
  <text class="small" x="918" y="251">웹 빌드</text>

  <rect class="neutral" x="378" y="326" width="205" height="88" rx="12"/>
  <text class="label" x="480" y="361">수신 콜백</text>
  <text class="small" x="480" y="388">받은 패킷 전달</text>
  <rect class="neutral" x="620" y="326" width="205" height="88" rx="12"/>
  <text class="label" x="722" y="361">수신 큐</text>
  <text class="small" x="722" y="388">갱신 단계에서 꺼냄</text>
  <rect class="amber" x="862" y="326" width="205" height="88" rx="12"/>
  <text class="label" x="964" y="361">JSON 명령 구분</text>
  <text class="small" x="964" y="388">drive · servo</text>

  <rect class="green" x="378" y="503" width="205" height="88" rx="12"/>
  <text class="label" x="480" y="538">공통 송신 경로</text>
  <text class="small" x="480" y="565">TCP 또는 WebSocket</text>
  <rect class="green" x="620" y="503" width="205" height="88" rx="12"/>
  <text class="label" x="722" y="538">JPEG 작업자 4개</text>
  <text class="small" x="722" y="565">프레임별 압축</text>
  <rect class="green" x="862" y="503" width="205" height="88" rx="12"/>
  <text class="label" x="964" y="538">JPEG 작업 큐</text>
  <text class="small" x="964" y="565">최대 6프레임 · 뮤텍스·조건변수</text>
  <text class="note" x="722" y="632">가득 차면 오래된 프레임 폐기 · 송신 큐 최대 2프레임</text>

  <rect class="zone" x="1140" y="100" width="304" height="570" rx="18"/>
  <text class="zoneTitle" x="1168" y="138">가상 시뮬레이터</text>
  <rect class="blue" x="1182" y="326" width="220" height="105" rx="14"/>
  <text class="label" x="1292" y="366">가상 로봇</text>
  <text class="small" x="1292" y="396">주행·관절 상태 갱신</text>
  <rect class="green" x="1182" y="503" width="220" height="88" rx="14"/>
  <text class="label" x="1292" y="538">가상 카메라</text>
  <text class="small" x="1292" y="565">화면 프레임 생성</text>

  <path class="arrowBlue" d="M276 232H378"/>
  <path class="arrow" d="M528 275V305H480V326"/>
  <path class="arrow" d="M918 275V305H480V326"/>
  <path class="arrow" d="M583 370H620"/>
  <path class="arrow" d="M825 370H862"/>
  <path class="arrowBlue" d="M1067 370H1182"/>
  <path class="arrowGreen" d="M1182 547H1067"/>
  <path class="arrowGreen" d="M862 547H825"/>
  <path class="arrowGreen" d="M620 547H583"/>
  <path class="arrowGreen" d="M378 547H276"/>
</svg>
