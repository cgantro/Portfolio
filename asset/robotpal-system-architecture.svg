<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="RobotPal Architecture">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <style>
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.amber{fill:#fffbeb;stroke:#fbbf24;stroke-width:2}.purple{fill:#faf5ff;stroke:#c084fc;stroke-width:2}
      .title{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.zoneTitle{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.label{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:600 14px Arial,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.note{font:600 13px Arial,'Noto Sans KR',sans-serif;fill:#64748b;text-anchor:middle}
      .flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.flowBlue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}.flowGreen{fill:none;stroke:#16a34a;stroke-width:2.5;marker-end:url(#arrowGreen)}.flowOrange{fill:none;stroke:#ea580c;stroke-width:2.7;marker-end:url(#arrowOrange)}
      .dash{fill:none;stroke:#94a3b8;stroke-width:1.8;stroke-dasharray:7 6}.flowLabel{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#334155;text-anchor:middle}.flowLabelBlue{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#1d4ed8;text-anchor:middle}.flowLabelGreen{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#15803d;text-anchor:middle}.flowLabelOrange{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#c2410c;text-anchor:middle}
    </style>
  </defs><rect width="1400" height="760" fill="#fff"/><text class="title" x="55" y="52">RobotPal Architecture</text>
  <rect class="zone" x="45" y="90" width="500" height="590" rx="22"/>
  <text class="zoneTitle" x="75" y="128">JETANK Python Module</text>
  <text class="note" x="295" y="156">Same Python-facing API, different runtime implementation</text>

  <rect class="green" x="85" y="205" width="190" height="105" rx="16"/>
  <text class="label" x="180" y="247">Real Module</text><text class="small" x="180" y="272">Motor · Servo · Camera</text>
  <rect class="node" x="330" y="205" width="170" height="105" rx="16"/>
  <text class="label" x="415" y="247">JETANK</text><text class="small" x="415" y="272">Real Hardware</text>
  <path class="flowGreen" d="M275 240H330"/><text class="flowLabelGreen" x="302" y="228">Control</text>
  <path class="flowGreen" d="M330 280H275"/><text class="flowLabelGreen" x="302" y="300">Sensor</text>

  <rect class="green" x="85" y="430" width="190" height="115" rx="16"/>
  <text class="label" x="180" y="472">Simulator Module</text><text class="small" x="180" y="497">Robot · Motor · Camera API</text><text class="small" x="180" y="520">Implemented in project</text>

  <rect class="zone" x="640" y="90" width="715" height="590" rx="22"/>
  <text class="zoneTitle" x="670" y="128">C++ Simulator</text>

  <rect class="blue" x="690" y="190" width="185" height="100" rx="15"/>
  <text class="label" x="782" y="232">Controller</text><text class="small" x="782" y="257">Drive · Servo · Grip</text>
  <rect class="blue" x="945" y="190" width="185" height="100" rx="15"/>
  <text class="label" x="1037" y="232">Renderer</text><text class="small" x="1037" y="257">OpenGL</text>
  <rect class="node" x="945" y="350" width="185" height="100" rx="15"/>
  <text class="label" x="1037" y="392">PBO Readback</text><text class="small" x="1037" y="417">Double Buffer</text>
  <rect class="node" x="945" y="510" width="185" height="100" rx="15"/>
  <text class="label" x="1037" y="552">JPEG Workers</text><text class="small" x="1037" y="577">Bounded Queue</text>
  <rect class="blue" x="690" y="510" width="185" height="100" rx="15"/>
  <text class="label" x="782" y="552">Transport</text><text class="small" x="782" y="577">TCP · WebSocket</text>

  <path class="flow" d="M1037 290V350"/><text class="flowLabel" x="1095" y="324">Render Frame</text>
  <path class="flow" d="M1037 450V510"/><text class="flowLabel" x="1102" y="484">RGBA Frame</text>
  <path class="flow" d="M945 560H875"/><text class="flowLabel" x="910" y="548">JPEG</text>
  <path class="flowBlue" d="M782 510V290"/><text class="flowLabelBlue" x="720" y="405">Command</text>

  <path class="flowBlue" d="M275 463H690"/><text class="flowLabelBlue" x="485" y="448">Drive / Servo Command</text>
  <path class="flowGreen" d="M690 515H275"/><text class="flowLabelGreen" x="485" y="538">JPEG Frame / State</text>
</svg>