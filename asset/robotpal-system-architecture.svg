<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">RobotPal 가상 제어와 주변 장치 연결</title>
  <desc id="desc">외부 JSON 명령의 모터와 서보 값을 가상 로봇에 반영하고, 가상 카메라 영상을 인식 모듈로 전달합니다. 실물 JETANK은 별도 제어 화면에서 상태 조회와 조작 입력을 연결합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker>
    <style>
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.node{fill:#fff;stroke:#94a3b8;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.amber{fill:#fffbeb;stroke:#fbbf24;stroke-width:2}
      .title{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.zoneTitle{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.label{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:600 14px Arial,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.note{font:600 13px Arial,'Noto Sans KR',sans-serif;fill:#64748b;text-anchor:middle}
      .flow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.flowBlue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#arrowBlue)}.flowGreen{fill:none;stroke:#16a34a;stroke-width:2.5;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect width="1400" height="780" fill="#fff"/>
  <text class="title" x="55" y="52">RobotPal 가상 제어와 주변 장치 연결</text>

  <rect class="zone" x="45" y="90" width="340" height="600" rx="22"/>
  <text class="zoneTitle" x="75" y="128">외부 프로그램</text>
  <rect class="amber" x="85" y="165" width="260" height="100" rx="15"/>
  <text class="label" x="215" y="207">JSON 제어 명령</text>
  <text class="small" x="215" y="235">이동체 모터·로봇팔 서보 값</text>
  <rect class="green" x="85" y="430" width="260" height="100" rx="15"/>
  <text class="label" x="215" y="472">영상 인식 모듈</text>
  <text class="small" x="215" y="500">전달받은 카메라 영상 처리</text>

  <rect class="zone" x="430" y="90" width="600" height="600" rx="22"/>
  <text class="zoneTitle" x="460" y="128">RobotPal 가상 시뮬레이터</text>
  <rect class="blue" x="500" y="170" width="460" height="115" rx="15"/>
  <text class="label" x="730" y="214">가상 이동체·로봇팔 제어</text>
  <text class="small" x="730" y="246">JSON 명령의 모터·서보 값을 가상 상태에 반영</text>
  <rect class="node" x="500" y="360" width="210" height="100" rx="15"/>
  <text class="label" x="605" y="402">가상 카메라</text>
  <text class="small" x="605" y="430">시뮬레이터 화면 촬영</text>
  <rect class="node" x="750" y="360" width="210" height="100" rx="15"/>
  <text class="label" x="855" y="402">JPEG 압축</text>
  <text class="small" x="855" y="430">워커 대기열로 분리 처리</text>
  <rect class="blue" x="625" y="535" width="210" height="90" rx="15"/>
  <text class="label" x="730" y="573">영상 전송</text>
  <text class="small" x="730" y="600">TCP 또는 WebSocket</text>

  <rect class="zone" x="1075" y="90" width="280" height="600" rx="22"/>
  <text class="zoneTitle" x="1105" y="128">실물 장비 연동</text>
  <rect class="green" x="1110" y="220" width="210" height="105" rx="15"/>
  <text class="label" x="1215" y="263">제어 화면</text>
  <text class="small" x="1215" y="292">상태 조회·조작 입력</text>
  <rect class="node" x="1110" y="405" width="210" height="105" rx="15"/>
  <text class="label" x="1215" y="448">실물 JETANK</text>
  <text class="small" x="1215" y="477">연결된 장비</text>

  <path class="flowBlue" d="M345 215H500"/>
  <text class="small" x="422" y="199">명령 전달</text>
  <path class="flow" d="M710 410H750"/>
  <path class="flow" d="M855 460V535"/>
  <path class="flowGreen" d="M625 580H520V480H345"/>
  <text class="small" x="458" y="565">카메라 영상</text>
  <path class="flowGreen" d="M1215 325V405"/>
  <text class="note" x="1290" y="370">상태·입력 연결</text>
</svg>
