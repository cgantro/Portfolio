<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">RobotPal 제어 패킷 형식과 값 해석 예시</title>
  <desc id="desc">패킷은 4바이트 길이값 뒤에 JSON 데이터가 옵니다. 주행 JSON의 좌우 모터 입력으로 직진과 회전 목표 속도를 계산하고, 서보 JSON의 ID·각도·속도로 지정 관절을 움직입니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.green{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.amber{fill:#fffbeb;stroke:#fbbf24;stroke-width:2}.neutral{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}
      .title{font:700 26px Pretendard,Arial,sans-serif;fill:#111827}.heading{font:700 20px Pretendard,Arial,sans-serif;fill:#111827}.label{font:600 17px Pretendard,Arial,sans-serif;fill:#111827;text-anchor:middle}.small{font:500 15px Pretendard,Arial,sans-serif;fill:#475569;text-anchor:middle}.code{font:600 16px Consolas,monospace;fill:#0f172a}.note{font:500 14px Pretendard,Arial,sans-serif;fill:#64748b}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="690" rx="16"/>
  <text class="title" x="32" y="44">패킷은 길이값과 JSON 명령으로 구성</text>
  <rect class="panel" x="28" y="64" width="1144" height="118" rx="12"/>
  <text class="small" x="58" y="97" text-anchor="start">수신 바이트 배열</text>
  <rect class="blue" x="58" y="111" width="230" height="48" rx="8"/>
  <text class="label" x="173" y="141">4바이트 길이값 N</text>
  <rect class="amber" x="304" y="111" width="838" height="48" rx="8"/>
  <text class="label" x="723" y="141">N바이트 JSON 데이터</text>
  <text class="note" x="58" y="174">수신 코드는 첫 4바이트를 uint32 길이로 읽고, 뒤의 JSON 문자열을 파싱</text>

  <rect class="panel" x="28" y="204" width="556" height="418" rx="12"/>
  <text class="heading" x="54" y="242">주행 명령</text>
  <rect class="neutral" x="54" y="260" width="504" height="105" rx="8"/>
  <text class="code" x="74" y="292">{"type":"drive",</text>
  <text class="code" x="74" y="320"> "left":0.3, "right":0.3}</text>
  <text class="small" x="306" y="395">좌우 입력의 평균 → 직진 목표 속도</text>
  <rect class="blue" x="54" y="420" width="504" height="72" rx="8"/>
  <text class="label" x="306" y="451">0.3 입력 → 0.024m/s</text>
  <text class="label" x="306" y="477">= 2.4cm/s 목표 속도</text>
  <rect class="green" x="54" y="516" width="504" height="72" rx="8"/>
  <text class="small" x="306" y="546">예: left=-0.3, right=0.3</text>
  <text class="label" x="306" y="572">회전 목표 속도 24°/s</text>

  <rect class="panel" x="616" y="204" width="556" height="418" rx="12"/>
  <text class="heading" x="642" y="242">서보 명령</text>
  <rect class="neutral" x="642" y="260" width="504" height="105" rx="8"/>
  <text class="code" x="662" y="292">{"type":"servo",</text>
  <text class="code" x="662" y="320"> "id":2, "angle":45, "speed":30}</text>
  <text class="small" x="894" y="395">ID로 관절을 찾고 목표값을 갱신</text>
  <rect class="blue" x="642" y="420" width="504" height="72" rx="8"/>
  <text class="label" x="894" y="451">ID 2 → 어깨 관절</text>
  <text class="label" x="894" y="477">angle 45° → 목표 각도</text>
  <rect class="green" x="642" y="516" width="504" height="72" rx="8"/>
  <text class="small" x="894" y="546">speed 30°/s · 프레임 시간에 곱해 각도 변화량 제한</text>
  <text class="label" x="894" y="572">목표 각도까지 부드럽게 회전</text>
  <text class="note" x="32" y="660">예시 패킷의 수치와 이동 환산은 코드 동작을 설명하기 위한 값입니다. 실제 수신 패킷 로그는 아닙니다.</text>
</svg>
