<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">오토잉카 아키텍처</title>
  <desc id="desc">사용자, AWS 클라우드 인프라와 로봇 엣지 영역 사이의 관제, 텔레메트리, 명령과 영상 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <marker id="videoArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker>
    <style>
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.cloud{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.docker{fill:#fff;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.node{fill:#fff;stroke:#94a3b8;stroke-width:1.7}.robotNode{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.title{font:700 29px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.zoneTitle{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.label{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:600 13px Arial,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.flow{fill:none;stroke:#475569;stroke-width:2.4;marker-end:url(#arrow)}.video{fill:none;stroke:#c2410c;stroke-width:2.8;marker-end:url(#videoArrow)}.flowLabel{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#334155;text-anchor:middle}.videoLabel{font:700 14px Arial,'Noto Sans KR',sans-serif;fill:#9a3412;text-anchor:middle}
    </style>
  </defs>
