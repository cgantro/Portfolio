<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">오토윙카 기술 구성</title>
  <desc id="desc">React, Nginx, Spring Boot, PostgreSQL, Redis, MQTT, WebSocket과 STOMP가 연결된 기술 구성</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <style>
      .background{fill:#fff}
      .cloud{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2}
      .node{fill:#fff;stroke:#CBD5E1;stroke-width:2}
      .main{fill:#EFF6FF;stroke:#60A5FA;stroke-width:2}
      .name{font:600 25px Arial,'Noto Sans KR',sans-serif;fill:#111827;text-anchor:middle}
      .arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="background" width="1400" height="650"/>

  <rect class="cloud" x="350" y="80" width="1000" height="500" rx="24"/>
  <text class="name" x="420" y="125">AWS</text>

  <rect class="node" x="70" y="275" width="190" height="100" rx="16"/>
  <text class="name" x="165" y="336">React</text>

  <rect class="node" x="420" y="275" width="190" height="100" rx="16"/>
  <text class="name" x="515" y="336">Nginx</text>

  <rect class="main" x="740" y="275" width="240" height="100" rx="16"/>
  <text class="name" x="860" y="336">Spring Boot</text>

  <rect class="node" x="1100" y="155" width="210" height="86" rx="14"/>
  <text class="name" x="1205" y="208">PostgreSQL</text>

  <rect class="node" x="1100" y="282" width="210" height="86" rx="14"/>
  <text class="name" x="1205" y="335">Redis</text>

  <rect class="node" x="1100" y="409" width="210" height="86" rx="14"/>
  <text class="name" x="1205" y="462">MQTT</text>

  <rect class="node" x="420" y="465" width="300" height="86" rx="14"/>
  <text class="name" x="570" y="518">WebSocket · STOMP</text>

  <path class="arrow" d="M260 325H410"/>
  <path class="arrow" d="M610 325H730"/>
  <path class="arrow" d="M980 295H1065V198H1090"/>
  <path class="arrow" d="M980 325H1090"/>
  <path class="arrow" d="M980 355H1065V452H1090"/>
  <path class="arrow" d="M860 385V420H720V508H730"/>
  <path class="arrow" d="M420 508H300V375"/>
</svg>
