<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1010" viewBox="0 0 760 1010" role="img" aria-labelledby="title desc">
  <title id="title">운행 명령과 차량 응답 흐름</title>
  <desc id="desc">관제 요청을 데이터베이스에 저장하고 커밋한 뒤 MQTT 운행 명령을 보냅니다. 차량 ACK는 명령 수신을 알리고, 별도의 상태 보고가 실제 운행 상태를 갱신합니다.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
    <style>.bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.focus{fill:#EFF6FF;stroke:#60A5FA;stroke-width:2}.head{font:700 20px Pretendard,'Noto Sans KR',sans-serif;fill:#111827;text-anchor:middle}.sub{font:16px Pretendard,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs><rect class="bg" width="760" height="1010" rx="16"/>
  <rect class="box" x="180" y="25" width="400" height="82" rx="14"/><text class="head" x="380" y="75">관제 요청</text>
  <path class="arrow" d="M380 109V140"/>
  <rect class="box" x="180" y="150" width="400" height="82" rx="14"/><text class="head" x="380" y="188">데이터베이스에 명령 저장</text><text class="sub" x="380" y="216">트랜잭션 커밋</text>
  <path class="arrow" d="M380 234V265"/>
  <rect class="focus" x="180" y="275" width="400" height="82" rx="14"/><text class="head" x="380" y="325">MQTT 운행 명령</text>
  <path class="arrow" d="M380 359V390"/>
  <rect class="box" x="180" y="400" width="400" height="82" rx="14"/><text class="head" x="380" y="450">차량 장치</text>
  <path class="arrow" d="M380 484V515H195V545"/><path class="arrow" d="M380 515H565V545"/>
  <rect class="box" x="55" y="555" width="280" height="88" rx="14"/><text class="head" x="195" y="592">MQTT ACK</text><text class="sub" x="195" y="620">명령 수신 확인</text>
  <rect class="focus" x="425" y="555" width="280" height="88" rx="14"/><text class="head" x="565" y="592">차량 상태 보고</text><text class="sub" x="565" y="620">실제 운행 상태</text>
  <path class="arrow" d="M565 645V680"/>
  <rect class="box" x="425" y="690" width="280" height="82" rx="14"/><text class="head" x="565" y="740">서버 상태 갱신</text>
  <path class="arrow" d="M565 774V809"/>
  <rect class="box" x="425" y="819" width="280" height="82" rx="14"/><text class="head" x="565" y="869">WebSocket · STOMP</text>
  <path class="arrow" d="M565 903V938"/>
  <rect class="box" x="425" y="948" width="280" height="45" rx="14"/><text class="head" x="565" y="978">관제 화면</text>
</svg>