<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">견인차 명령과 응답 처리</title>
  <desc id="desc">관제 명령은 서버 상태 변경을 커밋한 뒤 MQTT로 차량에 전달합니다. 차량의 ACK는 명령 수신 확인에 쓰고, 이후 MQTT 상태 보고로 실제 운행 상태를 갱신합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><style>
    .bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.focus{fill:#EFF6FF;stroke:#2563EB;stroke-width:2}.line{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.back{fill:none;stroke:#2563EB;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrowBlue)}.t{font:600 16px Pretendard,'Noto Sans KR',sans-serif;fill:#111827}.s{font:13px Pretendard,'Noto Sans KR',sans-serif;fill:#64748B}
  </style><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
  <rect class="bg" width="1120" height="340" rx="12"/>
  <rect class="box" x="30" y="120" width="200" height="90" rx="8"/><text class="t" x="130" y="158" text-anchor="middle">관제 명령</text><text class="s" x="130" y="183" text-anchor="middle">운행 요청</text>
  <rect class="focus" x="300" y="120" width="200" height="90" rx="8"/><text class="t" x="400" y="158" text-anchor="middle">서버·DB 반영</text><text class="s" x="400" y="183" text-anchor="middle">커밋 뒤 발행</text>
  <rect class="box" x="570" y="120" width="200" height="90" rx="8"/><text class="t" x="670" y="158" text-anchor="middle">MQTT 차량 명령</text><text class="s" x="670" y="183" text-anchor="middle">커밋 후 전달</text>
  <rect class="box" x="840" y="66" width="240" height="78" rx="8"/><text class="t" x="960" y="99" text-anchor="middle">ACK</text><text class="s" x="960" y="122" text-anchor="middle">명령 수신 응답</text>
  <rect class="box" x="840" y="200" width="240" height="78" rx="8"/><text class="t" x="960" y="233" text-anchor="middle">차량 상태 보고</text><text class="s" x="960" y="256" text-anchor="middle">실제 운행 상태 갱신</text>
  <path class="line" d="M230 165H300M500 165H570M770 165H805V105H840M805 165V239H840"/>
  <path class="back" d="M840 105H808V165H770M840 239H808V165H770"/>
</svg>
