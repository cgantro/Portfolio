<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="500" viewBox="0 0 1380 500" role="img" aria-labelledby="title desc">
<title id="title">운행 명령과 차량 응답 흐름</title><desc id="desc">관제 화면의 명령을 데이터베이스에 저장해 커밋한 뒤 MQTT로 토잉카에 보냅니다. 차량은 ACK로 명령 수신을 알리고, 별도 상태 보고로 실제 운행 상태를 전달합니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker><style>
.bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.focus{fill:#EFF6FF;stroke:#60A5FA;stroke-width:2}.ok{fill:#F0FDF4;stroke:#22C55E;stroke-width:2}.fail{fill:#FFF7ED;stroke:#FDBA74;stroke-width:2}
.head{font:700 20px Pretendard,'Noto Sans KR',sans-serif;fill:#111827;text-anchor:middle}.sub{font:16px Pretendard,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.retry{fill:none;stroke:#2563EB;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#retry)}
</style></defs><marker id="retry" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker>
<rect class="bg" width="1380" height="500" rx="16"/>
<path class="arrow" d="M240 145H305M555 145H620M830 145H900"/>
<path class="arrow" d="M1015 200V300H820"/><path class="arrow" d="M1015 200V300H1170"/>
<path class="arrow" d="M680 355H520M390 355H230M1170 400V445H820"/>
<rect class="box" x="25" y="95" width="215" height="100" rx="14"/><text class="head" x="132" y="153">관제 화면</text>
<rect class="box" x="305" y="95" width="250" height="100" rx="14"/><text class="head" x="430" y="138">명령 저장</text><text class="sub" x="430" y="170">데이터베이스 커밋</text>
<rect class="focus" x="620" y="95" width="210" height="100" rx="14"/><text class="head" x="725" y="153">MQTT 명령</text>
<rect class="box" x="900" y="95" width="230" height="105" rx="14"/><text class="head" x="1015" y="155">토잉카 장치</text>
<rect class="box" x="680" y="300" width="280" height="100" rx="14"/><text class="head" x="820" y="342">차량 상태 보고</text><text class="sub" x="820" y="375">실제 운행 상태</text>
<rect class="box" x="1030" y="300" width="280" height="100" rx="14"/><text class="head" x="1170" y="342">MQTT ACK</text><text class="sub" x="1170" y="375">명령 수신 확인</text>
<rect class="focus" x="280" y="300" width="240" height="100" rx="14"/><text class="head" x="400" y="358">서버 상태 갱신</text>
<rect class="box" x="25" y="300" width="205" height="100" rx="14"/><text class="head" x="127" y="358">WebSocket · STOMP</text>
<text class="sub" x="660" y="465">명령 수신 확인과 실제 운행 상태를 따로 처리</text>
</svg>