<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-label="영묘 온라인 게임 서버 흐름"><defs><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563eb"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#16a34a"/></marker><marker id="n" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker><style>.z{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.c{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.s{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.d{fill:#fffbeb;stroke:#fbbf24;stroke-width:2}.t{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:#0f172a}.zt{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#334155}.l{font:700 18px Arial,'Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle}.sm{font:600 14px Arial,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.note{font:600 13px Arial,'Noto Sans KR',sans-serif;fill:#64748b;text-anchor:middle}.fb{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#b)}.fg{fill:none;stroke:#16a34a;stroke-width:2.5;marker-end:url(#g)}.fn{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#n)}.lb{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#1d4ed8;text-anchor:middle}.lg{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#15803d;text-anchor:middle}.ln{font:700 13px Arial,'Noto Sans KR',sans-serif;fill:#334155;text-anchor:middle}</style></defs><rect width="1400" height="760" fill="#fff"/><text class="t" x="55" y="52">영묘 온라인 게임 서버 흐름</text><rect class="z" x="45" y="90" width="320" height="590" rx="22"/><text class="zt" x="75" y="128">게임 클라이언트</text><rect class="c" x="90" y="175" width="230" height="90" rx="15"/><text class="l" x="205" y="216">게임 로비 화면</text><text class="sm" x="205" y="240">방 생성과 참가자 연결</text><rect class="c" x="90" y="335" width="230" height="90" rx="15"/><text class="l" x="205" y="376">음성 입력과 재생</text><text class="sm" x="205" y="400">마이크 입력, 음성 압축, 재생</text><rect class="c" x="90" y="495" width="230" height="90" rx="15"/><text class="l" x="205" y="536">게임 플레이 화면</text><text class="sm" x="205" y="560">게임 조작</text><rect class="z" x="445" y="90" width="440" height="590" rx="22"/><text class="zt" x="475" y="128">C++ 게임 서버</text><text class="note" x="665" y="155">방 식별 코드로 로비, 음성, 게임 연결</text><rect class="s" x="500" y="175" width="220" height="90" rx="15"/><text class="l" x="610" y="216">로비 서버</text><text class="sm" x="610" y="240">실시간 정보 전달</text><rect class="s" x="500" y="335" width="220" height="90" rx="15"/><text class="l" x="610" y="376">음성 전달 서버</text><text class="sm" x="610" y="400">음성 데이터와 방 코드</text><rect class="s" x="500" y="495" width="220" height="90" rx="15"/><text class="l" x="610" y="536">게임 세션 관리</text><text class="sm" x="610" y="560">게임 연결 관리</text><rect class="z" x="970" y="90" width="385" height="590" rx="22"/><text class="zt" x="1000" y="128">언리얼 게임 진행 서버</text><rect class="d" x="1030" y="300" width="265" height="120" rx="16"/><text class="l" x="1162" y="348">한 판의 게임</text><text class="sm" x="1162" y="376">참가자 상태, 진행 단계, 아이템 생성</text><path class="fb" d="M320 205H500"/><text class="lb" x="410" y="191">방 만들기와 참가</text><path class="fg" d="M500 240H320"/><text class="lg" x="410" y="260">방과 참가자 상태</text><path class="fb" d="M320 365H500"/><text class="lb" x="410" y="351">참가, 음성 연결, 퇴장</text><path class="fg" d="M500 400H320"/><text class="lg" x="410" y="420">음성 데이터 전달</text><path class="fb" d="M320 525H400V640H930V335H1030"/><text class="lb" x="835" y="625">플레이어 조작 입력</text><path class="fg" d="M1030 390H950V610H420V560H320"/><text class="lg" x="825" y="598">게임 상태 전달</text><path class="fn" d="M720 220H800V470H660V495"/><text class="ln" x="772" y="455">게임 시작</text><path class="fn" d="M1030 420H900V455H760V540H720"/><text class="ln" x="845" y="442">참가, 준비, 종료</text></svg>