<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc">
  <title id="title">영묘 UDP 음성 전달 흐름</title>
  <desc id="desc">클라이언트가 마이크 음성을 Opus로 압축해 UDP로 보내면 음성 서버가 패킷을 확인하고 방 코드에 맞는 참가자를 찾아 중계합니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><style>
    .bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.focus{fill:#EFF6FF;stroke:#2563EB;stroke-width:2}.line{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.t{font:600 16px Pretendard,'Noto Sans KR',sans-serif;fill:#111827}.s{font:13px Pretendard,'Noto Sans KR',sans-serif;fill:#64748B}
  </style></defs>
  <rect class="bg" width="1120" height="300" rx="12"/>
  <rect class="box" x="24" y="103" width="190" height="90" rx="8"/><text class="t" x="119" y="141" text-anchor="middle">마이크 입력</text><text class="s" x="119" y="166" text-anchor="middle">Opus로 압축</text>
  <rect class="box" x="250" y="103" width="190" height="90" rx="8"/><text class="t" x="345" y="141" text-anchor="middle">UDP 음성 패킷</text><text class="s" x="345" y="166" text-anchor="middle">방 코드·자료 길이</text>
  <rect class="focus" x="476" y="103" width="190" height="90" rx="8"/><text class="t" x="571" y="141" text-anchor="middle">음성 서버 확인</text><text class="s" x="571" y="166" text-anchor="middle">패킷 형식·방 코드</text>
  <rect class="box" x="702" y="103" width="190" height="90" rx="8"/><text class="t" x="797" y="141" text-anchor="middle">같은 방 참가자 찾기</text><text class="s" x="797" y="166" text-anchor="middle">방 코드로 구분</text>
  <rect class="box" x="928" y="103" width="168" height="90" rx="8"/><text class="t" x="1012" y="141" text-anchor="middle">UDP 중계</text><text class="s" x="1012" y="166" text-anchor="middle">발신자 제외 후 전달</text>
  <path class="line" d="M214 148H250M440 148H476M666 148H702M892 148H928"/>
</svg>
