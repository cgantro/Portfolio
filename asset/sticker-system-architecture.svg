<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">STICKER 아키텍처</title>
  <desc id="desc">모바일 앱, 백엔드, 데이터 저장소와 비동기 AI 추천 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <symbol id="phone" viewBox="0 0 32 32"><g fill="none" stroke="#16a34a" stroke-width="2"><rect x="8" y="2" width="16" height="28" rx="3"/><path d="M13 6h6M14 26h4"/></g></symbol>
    <symbol id="serverIcon" viewBox="0 0 32 32"><g fill="none" stroke="#2563eb" stroke-width="2"><rect x="4" y="4" width="24" height="10" rx="2"/><rect x="4" y="18" width="24" height="10" rx="2"/><path d="M8 9h.1M8 23h.1M13 9h11M13 23h11"/></g></symbol>
    <symbol id="database" viewBox="0 0 32 32"><g fill="none" stroke="#ca8a04" stroke-width="2"><ellipse cx="16" cy="7" rx="11" ry="4"/><path d="M5 7v9c0 2 5 4 11 4s11-2 11-4V7M5 16v9c0 2 5 4 11 4s11-2 11-4v-9"/></g></symbol>
    <symbol id="cloud" viewBox="0 0 32 32"><path d="M9 26h16a6 6 0 0 0 1-12 10 10 0 0 0-19-1A7 7 0 0 0 9 26Z" fill="none" stroke="#ca8a04" stroke-width="2"/></symbol>
    <symbol id="queue" viewBox="0 0 32 32"><g fill="none" stroke="#9333ea" stroke-width="2"><rect x="4" y="5" width="24" height="6" rx="2"/><rect x="4" y="13" width="24" height="6" rx="2"/><rect x="4" y="21" width="24" height="6" rx="2"/></g></symbol>
    <symbol id="brain" viewBox="0 0 32 32"><path d="M13 28a6 6 0 0 1-5-9 6 6 0 0 1 1-11 6 6 0 0 1 11-2 6 6 0 0 1 5 10 6 6 0 0 1-5 11c-2 0-3-1-4-2-1 2-2 3-3 3Z" fill="none" stroke="#9333ea" stroke-width="2"/><path d="M16 7v18M10 12c3 0 4 2 6 4M22 12c-3 0-4 2-6 4" fill="none" stroke="#9333ea" stroke-width="2"/></symbol>
    <style>
      .zone{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.client{fill:#f0fdf4;stroke:#4ade80;stroke-width:2}.app{fill:#eff6ff;stroke:#60a5fa;stroke-width:2}.data{fill:#fefce8;stroke:#facc15;stroke-width:2}.ai{fill:#faf5ff;stroke:#c084fc;stroke-width:2}.label{font:700 20px Arial,'Noto Sans KR',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:600 15px Arial,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.zoneTitle{font:700 17px Arial,'Noto Sans KR',sans-serif;fill:#334155}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#fff"/>
  <text x="60" y="55" style="font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#0f172a">STICKER Architecture</text>

  <rect class="zone" x="50" y="95" width="250" height="500" rx="22"/><text class="zoneTitle" x="78" y="130">Client</text>
  <rect class="client" x="80" y="255" width="190" height="100" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg" x="159" y="263" width="32" height="32"/><text class="label" x="175" y="319">Fashion App</text><text class="small" x="175" y="342">React Native</text>

  <rect class="zone" x="360" y="95" width="470" height="500" rx="22"/><text class="zoneTitle" x="388" y="130">Backend</text>
  <rect class="app" x="400" y="180" width="190" height="90" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/traefikproxy/traefikproxy-original.svg" x="481" y="188" width="28" height="28"/><text class="label" x="495" y="239">Traefik</text><text class="small" x="495" y="260">Gateway</text>
  <rect class="app" x="600" y="180" width="190" height="90" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/spring/spring-original.svg" x="681" y="188" width="28" height="28"/><text class="label" x="695" y="239">Spring Boot</text><text class="small" x="695" y="260">REST API</text>
  <rect class="data" x="400" y="355" width="170" height="90" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/postgresql/postgresql-original.svg" x="471" y="363" width="28" height="28"/><text class="label" x="485" y="414">PostgreSQL</text><text class="small" x="485" y="435">Data</text>
  <rect class="data" x="610" y="355" width="170" height="90" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/redis/redis-original.svg" x="681" y="363" width="28" height="28"/><text class="label" x="695" y="414">Redis</text><text class="small" x="695" y="435">Cache · Token</text>
  <rect class="data" x="505" y="480" width="170" height="80" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/amazonwebservices/amazonwebservices-original-wordmark.svg" x="572" y="488" width="36" height="28"/><text class="label" x="590" y="544">AWS S3</text>

  <rect class="zone" x="890" y="95" width="260" height="500" rx="22"/><text class="zoneTitle" x="918" y="130">AI Recommendation</text>
  <rect class="ai" x="925" y="200" width="190" height="90" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/amazonwebservices/amazonwebservices-original-wordmark.svg" x="1002" y="208" width="36" height="28"/><text class="label" x="1020" y="259">AWS SQS</text><text class="small" x="1020" y="280">Jobs · Results</text>
  <rect class="ai" x="925" y="390" width="190" height="90" rx="14"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/fastapi/fastapi-original.svg" x="1006" y="398" width="28" height="28"/><text class="label" x="1020" y="449">AI Server</text><text class="small" x="1020" y="470">FastAPI</text>

  <path class="line" d="M270 305H330V225H400"/><path class="line" d="M590 225H600"/>
  <path class="line" d="M695 270V355"/><path class="line" d="M650 270V320H485V355"/><path class="line" d="M740 270V520H675"/>
  <path class="line" d="M790 225H925"/><path class="line" d="M1020 290V390"/><path class="line" d="M925 435H850V260H790"/>
  <text class="small" x="850" y="211">Async</text>
</svg>
