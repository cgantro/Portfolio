<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">운행 기록을 묶어 저장하고 실패한 기록을 다시 처리하는 흐름</title>
  <desc id="desc">차량 상태 저장이 끝난 뒤 운행 기록을 보관합니다. 별도 저장 프로그램이 기록을 묶어 데이터베이스에 저장하고, 성공하면 완료 처리합니다. 저장에 실패하면 기록을 남겨 다시 시도합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B" />
    </marker>
    <marker id="retry-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB" />
    </marker>
    <style>
      .bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.accent{fill:#EFF6FF;stroke:#2563EB;stroke-width:2}.success{fill:#F0FDF4;stroke:#16A34A;stroke-width:2}.label{font:700 19px Pretendard,Arial,sans-serif;fill:#111827}.small{font:15px Pretendard,Arial,sans-serif;fill:#475569}.arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.retry{fill:none;stroke:#2563EB;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#retry-arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="390" rx="16" />
  <text class="label" x="36" y="44">운행 기록 저장</text>

  <rect class="box" x="36" y="105" width="195" height="94" rx="12" />
  <text class="label" x="133" y="143" text-anchor="middle">차량 상태 저장</text>
  <text class="small" x="133" y="171" text-anchor="middle">저장 완료</text>

  <path class="arrow" d="M237 152 H284" />
  <rect class="accent" x="294" y="105" width="195" height="94" rx="12" />
  <text class="label" x="391" y="143" text-anchor="middle">운행 기록 보관</text>
  <text class="small" x="391" y="171" text-anchor="middle">Redis Streams</text>

  <path class="arrow" d="M495 152 H542" />
  <rect class="accent" x="552" y="105" width="195" height="94" rx="12" />
  <text class="label" x="649" y="143" text-anchor="middle">별도 저장 프로그램</text>
  <text class="small" x="649" y="171" text-anchor="middle">기록을 묶어 읽기</text>

  <path class="arrow" d="M753 152 H800" />
  <rect class="box" x="810" y="105" width="195" height="94" rx="12" />
  <text class="label" x="907" y="143" text-anchor="middle">데이터베이스 저장</text>
  <text class="small" x="907" y="171" text-anchor="middle">한 번에 여러 건 기록</text>

  <path class="arrow" d="M1011 152 H1058" />
  <rect class="success" x="1068" y="105" width="96" height="94" rx="12" />
  <text class="label" x="1116" y="143" text-anchor="middle">완료</text>
  <text class="small" x="1116" y="171" text-anchor="middle">저장 뒤</text>

  <path class="retry" d="M907 207 V276 H650 V207" />
  <rect x="631" y="254" width="545" height="54" rx="10" fill="#EFF6FF" />
  <text class="small" x="903" y="287" text-anchor="middle">저장 실패: 완료 처리하지 않고 기록을 남겨 다시 시도</text>

  <text class="small" x="36" y="356">데이터베이스에 저장된 뒤에만 기록을 완료 처리합니다.</text>
</svg>
