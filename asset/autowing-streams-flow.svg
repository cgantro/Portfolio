<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="620" viewBox="0 0 1560 620" role="img" aria-labelledby="title desc">
<title id="title">차량 보고를 DB에 바로 저장하는 방식과 Redis를 나눈 방식</title>
<desc id="desc">왼쪽은 차량 보고마다 PostgreSQL에서 최신 상태를 갱신하고 이력을 추가하며, 관제 조회도 같은 데이터베이스를 쓰는 경우입니다. 오른쪽은 최신 상태를 Redis에 보관해 WebSocket으로 전달하고, 운행 이력은 Redis Streams에 모아 PostgreSQL에 묶음 저장하는 구조입니다.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748B"/></marker>
  <marker id="query" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#64748B"/></marker>
  <style>
    .bg{fill:#fff}.old{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}.new{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2}
    .node{fill:#fff;stroke:#CBD5E1;stroke-width:2}.focus{fill:#fff;stroke:#60A5FA;stroke-width:2}.warn{fill:#FFF7ED;stroke:#FDBA74;stroke-width:2}
    .heading{font:700 25px Pretendard,'Noto Sans KR',sans-serif;fill:#111827}.title{font:700 20px Pretendard,'Noto Sans KR',sans-serif;fill:#111827;text-anchor:middle}
    .sub{font:15px Pretendard,'Noto Sans KR',sans-serif;fill:#475569;text-anchor:middle}.risk{font:650 18px Pretendard,'Noto Sans KR',sans-serif;fill:#9A3412;text-anchor:middle}
    .arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.query-arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#query)}
  </style>
</defs>
<rect class="bg" width="1560" height="620"/>
<rect class="old" x="25" y="70" width="735" height="520" rx="22"/>
<rect class="new" x="790" y="70" width="745" height="520" rx="22"/>
<text class="heading" x="55" y="115">Redis 없이 처리</text>
<text class="heading" x="820" y="115">상태와 이력을 Redis로 분리</text>
<!-- 직접 DB 저장 -->
<path class="arrow" d="M225 290H285"/>
<path class="query-arrow" d="M610 330H555"/>
<rect class="node" x="55" y="245" width="170" height="100" rx="14"/>
<text class="title" x="140" y="286">MQTT 보고</text><text class="sub" x="140" y="318">위치·상태</text>
<rect class="node" x="285" y="205" width="270" height="180" rx="14"/>
<text class="title" x="420" y="247">PostgreSQL</text>
<text class="sub" x="420" y="285">최신 상태 갱신</text><text class="sub" x="420" y="320">운행 이력 추가</text>
<rect class="node" x="610" y="245" width="125" height="100" rx="14"/>
<text class="title" x="672" y="286">관제 조회</text><text class="sub" x="672" y="318">차량·이력</text>
<rect class="warn" x="105" y="440" width="575" height="105" rx="14"/>
<text class="risk" x="392" y="482">보고마다 DB 쓰기 요청</text><text class="sub" x="392" y="517">커넥션 대기와 조회 지연이 생길 수 있음</text>
<!-- Redis 최신 상태 경로 -->
<path class="arrow" d="M955 280H1005M1170 205H1215M1355 205H1390"/>
<path class="arrow" d="M955 310H980V410H1005M1170 410H1215M1355 410H1390"/>
<rect class="node" x="815" y="260" width="140" height="100" rx="14"/>
<text class="title" x="885" y="301">MQTT 보고</text><text class="sub" x="885" y="333">위치·상태</text>
<rect class="focus" x="1005" y="160" width="165" height="90" rx="14"/>
<text class="title" x="1087" y="199">Redis</text><text class="sub" x="1087" y="228">최신 상태</text>
<rect class="node" x="1215" y="160" width="140" height="90" rx="14"/>
<text class="title" x="1285" y="199">WebSocket</text><text class="sub" x="1285" y="228">상태 전달</text>
<rect class="node" x="1390" y="160" width="125" height="90" rx="14"/>
<text class="title" x="1452" y="199">관제 화면</text><text class="sub" x="1452" y="228">실시간 갱신</text>
<!-- 운행 이력 보존 경로 -->
<rect class="focus" x="1005" y="365" width="165" height="90" rx="14"/>
<text class="title" x="1087" y="404">Redis Streams</text><text class="sub" x="1087" y="433">운행 이력</text>
<rect class="node" x="1215" y="365" width="140" height="90" rx="14"/>
<text class="title" x="1285" y="404">묶음 저장</text><text class="sub" x="1285" y="433">재시도 가능</text>
<rect class="node" x="1390" y="365" width="125" height="90" rx="14"/>
<text class="title" x="1452" y="404">PostgreSQL</text><text class="sub" x="1452" y="433">운행 이력</text>
</svg>
