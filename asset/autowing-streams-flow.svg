<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">운행 기록 저장 순서</title>
  <desc id="desc">차량 상태를 저장한 뒤 운행 기록을 모읍니다. 모은 기록을 데이터베이스에 저장하고, 저장에 실패하면 다시 시도합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748B"/>
    </marker>
    <marker id="retry-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563EB"/>
    </marker>
    <style>
      .background{fill:#F8FAFC}
      .box{fill:#fff;stroke:#CBD5E1;stroke-width:2}
      .focus{fill:#EFF6FF;stroke:#60A5FA;stroke-width:2}
      .success{fill:#F0FDF4;stroke:#22C55E;stroke-width:2}
      .title{font:700 19px Pretendard,Arial,sans-serif;fill:#111827}
      .detail{font:15px Pretendard,Arial,sans-serif;fill:#475569}
      .arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
      .retry{fill:none;stroke:#2563EB;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#retry-arrow)}
    </style>
  </defs>
  <rect class="background" width="1200" height="300" rx="16"/>

  <rect class="box" x="35" y="72" width="225" height="92" rx="12"/>
  <text class="title" x="147" y="111" text-anchor="middle">차량 상태 저장</text>
  <text class="detail" x="147" y="139" text-anchor="middle">현재 운행 정보 갱신</text>

  <path class="arrow" d="M266 118H316"/>
  <rect class="focus" x="326" y="72" width="225" height="92" rx="12"/>
  <text class="title" x="438" y="111" text-anchor="middle">운행 기록 모으기</text>
  <text class="detail" x="438" y="139" text-anchor="middle">Redis Streams</text>

  <path class="arrow" d="M557 118H607"/>
  <rect class="box" x="617" y="72" width="225" height="92" rx="12"/>
  <text class="title" x="729" y="111" text-anchor="middle">여러 기록 저장</text>
  <text class="detail" x="729" y="139" text-anchor="middle">데이터베이스</text>

  <path class="arrow" d="M848 118H898"/>
  <rect class="success" x="908" y="72" width="255" height="92" rx="12"/>
  <text class="title" x="1035" y="111" text-anchor="middle">저장 확인</text>
  <text class="detail" x="1035" y="139" text-anchor="middle">기록을 완료 처리</text>

  <path class="retry" d="M729 172V228H438V172"/>
  <rect x="493" y="207" width="402" height="42" rx="9" fill="#EFF6FF"/>
  <text class="detail" x="694" y="234" text-anchor="middle">저장에 실패하면 기록을 남겨 다시 시도</text>
</svg>
