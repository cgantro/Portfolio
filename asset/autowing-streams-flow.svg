<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AutoWingCar 운행 로그 저장 및 재처리 흐름</title>
  <desc id="desc">차량 상태 트랜잭션 커밋 뒤 운행 로그를 Redis Streams에 적재한다. 소비자가 pending 레코드를 먼저 읽고 JDBC 일괄 저장을 수행한 뒤 데이터베이스 커밋을 확인하고 Redis에 ACK한다. DB 저장에 실패하면 ACK하지 않아 재처리할 수 있다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B" />
    </marker>
    <style>
      .bg{fill:#F8FAFC}.box{fill:#fff;stroke:#CBD5E1;stroke-width:2}.accent{fill:#EFF6FF;stroke:#2563EB;stroke-width:2}.success{fill:#F0FDF4;stroke:#22C55E;stroke-width:2}.label{font:700 18px Pretendard,Arial,sans-serif;fill:#111827}.small{font:14px Pretendard,Arial,sans-serif;fill:#475569}.arrow{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}.return{fill:none;stroke:#2563EB;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="360" rx="16" />
  <text class="label" x="32" y="43">운행 로그 저장과 재처리</text>
  <rect class="box" x="36" y="116" width="200" height="88" rx="10" />
  <text class="label" x="136" y="151" text-anchor="middle">차량 상태 저장</text>
  <text class="small" x="136" y="177" text-anchor="middle">DB 트랜잭션</text>
  <path class="arrow" d="M242 160 H290" />
  <rect class="accent" x="300" y="116" width="200" height="88" rx="10" />
  <text class="label" x="400" y="151" text-anchor="middle">커밋 뒤 XADD</text>
  <text class="small" x="400" y="177" text-anchor="middle">Redis Streams 적재</text>
  <path class="arrow" d="M506 160 H554" />
  <rect class="accent" x="564" y="116" width="200" height="88" rx="10" />
  <text class="label" x="664" y="151" text-anchor="middle">소비자</text>
  <text class="small" x="664" y="177" text-anchor="middle">pending 먼저 읽기</text>
  <path class="arrow" d="M770 160 H818" />
  <rect class="box" x="828" y="116" width="200" height="88" rx="10" />
  <text class="label" x="928" y="151" text-anchor="middle">JDBC 일괄 저장</text>
  <text class="small" x="928" y="177" text-anchor="middle">고정 ID · ON CONFLICT</text>
  <path class="arrow" d="M1034 160 H1082" />
  <rect class="success" x="1092" y="116" width="78" height="88" rx="10" />
  <text class="label" x="1131" y="151" text-anchor="middle">ACK</text>
  <text class="small" x="1131" y="177" text-anchor="middle">DB 뒤</text>
  <path class="return" d="M928 210 V270 H664 V210" />
  <text class="small" x="796" y="295" text-anchor="middle">DB 저장 실패: ACK하지 않고 pending 상태로 남겨 재처리</text>
  <path class="return" d="M1130 210 V326 H400 V210" />
  <text class="small" x="770" y="346" text-anchor="middle">ACK 후 Stream 항목 정리</text>
</svg>
