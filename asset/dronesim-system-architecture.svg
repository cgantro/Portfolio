<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
  <title id="title">DroneSim 시스템 아키텍처</title>
  <desc id="desc">게임패드, UDP 지상통제, 화면 없는 시나리오 입력이 공통 시뮬레이션 중심부에 연결됩니다. Tick 상태는 네이티브 AirSim 강체 모델 또는 WebAssembly 운동학 모델을 거쳐 OpenGL 장면과 EO 카메라로 이어집니다. 네이티브는 H.264/RTP 영상과 MP4·JSONL 촬영 기록을 전달하고, 웹은 WebM·PNG·JSON 파일을 저장합니다.</desc>
  <defs>
    <style>
      .bg{fill:#f5f4ef}.box{fill:#fff;stroke:#cbd1c7;stroke-width:2}.core{fill:#182421;stroke:#182421;stroke-width:2}.soft{fill:#e8ece5;stroke:#bdc8bb;stroke-width:2}.optional{fill:#fbf2e9;stroke:#d8a27d;stroke-width:2}.title{font:700 22px sans-serif;fill:#182421}.small{font:15px sans-serif;fill:#536057}.white{fill:#fff}.tiny{font:13px sans-serif;fill:#657068}.line{fill:none;stroke:#66766a;stroke-width:3;marker-end:url(#arrow)}.dash{fill:none;stroke:#b73518;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arrowRed)}.label{font:12px sans-serif;fill:#657068}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#66766a"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b73518"/></marker>
  </defs>
  <rect class="bg" width="1400" height="850"/>
  <text x="64" y="62" class="small">DRONESIM / SYSTEM ARCHITECTURE</text>
  <text x="64" y="108" class="title" style="font-size:34px">입력 경로를 공유하는 고정 Tick 시뮬레이션</text>
  <text x="64" y="140" class="small">화면 실행과 화면 없는 검증이 같은 SimulationCore를 호출합니다.</text>

  <rect class="box" x="70" y="220" width="260" height="105" rx="8"/>
  <text class="title" x="100" y="261">게임패드</text><text class="small" x="100" y="291">수동 비행 입력</text>
  <rect class="box" x="70" y="370" width="260" height="105" rx="8"/>
  <text class="title" x="100" y="411">UDP 지상통제</text><text class="small" x="100" y="441">명령 · 상태 응답</text>
  <rect class="box" x="70" y="520" width="260" height="105" rx="8"/>
  <text class="title" x="100" y="561">JSON 시나리오</text><text class="small" x="100" y="591">화면 없는 시험 · 장애 재현</text>

  <rect class="core" x="465" y="350" width="350" height="180" rx="10"/>
  <text class="title white" x="510" y="402">SimulationCore</text>
  <text class="small white" x="510" y="439">Flecs 상태 갱신 · 고정 1/60초 Tick</text>
  <text class="small white" x="510" y="474">드론 · 카메라 · 명령 · 임무 진행</text>

  <rect class="optional" x="965" y="190" width="350" height="115" rx="8"/>
  <text class="title" x="1000" y="232">AirSim 강체 물리</text>
  <text class="small" x="1000" y="263">Windows 네이티브 · 로터·관성·접촉</text>

  <rect class="soft" x="965" y="340" width="350" height="105" rx="8"/>
  <text class="title" x="1000" y="382">운동학 기준 모델</text>
  <text class="small" x="1000" y="414">WebAssembly · 단순 비행 규칙</text>

  <rect class="soft" x="965" y="480" width="350" height="105" rx="8"/>
  <text class="title" x="1000" y="522">장면 렌더링</text>
  <text class="small" x="1000" y="554">OpenGL · 지형 · 드론 상태</text>

  <rect class="soft" x="965" y="630" width="350" height="115" rx="8"/>
  <text class="title" x="1000" y="672">EO 카메라 · 영상 분석</text>
  <text class="small" x="1000" y="703">별도 화면 · OpenCV 품질 지표</text>
  <text class="tiny" x="1000" y="728">밝기 · 대비 · 선명도</text>

  <path class="line" d="M330 272H400V390H465"/><text class="label" x="365" y="255">입력 변환</text>
  <path class="line" d="M330 422H465"/><text class="label" x="365" y="410">공통 명령</text>
  <path class="line" d="M330 572H400V490H465"/><text class="label" x="365" y="592">같은 Tick 실행</text>
  <path class="dash" d="M815 375H890V248H965"/><text class="label" x="836" y="231">네이티브 전용</text>
  <path class="line" d="M815 410H965"/><text class="label" x="838" y="397">웹·선택 실행</text>
  <path class="line" d="M815 455H890V532H965"/><text class="label" x="839" y="516">계산 결과</text>
  <path class="line" d="M815 495H910V687H965"/><text class="label" x="839" y="672">카메라 상태 동기화</text>

  <rect class="box" x="465" y="805" width="850" height="185" rx="10"/>
  <text class="title" x="500" y="847">외벽 EO 촬영 자료 전달</text>
  <rect class="soft" x="495" y="875" width="245" height="82" rx="8"/>
  <text class="title" x="520" y="908">네이티브 실시간 영상</text>
  <text class="small" x="520" y="935">H.264 / RTP 송수신</text>
  <rect class="soft" x="760" y="875" width="245" height="82" rx="8"/>
  <text class="title" x="785" y="908">녹화·촬영 기록</text>
  <text class="small" x="785" y="935">MP4 · JSONL → TCP · CRC-32</text>
  <rect class="soft" x="1025" y="875" width="260" height="82" rx="8"/>
  <text class="title" x="1050" y="908">웹 촬영 자료</text>
  <text class="small" x="1050" y="935">WebM · PNG · JSON 내려받기</text>
  <path class="line" d="M1100 745V780H620V875"/>
  <path class="line" d="M1100 745V780H880V875"/>
  <path class="line" d="M1100 745V780H1155V875"/>
</svg>
